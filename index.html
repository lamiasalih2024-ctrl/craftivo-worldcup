<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تغطية كأس العالم 2026 | Craftivo</title>
    <style>
        body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; font-size: 20px; }
        .header { text-align: center; padding: 25px; border-bottom: 2px solid #D4AF37; }
        .main-title { font-size: 4em; font-weight: 900; color: #D4AF37; text-shadow: 0 0 20px #D4AF37; margin: 0; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .logo-ball { width: 60px; animation: rotate 3s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .sub-title { color: #aaa; margin: 10px 0; }
        .tabs { display: flex; justify-content: center; gap: 5px; margin: 20px 0; flex-wrap: wrap; }
        .tab { padding: 10px 20px; background: #222; border: 1px solid #444; cursor: pointer; color: #D4AF37; border-radius: 5px; font-weight: bold; font-size: 20px; }
        .tab.active { background: #D4AF37; color: #000; }
        .page { display: none; padding: 20px; max-width: 900px; margin: auto; }
        .page.active { display: block; }
        .group-card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .group-title { color: #D4AF37; font-weight: bold; text-align: center; margin-bottom: 10px; border-bottom: 1px solid #444; font-size: 28px; }
        .match-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #222; font-size: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 18px; margin-top: 15px; }
        th { padding: 10px; background: #D4AF37; color: black; }
        td { padding: 8px; border-bottom: 1px solid #333; }
        .footer { text-align: center; padding: 30px; border-top: 1px solid #333; margin-top: 50px; color: #D4AF37; font-weight: bold; }
        @keyframes blink { 50% { opacity: 0; } }
        .live-dot { height: 10px; width: 10px; background-color: red; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
    </style>
</head>
<body>
<div class="header">
    <h1 class="main-title"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccerball.svg" class="logo-ball"> CRAFTIVO</h1>
    <p class="sub-title">تغطية كأس العالم 2026 | بتوقيت مكة المكرمة</p>
</div>
<div class="tabs">
    <div class="tab active" onclick="showPage('live', this)">المباشر</div>
    <div class="tab" onclick="showPage('archive', this)">الأرشيف</div>
    <div class="tab" onclick="showPage('upcoming', this)">المباريات القادمة</div>
    <div class="tab" onclick="showPage('knockout', this)">الإقصائيات</div>
</div>
<div id="live" class="page active"><h3>مباشر <span class="live-dot"></span></h3><p style="animation: blink 2s infinite;">جاري التحديث...</p></div>
<div id="archive" class="page"><div id="archiveContainer"></div></div>
<div id="upcoming" class="page"><div id="upcomingContainer"></div></div>
<div id="knockout" class="page"><div id="knockoutContainer"></div></div>
<div class="footer">Craft TV ♡ LMS</div> <script>
    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    const archiveData = [
        {n: "أ", m: [{t1: "🇲🇽 المكسيك", s: "2-0", t2: "🇿🇦 جنوب أفريقيا"}, {t1: "🇰🇷 كوريا الجنوبية", s: "2-1", t2: "🇨🇿 التشيك"}, {t1: "🇨🇿 التشيك", s: "1-1", t2: "🇿🇦 جنوب أفريقيا"}, {t1: "🇲🇽 المكسيك", s: "1-0", t2: "🇰🇷 كوريا الجنوبية"}]},
        {n: "ب", m: [{t1: "🇨🇦 كندا", s: "1-1", t2: "🇧🇦 البوسنة والهرسك"}, {t1: "🇶🇦 قطر", s: "1-1", t2: "🇨🇭 سويسرا"}, {t1: "🇨🇭 سويسرا", s: "4-1", t2: "🇧🇦 البوسنة والهرسك"}, {t1: "🇨🇦 كندا", s: "6-0", t2: "🇶🇦 قطر"}]},
        {n: "ج", m: [{t1: "🇧🇷 البرازيل", s: "1-1", t2: "🇲🇦 المغرب"}, {t1: "🇭🇹 هايتي", s: "0-1", t2: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا"}, {t1: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا", s: "0-1", t2: "🇲🇦 المغرب"}, {t1: "🇧🇷 البرازيل", s: "3-0", t2: "🇭🇹 هايتي"}]},
        {n: "د", m: [{t1: "🇺🇸 أمريكا", s: "4-1", t2: "🇵🇾 باراغواي"}, {t1: "🇦🇺 أستراليا", s: "2-0", t2: "🇹🇷 تركيا"}, {t1: "🇺🇸 أمريكا", s: "2-0", t2: "🇦🇺 أستراليا"}, {t1: "🇹🇷 تركيا", s: "0-1", t2: "🇵🇾 باراغواي"}]},
        {n: "هـ", m: [{t1: "🇩🇪 ألمانيا", s: "7-1", t2: "🇨🇼 كوراساو"}, {t1: "🇨🇮 ساحل العاج", s: "1-0", t2: "🇪🇨 الإكوادور"}]},
        {n: "و", m: [{t1: "🇳🇱 هولندا", s: "2-2", t2: "🇯🇵 اليابان"}, {t1: "🇸🇪 السويد", s: "5-1", t2: "🇹🇳 تونس"}, {t1: "🇳🇱 هولندا", s: "5-1", t2: "🇸🇪 السويد"}]},
        {n: "ز", m: [{t1: "🇧🇪 بلجيكا", s: "1-1", t2: "🇪🇬 مصر"}, {t1: "🇮🇷 إيران", s: "2-2", t2: "🇳🇿 نيوزيلندا"}]},
        {n: "ح", m: [{t1: "🇪🇸 إسبانيا", s: "0-0", t2: "🇨🇻 الرأس الأخضر"}, {t1: "🇸🇦 السعودية", s: "1-1", t2: "🇺🇾 أوروغواي"}]},
        {n: "ط", m: [{t1: "🇫🇷 فرنسا", s: "3-1", t2: "🇸🇳 السنغال"}, {t1: "🇮🇶 العراق", s: "1-4", t2: "🇳🇴 النرويج"}]},
        {n: "ي", m: [{t1: "🇦🇹 النمسا", s: "3-1", t2: "🇯🇴 الأردن"}, {t1: "🇦🇷 الأرجنتين", s: "3-0", t2: "🇩🇿 الجزائر"}]},
        {n: "ك", m: [{t1: "🇵🇹 البرتغال", s: "1-1", t2: "🇨🇩 الكونغو"}, {t1: "🇺🇿 أوزبكستان", s: "1-3", t2: "🇨🇴 كولومبيا"}]},
        {n: "ل", m: [{t1: "🏴󠁧󠁢󠁥󠁮󠁧󠁿 إنجلترا", s: "4-2", t2: "🇭🇷 كرواتيا"}, {t1: "🇬🇭 غانا", s: "1-0", t2: "🇵🇦 بنما"}]}
    ];

    function calc(m) {
        let t = {};
        m.forEach(match => {
            let [g1, g2] = match.s.split('-').map(Number);
            [match.t1, match.t2].forEach(n => { if(!t[n]) t[n] = {p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0}; });
            t[match.t1].p++; t[match.t2].p++;
            t[match.t1].gf += g1; t[match.t1].ga += g2;
            t[match.t2].gf += g2; t[match.t2].ga += g1;
            if(g1 > g2) { t[match.t1].w++; t[match.t1].pts += 3; t[match.t2].l++; }
            else if(g2 > g1) { t[match.t2].w++; t[match.t2].pts += 3; t[match.t1].l++; }
            else { t[match.t1].d++; t[match.t2].d++; t[match.t1].pts++; t[match.t2].pts++; }
        });
        return Object.entries(t).map(([name, s]) => ({name, ...s, gd: s.gf - s.ga})).sort((a,b) => b.pts - a.pts || b.gd - a.gd);
    }

    const arcCont = document.getElementById('archiveContainer');
    archiveData.forEach(g => {
        let h = `<div class="group-card"><div class="group-title">المجموعة ${g.n}</div>`;
        g.m.forEach(m => h += `<div class="match-row"><span>${m.t1}</span><span style="color:#D4AF37;font-weight:bold;">${m.s}</span><span>${m.t2}</span></div>`);
        h += `<table><tr><th>الفريق</th><th>ل</th><th>ف</th><th>ت</th><th>خ</th><th>له</th><th>عليه</th><th>+/-</th><th>ن</th></tr>`;
        calc(g.m).forEach(t => h += `<tr><td>${t.name}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gd}</td><td><strong>${t.pts}</strong></td></tr>`);
        arcCont.innerHTML += h + `</table></div>`;
    });
</script>
