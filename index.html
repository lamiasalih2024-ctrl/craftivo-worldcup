<style>
    body { background-color: #0b0e14; color: #ffffff; font-family: 'Arial', sans-serif; padding: 20px; direction: rtl; }
    .brand-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #D4AF37; padding-bottom: 20px; }
    .brand-title { color: #D4AF37; font-size: 3.5em; font-weight: 900; text-transform: uppercase; margin: 0; }
    .event-title { color: #ffffff; font-size: 1.8em; margin: 10px 0; font-weight: bold; }
    .timezone { color: #D4AF37; font-size: 1.3em; font-weight: bold; }
    .tabs { display: flex; justify-content: space-around; margin-bottom: 25px; }
    .tab-btn { background: #1a1a1a; color: #D4AF37; border: 2px solid #D4AF37; padding: 12px; flex: 1; margin: 0 5px; border-radius: 10px; cursor: pointer; font-size: 1.2em; font-weight: bold; }
    .tab-btn.active { background: #D4AF37; color: #000; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .group-card { background: #1a1a1a; border: 3px solid #D4AF37; border-radius: 20px; padding: 20px; margin-bottom: 25px; }
    .group-title { color: #D4AF37; font-size: 2em; text-align: center; margin-bottom: 15px; font-weight: bold; }
    .match-row { text-align: center; font-size: 1.4em; padding: 12px 0; border-bottom: 1px dashed #444; color: #fff; }
    .points-bar { background: #000; padding: 15px; border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 1.1em; color: #D4AF37; font-weight: bold; margin-top: 10px; text-align: center; }
    .live-indicator { color: #FF0000; font-size: 1.8em; font-weight: bold; text-align: center; padding: 30px; display: flex; justify-content: center; align-items: center; gap: 10px; }
    .pulse { width: 20px; height: 20px; background: red; border-radius: 50%; box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(0.9); } 70% { box-shadow: 0 0 0 15px rgba(255, 0, 0, 0); } 100% { transform: scale(0.9); } }
    .footer { text-align: center; margin-top: 40px; color: #ffffff; font-size: 1.4em; }
</style>

<div class="brand-header">
    <h1 class="brand-title">CRAFTIVO</h1>
    <h2 class="event-title">تغطية كأس العالم 2026</h2>
    <p class="timezone">بتوقيت مكة المكرمة</p>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="showTab(event, 'live')">مباشر</button>
    <button class="tab-btn" onclick="showTab(event, 'archive')">الأرشيف</button>
    <button class="tab-btn" onclick="showTab(event, 'upcoming')">القادمة</button>
    <button class="tab-btn" onclick="showTab(event, 'knockout')">الإقصائيات</button>
</div>

<div id="live" class="tab-content active">
    <div class="live-indicator"><div class="pulse"></div> مباشر</div>
    <h3 style="text-align:center;">جاري التحديث...</h3>
</div>

<div id="archive" class="tab-content">
    <script>
        const groups = [
            {name: "A", matches: ["🇿🇦 جنوب أفريقيا (2) - (0) 🇲🇽 المكسيك", "🇨🇿 التشيك (1) - (2) 🇰🇷 كوريا الجنوبية"], points: "المكسيك: 3 | كوريا: 3 | ج.أفريقيا: 0 | التشيك: 0"},
            {name: "B", matches: ["🇨🇦 كندا (1) - (1) 🇧🇦 البوسنة", "🇶🇦 قطر (1) - (1) 🇨🇭 سويسرا"], points: "كندا: 1 | البوسنة: 1 | قطر: 1 | سويسرا: 1"},
            {name: "C", matches: ["🇧🇷 البرازيل (1) - (1) 🇲🇦 المغرب", "🏴󠁧󠁢󠁳󠁣󠁴󠁿 اسكتلندا (1) - (0) 🇭🇹 هايتي"], points: "البرازيل: 1 | المغرب: 1 | اسكتلندا: 3 | هايتي: 0"},
            {name: "D", matches: ["🇺🇸 أمريكا (4) - (1) 🇵🇾 باراغواي", "🇦🇺 أستراليا (2) - (0) 🇹🇷 تركيا"], points: "أمريكا: 3 | باراغواي: 0 | أستراليا: 3 | تركيا: 0"},
            {name: "E", matches: ["🇩🇪 ألمانيا (7) - (1) 🇨🇼 كوراساو", "🇨🇮 كوت ديفوار (1) - (0) 🇪🇨 الإكوادور"], points: "ألمانيا: 3 | كوراساو: 0 | كوت ديفوار: 3 | الإكوادور: 0"},
            {name: "F", matches: ["🇳🇱 هولندا (2) - (2) 🇯🇵 اليابان", "🇸🇪 السويد (5) - (1) 🇹🇳 تونس"], points: "هولندا: 1 | اليابان: 1 | السويد: 3 | تونس: 0"},
            {name: "G", matches: ["🇧🇪 بلجيكا (1) - (1) 🇪🇬 مصر", "🇮🇷 إيران (2) - (2) 🇳🇿 نيوزيلندا"], points: "بلجيكا: 1 | مصر: 1 | إيران: 1 | نيوزيلندا: 1"},
            {name: "H", matches: ["🇸🇦 السعودية (1) - (1) 🇺🇾 أوروغواي", "🇪🇸 إسبانيا (0) - (0) 🇨🇻 الرأس الأخضر"], points: "السعودية: 1 | أوروغواي: 1 | إسبانيا: 1 | الرأس الأخضر: 1"},
            {name: "I", matches: ["🇫🇷 فرنسا (3) - (1) 🇸🇳 السنغال", "🇮🇶 العراق (1) - (4) 🇳🇴 النرويج"], points: "فرنسا: 3 | السنغال: 0 | النرويج: 3 | العراق: 0"},
            {name: "J", matches: ["🇦🇷 الأرجنتين (3) - (0) 🇩🇿 الجزائر", "🇦🇹 النمسا (3) - (1) 🇯🇴 الأردن"], points: "الأرجنتين: 3 | الجزائر: 0 | النمسا: 3 | الأردن: 0"},
            {name: "K", matches: ["🇵🇹 البرتغال (1) - (1) 🇨🇩 الكونغو الديمقراطية", "🇺🇿 أوزبكستان (1) - (3) 🇨🇴 كولومبيا"], points: "البرتغال: 1 | الكونغو: 1 | كولومبيا: 3 | أوزبكستان: 0"},
            {name: "L", matches: ["🏴󠁧󠁢󠁥󠁮󠁧󠁿 إنجلترا (4) - (2) 🇭🇷 كرواتيا", "🇬🇭 غانا (1) - (0) 🇵🇦 بنما"], points: "إنجلترا: 3 | كرواتيا: 0 | غانا: 3 | بنما: 0"}
        ];
        groups.forEach(g => {
            document.write(`<div class="group-card"><div class="group-title">المجموعة ${g.name}</div>`);
            g.matches.forEach(m => document.write(`<div class="match-row">${m}</div>`));
            document.write(`<div class="points-bar">${g.points}</div></div>`);
        });
    </script>
</div>

<div id="knockout" class="tab-content">
    <h3 style="text-align:center; color: #D4AF37;">ترقبوا مراحل الإقصائيات قريباً...</h3>
</div>

<div class="footer">
    <p>Craftivo - LMS 🤍</p>
</div>

<script>
function showTab(evt, id) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    evt.currentTarget.classList.add('active');
}
</script>
