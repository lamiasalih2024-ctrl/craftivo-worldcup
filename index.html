<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>كأس العالم 2026 - النتائج</title>
</head>
<body class="bg-slate-950 text-white p-4">

    <div class="max-w-md mx-auto">
        <h1 class="text-3xl font-bold text-center text-yellow-500 mb-6">نتائج كأس العالم 2026</h1>

        <!-- حاوية الجدول -->
        <div class="space-y-3">
            
            <!-- قائمة المباريات -->
            <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl shadow-lg flex justify-between items-center">
                <span class="font-bold text-lg w-1/3 text-right">الأرجنتين</span>
                <span class="bg-green-600 px-3 py-1 rounded-lg font-bold">3 - 1</span>
                <span class="font-bold text-lg w-1/3 text-left">صربيا</span>
            </div>

            <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl shadow-lg flex justify-between items-center">
                <span class="font-bold text-lg w-1/3 text-right">إسبانيا</span>
                <span class="bg-slate-700 px-3 py-1 rounded-lg font-bold">1 - 1</span>
                <span class="font-bold text-lg w-1/3 text-left">مصر</span>
            </div>

            <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl shadow-lg flex justify-between items-center">
                <span class="font-bold text-lg w-1/3 text-right">بلجيكا</span>
                <span class="bg-blue-600 px-3 py-1 rounded-lg font-bold">2 - 0</span>
                <span class="font-bold text-lg w-1/3 text-left">البرازيل</span>
            </div>

            <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl shadow-lg flex justify-between items-center">
                <span class="font-bold text-lg w-1/3 text-right">ألمانيا</span>
                <span class="bg-green-600 px-3 py-1 rounded-lg font-bold">2 - 1</span>
                <span class="font-bold text-lg w-1/3 text-left">فرنسا</span>
            </div>

            <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl shadow-lg flex justify-between items-center">
                <span class="font-bold text-lg w-1/3 text-right">إنجلترا</span>
                <span class="bg-slate-700 px-3 py-1 rounded-lg font-bold">0 - 0</span>
                <span class="font-bold text-lg w-1/3 text-left">إيطاليا</span>
            </div>

        </div>

        <div class="mt-8 text-center text-slate-400 text-sm italic">
            يتم تحديث النتائج فور صدورها. الفرق الأكثر نقاطاً ستتأهل لدور الـ 32.
        </div>
    </div>

</body>
</html>
