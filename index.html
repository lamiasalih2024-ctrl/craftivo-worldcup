<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { background-color: #0b0e14; color: #fff; font-family: 'Arial', sans-serif; margin: 0; padding: 0; }
        .header { text-align: center; padding: 20px; border-bottom: 2px solid #D4AF37; }
        .main-title { font-size: 3.5em; font-weight: 900; color: #D4AF37; text-shadow: 0 0 20px #D4AF37; margin: 0; }
        .sub-title { font-size: 1.2em; color: #fff; margin: 10px 0; }
        .tabs { display: flex; justify-content: center; gap: 5px; margin: 20px 0; }
        .tab { padding: 10px 25px; background: #222; border: 1px solid #444; cursor: pointer; color: #D4AF37; border-radius: 5px; transition: 0.3s; }
        .tab.active { background: #D4AF37; color: #000; }
        .page { display: none; padding: 20px; min-height: 400px; max-width: 800px; margin: auto; }
        .page.active { display: block; }
        .group-card { background: #1a1a1a; border: 1px solid #D4AF37; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .group-title { color: #D4AF37; font-weight: bold; text-align: center; margin-bottom: 10px; border-bottom: 1px solid #333; }
        .match-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #333; }
        .footer { text-align: center; padding: 20px; border-top: 1px solid #333; margin-top: 50px; color: #D4AF37; font-weight: bold; }
        @keyframes blink { 50% { opacity: 0; } }
        .live-dot { height: 10px; width: 10px; background-color: red; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="main-title">CRAFTIVO ⚽</h1>
    <p class="sub-title">تغطية كأس العالم 2026 | بتوقيت مكة المكرمة</p>
</div>

<div class="tabs">
    <div class="tab active" onclick="switchPage('live', this)">المباشر</div>
    <div class="tab" onclick="switchPage('archive', this)">الأرشيف</div>
    <div class="tab" onclick="switchPage('upcoming', this)">المباريات القادمة</div>
    <div class="tab" onclick="switchPage('knockout', this)">الإقصائيات</div>
</div>

<div id="live" class="page active">
    <h3>مباشر <span class="live-dot"></span></h3>
    <p style="animation: blink 2s infinite;">جاري التحديث...</p>
</div>

<div id="archive" class="page">
    <div id="groupsContainer"></div>
</div>

<div id="upcoming" class="page">
    <h3>المباريات القادمة</h3>
    <p>سيتم إدراج الجدول هنا قريباً.</p>
</div>

<div id="knockout" class="page">
    <h3>خارطة الإقصائيات ⏳</h3>
</div>

<div class="footer">
    Craft TV ♡ LMS
</div>

<script>
    const groups = [
        {n: "أ", m: [{t1: "🇲🇽 المكسيك", s: "2 - 0", t2: "🇿🇦 جنوب أفريقيا"}, {t1: "🇰🇷 كوريا الجنوبية", s: "2 - 1", t2: "🇨🇿 التشيك"}, {t1: "🇨🇿 التشيك", s: "1 - 1", t2: "🇿🇦 جنوب أفريقيا"}, {t1: "🇲🇽 المكسيك", s: "1 - 0", t2: "🇰🇷 كوريا الجنوبية"}]},
        {n: "ب", m: [{t1: "🇨🇦 كندا", s: "1 - 1", t2: "🇧🇦 البوسنة والهرسك"}, {t1: "🇶🇦 قطر", s: "1 - 1", t2: "🇨🇭 سويسرا"}, {t1: "🇨🇭 سويسرا", s: "4 - 1", t2: "🇧🇦 البوسنة والهرسك"}, {t1: "🇨🇦 كندا", s: "6 - 0", t2: "🇶🇦 قطر"}]},
        {n: "ج", m: [{t1: "🇧🇷 البرازيل", s: "1 - 1", t2: "🇲🇦 المغرب"}, {t1: "🇭🇹 هايتي", s: "0 - 1", t2: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا"}, {t1: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا", s: "0 - 1", t2: "🇲🇦 المغرب"}, {t1: "🇧🇷 البرازيل", s: "3 - 0", t2: "🇭🇹 هايتي"}]},
        {n: "د", m: [{t1: "🇺🇸 الولايات المتحدة", s: "4 - 1", t2: "🇵🇾 باراغواي"}, {t1: "🇦🇺 أستراليا", s: "2 - 0", t2: "🇹🇷 تركيا"}, {t1: "🇺🇸 الولايات المتحدة", s: "2 - 0", t2: "🇦🇺 أستراليا"}, {t1: "🇹🇷 تركيا", s: "0 - 1", t2: "🇵🇾 باراغواي"}]},
        {n: "هـ", m: [{t1: "🇩🇪 ألمانيا", s: "7 - 1", t2: "🇨🇼 كوراساو"}, {t1: "🇨🇮 ساحل العاج", s: "1 - 0", t2: "🇪🇨 الإكوادور"}]},
        {n: "و", m: [{t1: "🇯🇵 اليابان", s: "2 - 2", t2: "🇳🇱 هولندا"}, {t1: "🇸🇪 السويد", s: "5 - 1", t2: "🇹🇳 تونس"}]},
        {n: "ز", m: [{t1: "🇪🇸 إسبانيا", s: "0 - 0", t2: "🇨🇻 الرأس الأخضر"}, {t1: "🇸🇦 السعودية", s: "1 - 1", t2: "🇺🇾 أوروغواي"}]},
        {n: "ح", m: [{t1: "🇧🇪 بلجيكا", s: "1 - 1", t2: "🇪🇬 مصر"}, {t1: "🇮🇷 إيران", s: "2 - 2", t2: "🇳🇿 نيوزيلندا"}]},
        {n: "ط", m: [{t1: "🇫🇷 فرنسا", s: "3 - 1", t2: "🇸🇳 السنغال"}, {t1: "🇮🇶 العراق", s: "1 - 4", t2: "🇳🇴 النرويج"}]},
        {n: "ي", m: [{t1: "🇦🇹 النمسا", s: "3 - 1", t2: "🇯🇴 الأردن"}, {t1: "🇦🇷 الأرجنتين", s: "3 - 0", t2: "🇩🇿 الجزائر"}]},
        {n: "ك", m: [{t1: "🇵🇹 البرتغال", s: "1 - 1", t2: "🇨🇩 الكونغو"}, {t1: "🇺🇿 أوزبكستان", s: "1 - 3", t2: "🇨🇴 كولومبيا"}]},
        {n: "ل", m: [{t1: "🏴󠁧󠁢󠁥󠁮󠁧󠁿 إنجلترا", s: "4 - 2", t2: "🇭🇷 كرواتيا"}, {t1: "🇵🇦 بنما", s: "1 - 0", t2: "🇬🇭 غانا"}]}
    ];

    const container = document.getElementById('groupsContainer');
    groups.forEach(g => {
        let html = `<div class="group-card"><div class="group-title">المجموعة ${g.n}</div>`;
        g.m.forEach(m => html += `<div class="match-row"><span>${m.t1}</span><span style="color:#D4AF37; font-weight:bold;">${m.s}</span><span>${m.t2}</span></div>`);
        html += `</div>`;
        container.innerHTML += html;
    });

    function switchPage(id, element) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        element.classList.add('active');
    }
</script>
</body>
</html>
