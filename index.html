<style>
    /* اعتماد الهوية البصرية: الأسود الملكي والذهبي */
    body { 
        background-color: #0b0e14; 
        color: #ffffff; 
        font-family: 'Arial', sans-serif; 
        padding: 20px; 
        line-height: 1.6; 
    }
    
    .brand-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #D4AF37; padding-bottom: 20px; }
    
    .brand-title { 
        color: #D4AF37; /* لون ذهبي */
        font-size: 3.5em; 
        font-weight: 800; 
        margin: 0; 
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    
    .event-title { color: #ffffff; font-size: 1.8em; margin: 10px 0; }
    .timezone { color: #D4AF37; font-size: 1.3em; font-weight: bold; margin-top: 10px; }

    /* التبويبات باللون الذهبي والأسود */
    .tabs { display: flex; justify-content: space-around; margin-bottom: 25px; }
    .tab-btn { 
        background: #1a1a1a; 
        color: #fff; 
        border: 2px solid #D4AF37; 
        padding: 15px; 
        flex: 1; 
        margin: 0 5px; 
        border-radius: 10px; 
        cursor: pointer; 
        font-size: 1.2em; 
        font-weight: bold; 
    }
    .tab-btn.active { background: #D4AF37; color: #000; }

    /* محتوى التبويبات */
    .tab-content { display: none; padding: 20px; background: #161b22; border-radius: 10px; border: 1px solid #333; }
    .tab-content.active { display: block; }

    /* التذييل */
    .footer { text-align: center; margin-top: 60px; color: #ffffff; font-size: 1.4em; padding-top: 20px; border-top: 1px solid #333; }
</style>

<div class="brand-header">
    <h1 class="brand-title">Craftivo</h1>
    <h2 class="event-title">تغطية كأس العالم 2026</h2>
    <p class="timezone">جميع المباريات بتوقيت مكة المكرمة</p>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="openTab(event, 'live')">مباشر</button>
    <button class="tab-btn" onclick="openTab(event, 'archive')">الأرشيف</button>
    <button class="tab-btn" onclick="openTab(event, 'upcoming')">القادمة</button>
    <button class="tab-btn" onclick="openTab(event, 'knockout')">الإقصائيات</button>
</div>

<div id="live" class="tab-content active"><h3>مباريات اليوم</h3><p>جاري التحديث...</p></div>
<div id="archive" class="tab-content"><h3>أرشيف النتائج</h3><p>المجموعات (A-L) ستظهر هنا.</p></div>
<div id="upcoming" class="tab-content"><h3>المباريات القادمة</h3><p>جدول المواجهات...</p></div>
<div id="knockout" class="tab-content"><h3>خارطة الإقصائيات</h3><p>مسار البطولة...</p></div>

<div class="footer">
    <p>Craftivo - LMS <span style="color: #ff4d4d;">❤️</span></p>
</div>

<script>
function openTab(evt, tabName) {
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = "none");
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove("active"));
    document.getElementById(tabName).style.display = "block";
    evt.currentTarget.classList.add("active");
}
</script>
