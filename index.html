<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تغطية كأس العالم 2026 | Craft TV</title>
    <style>
        body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; font-size: 22px; }
        .header { text-align: center; padding: 30px; border-bottom: 2px solid #D4AF37; }
        .main-title { font-size: 3.5em; font-weight: 900; color: #D4AF37; margin: 0; text-shadow: 0 0 15px #D4AF37; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .ball { display: inline-block; animation: rotate 3s linear infinite; font-size: 0.8em; margin-right: 10px; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin: 25px 0; }
        .tab { padding: 12px 20px; background: #222; border: 2px solid #444; cursor: pointer; color: #D4AF37; font-weight: bold; font-size: 1.2em; border-radius: 8px; }
        .tab.active { background: #D4AF37; color: #000; border-color: #D4AF37; }
        
        .page { display: none; padding: 20px; max-width: 800px; margin: auto; }
        .page.active { display: block; }
        
        .live-indicator { color: red; font-size: 2.5em; font-weight: bold; animation: blink 1s infinite; text-align: center; }
        .loading-text { font-size: 1.5em; text-align: center; margin-top: 10px; }
        .dots { font-size: 1.2em; animation: pulseDots 1s infinite; }
        @keyframes pulseDots { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
        
        .group-card { background: #151515; border: 1px solid #333; padding: 25px; margin-bottom: 25px; border-radius: 12px; }
        .group-title { color: #D4AF37; text-align: center; font-size: 1.6em; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .match-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 15px 0; border-bottom: 1px solid #222; font-size: 1.3em; }
        
        .footer { text-align: center; padding: 40px; border-top: 2px solid #333; color: #fff; font-weight: bold; font-size: 1.5em; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="main-title"><span class="ball">⚽</span> CRAFT TV</h1>
</div>

<div class="tabs">
    <div class="tab active" onclick="showPage('live', this)">المباشر</div>
    <div class="tab" onclick="showPage('archive', this)">الأرشيف</div>
    <div class="tab" onclick="showPage('upcoming', this)">القادمة</div>
    <div class="tab" onclick="showPage('knockout', this)">الإقصائيات</div>
</div>

<div id="live" class="page active">
    <div class="live-indicator">● مباشر</div>
    <div class="loading-text">جاري التحديث <span class="dots">....</span></div>
</div>

<div id="archive" class="page"><div id="archiveContainer"></div></div>
<div id="upcoming" class="page"><div id="upcomingContainer"></div></div>
<div id="knockout" class="page">
    <div class="group-card">
        <div class="match-row"><span>دور الـ 32</span><span></span><span>16 مباراة</span></div>
        <div class="match-row"><span>دور الـ 16</span><span></span><span>8 مباريات</span></div>
        <div class="match-row"><span>دور الـ 8</span><span></span><span>4 مباريات</span></div>
        <div class="match-row"><span>دور الـ 4</span><span></span><span>2 مباراة</span></div>
        <div class="match-row" style="color:#D4AF37;"><span>النهائي 🏆</span><span></span><span>مباراة واحدة</span></div>
    </div>
</div>

<div class="footer">Craft TV 🤍 LMS</div>

<script>
    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    const fullData = [
        {n: "المجموعة أ", m: [{t1: "المكسيك 🇲🇽", s: "0-2", t2: "جنوب أفريقيا 🇿🇦"}, {t1: "كوريا الجنوبية 🇰🇷", s: "2-1", t2: "التشيك 🇨🇿"}]},
        {n: "المجموعة ب", m: [{t1: "كندا 🇨🇦", s: "1-1", t2: "البوسنة والهرسك 🇧🇦"}, {t1: "قطر 🇶🇦", s: "1-1", t2: "سويسرا 🇨🇭"}]}
    ];
    
    const upData = [
        {n: "المجموعة هـ", m: [{t1: "ألمانيا 🇩🇪", s: "22:00", t2: "ساحل العاج 🇨🇮"}]}
    ];

    const arc = document.getElementById('archiveContainer');
    fullData.forEach(g => {
        let h = `<div class="group-card"><div class="group-title">${g.n}</div>`;
        g.m.forEach(m => h += `<div class="match-row"><div style="text-align:right;">${m.t1}</div><div style="color:#D4AF37; font-weight:bold; padding:0 20px;">${m.s}</div><div style="text-align:left;">${m.t2}</div></div>`);
        arc.innerHTML += h + `</div>`;
    });

    const upc = document.getElementById('upcomingContainer');
    upData.forEach(g => {
        let h = `<div class="group-card"><div class="group-title">${g.n}</div>`;
        g.m.forEach(m => h += `<div class="match-row"><div style="text-align:right;">${m.t1}</div><div style="color:#D4AF37; font-weight:bold; padding:0 20px;">${m.s}</div><div style="text-align:left;">${m.t2}</div></div>`);
        upc.innerHTML += h + `</div>`;
    });
</script>
</body>
</html>
