<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تغطية كأس العالم 2026 | Craftivo</title>
    <style>
        body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; font-size: 20px; }
        .header { text-align: center; padding: 40px; border-bottom: 2px solid #D4AF37; }
        .main-title { font-size: 4em; font-weight: 900; color: #D4AF37; margin: 0; text-shadow: 0 0 15px #D4AF37; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .ball { display: inline-block; animation: rotate 4s linear infinite; font-size: 0.8em; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .sub-title { font-size: 1.4em; color: #aaa; margin: 15px 0; }
        .tabs { display: flex; justify-content: center; gap: 8px; margin: 30px 0; flex-wrap: wrap; }
        .tab { padding: 12px 20px; background: #222; border: 2px solid #444; cursor: pointer; color: #D4AF37; border-radius: 8px; font-weight: bold; font-size: 1.1em; transition: 0.3s; }
        .tab.active { background: #D4AF37; color: #000; border-color: #D4AF37; }
        .page { display: none; padding: 20px; max-width: 800px; margin: auto; }
        .page.active { display: block; }
        .group-card { background: #151515; border: 1px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        .group-title { color: #D4AF37; font-size: 1.5em; text-align: center; margin-bottom: 15px; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .match-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px 0; border-bottom: 1px solid #222; font-size: 1.1em; }
        .score { color: #D4AF37; font-weight: bold; padding: 0 15px; text-align: center; }
        .footer { text-align: center; padding: 40px; border-top: 2px solid #333; color: #D4AF37; font-weight: bold; font-size: 1.4em; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="main-title">CRAFTIVO <span class="ball">⚽</span></h1>
    <p class="sub-title">تغطية كأس العالم 2026 | بتوقيت مكة المكرمة</p>
</div>

<div class="tabs">
    <div class="tab active" onclick="showPage('live', this)">المباشر</div>
    <div class="tab" onclick="showPage('archive', this)">الأرشيف</div>
    <div class="tab" onclick="showPage('upcoming', this)">المباريات القادمة</div>
    <div class="tab" onclick="showPage('knockout', this)">الإقصائيات</div>
</div>

<div id="live" class="page active"><h3>جاري التحديث...</h3></div>
<div id="archive" class="page"><div id="archiveContainer"></div></div>
<div id="upcoming" class="page"><div id="upcomingContainer"></div></div>
<div id="knockout" class="page">
    <h2 style="text-align:center; color:#D4AF37;">خارطة الإقصائيات 🏆</h2>
    <div class="group-card">
        <div class="match-row"><span>دور الـ 32</span><span></span><span>16 مباراة</span></div>
        <div class="match-row"><span>دور الـ 16</span><span></span><span>8 مباريات</span></div>
        <div class="match-row"><span>دور الـ 8</span><span></span><span>4 مباريات</span></div>
        <div class="match-row"><span>دور الـ 4</span><span></span><span>2 مباراة</span></div>
        <div class="match-row" style="color:#D4AF37; font-weight:bold;"><span>🏆 النهائي</span><span></span><span>مباراة واحدة</span></div>
    </div>
</div>

<div class="footer">Craftivo 🤍 LMS</div>

<script>
    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    const archiveData = [
        {n: "المجموعة أ", m: [{t1: "المكسيك 🇲🇽", s: "2 - 0", t2: "🇿🇦 جنوب أفريقيا"}, {t1: "كوريا الجنوبية 🇰🇷", s: "2 - 1", t2: "🇨🇿 التشيك"}]},
        {n: "المجموعة ب", m: [{t1: "كندا 🇨🇦", s: "1 - 1", t2: "🇧🇦 البوسنة والهرسك"}, {t1: "قطر 🇶🇦", s: "1 - 1", t2: "🇨🇭 سويسرا"}]},
        {n: "المجموعة ج", m: [{t1: "البرازيل 🇧🇷", s: "1 - 1", t2: "🇲🇦 المغرب"}, {t1: "هايتي 🇭🇹", s: "0 - 1", t2: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا"}]},
        {n: "المجموعة د", m: [{t1: "الولايات المتحدة 🇺🇸", s: "4 - 1", t2: "🇵🇾 باراغواي"}, {t1: "أستراليا 🇦🇺", s: "2 - 0", t2: "🇹🇷 تركيا"}]}
    ];

    const upcomingData = [
        {n: "المجموعة هـ", m: [{t1: "ألمانيا 🇩🇪", s: "23:00", t2: "🇨🇮 ساحل العاج"}]},
        {n: "المجموعة و", m: [{t1: "هولندا 🇳🇱", s: "20:00", t2: "🇸🇪 السويد"}]}
    ];

    const arcCont = document.getElementById('archiveContainer');
    archiveData.forEach(g => {
        let h = `<div class="group-card"><div class="group-title">${g.n}</div>`;
        g.m.forEach(m => h += `<div class="match-row"><div style="text-align:right;">${m.t1}</div><div class="score">${m.s}</div><div style="text-align:left;">${m.t2}</div></div>`);
        arcCont.innerHTML += h + `</div>`;
    });

    const upCont = document.getElementById('upcomingContainer');
    upcomingData.forEach(g => {
        let h = `<div class="group-card"><div class="group-title">${g.n}</div>`;
        g.m.forEach(m => h += `<div class="match-row"><div style="text-align:right;">${m.t1}</div><div class="score">${m.s}</div><div style="text-align:left;">${m.t2}</div></div>`);
        upCont.innerHTML += h + `</div>`;
    });
</script>
</body>
</html>
