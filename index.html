<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Craftivo | تغطية كأس العالم 2026</title>
  <style>
    body { background: #05070f; color: white; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    .match-card { background: rgba(255, 255, 255, 0.05); border: 1px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
    .group-title { color: #eab308; font-size: 1.2rem; font-weight: 800; margin-top: 25px; border-bottom: 2px solid #eab308; display: inline-block; }
    footer { margin-top: auto; padding: 30px; text-align: center; color: #555; font-size: 0.8rem; border-top: 1px solid #222; }
  </style>
</head>
<body class="p-4">
  <header class="text-center py-6">
    <h1 class="text-5xl font-black text-yellow-500">Craftivo</h1>
    <p class="text-gray-400 mt-2 font-bold">التغطية الرسمية لكأس العالم 2026 | توقيت مكة</p>
  </header>

  <main id="content" class="max-w-xl mx-auto flex-grow">
    <h2 class="group-title">سجل النتائج</h2>
    <div id="manual-results"></div>
    <h2 class="group-title mt-8">جدول المباريات القادمة</h2>
    <div id="api-fixtures"></div>
  </main>

  <footer>
    <p>Craftivo &copy; 2026 | تطوير: LMS Systems</p>
    <p class="mt-1">نظام تغطية المباريات الذكي</p>
  </footer>

  <script>
    // سجل النتائج (يمكنكِ إكمال المجموعات من C إلى L)
    const manualMatches = [
      { group: "المجموعة A", home: "🇲🇽 المكسيك", away: "🇿🇦 جنوب أفريقيا", score: "2 - 0" },
      { group: "المجموعة A", home: "🇶🇦 قطر", away: "🇨🇭 سويسرا", score: "1 - 1" },
      { group: "المجموعة B", home: "🇦🇷 الأرجنتين", away: "🇩🇿 الجزائر", score: "3 - 0" },
      { group: "المجموعة B", home: "🇦🇹 النمسا", away: "🇯🇴 الأردن", score: "3 - 1" },
      { group: "المجموعة C", home: "🇩🇪 ألمانيا", away: "🇨🇼 كوراساو", score: "7 - 1" },
      { group: "المجموعة C", home: "🇰🇷 كوريا الجنوبية", away: "🇨🇿 التشيك", score: "2 - 1" }
    ];

    const manualDiv = document.getElementById('manual-results');
    manualMatches.forEach(m => {
      manualDiv.innerHTML += `
        <div class="match-card text-center">
          <p class="text-[9px] text-yellow-600">${m.group}</p>
          <div class="flex justify-between items-center text-sm font-bold">
            <span class="w-1/3">${m.home}</span>
            <span class="text-yellow-500 w-1/3 text-lg">${m.score}</span>
            <span class="w-1/3">${m.away}</span>
          </div>
        </div>`;
    });

    // نظام الإشعارات والتوقيت (توقيت مكة)
    let oldData = [];
    if ("Notification" in window) Notification.requestPermission();

    function notify(title, body) {
      if (Notification.permission === "granted") new Notification(title, { body: body, icon: 'https://cdn-icons-png.flaticon.com/512/53/53283.png' });
    }

    async function checkMatches() {
      try {
        const res = await fetch('/api/football');
        const data = await res.json();
        const apiDiv = document.getElementById('api-fixtures');
        const newMatches = data.response || [];
        
        apiDiv.innerHTML = '';
        newMatches.forEach(m => {
          // تحويل التوقيت إلى توقيت مكة (إضافة 3 ساعات للـ UTC)
          let date = new Date(m.fixture.date);
          let meccaTime = new Date(date.getTime() + (3 * 60 * 60 * 1000)).toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });

          apiDiv.innerHTML += `
            <div class="match-card text-center border border-blue-500/20">
              <p class="text-[10px] text-gray-400">📅 ${date.toLocaleDateString('ar-SA')} | ⏰ ${meccaTime} (مكة)</p>
              <div class="text-sm font-bold">${m.teams.home.name} VS ${m.teams.away.name}</div>
            </div>`;
          
          if (oldData.length > 0) {
            const oldM = oldData.find(o => o.fixture.id === m.fixture.id);
            if (oldM && (oldM.goals.home !== m.goals.home || oldM.goals.away !== m.goals.away)) {
              notify("⚽ هدف جديد!", `${m.teams.home.name} ${m.goals.home} - ${m.goals.away} ${m.teams.away.name}`);
            }
          }
        });
        oldData = newMatches;
      } catch (err) { console.log("تحديث:", err); }
    }
    
    setInterval(checkMatches, 30000);
    checkMatches();
  </script>
</body>
</html>
