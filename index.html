<style>
    body { background-color: #0b0e14; color: #ffffff; font-family: 'Arial', sans-serif; padding: 20px; direction: rtl; }
    .brand-header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #D4AF37; padding-bottom: 15px; }
    .brand-title { color: #D4AF37; font-size: 3.5em; font-weight: 900; margin: 0; text-transform: uppercase; }
    .event-title { color: #ffffff; font-size: 1.8em; margin: 10px 0; font-weight: bold; }
    .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; }
    .tab-btn { background: #1a1a1a; color: #D4AF37; border: 2px solid #D4AF37; padding: 12px; flex: 1; margin: 0 5px; border-radius: 10px; cursor: pointer; font-size: 1.2em; font-weight: bold; }
    .tab-btn.active { background: #D4AF37; color: #000; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .group-card { background: #1a1a1a; border: 3px solid #D4AF37; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
    .group-title { color: #D4AF37; font-size: 1.8em; text-align: center; margin-bottom: 15px; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 10px; }
    .match-row { text-align: center; font-size: 1.4em; padding: 12px; border-bottom: 1px dashed #444; color: #fff; }
    .points-bar { background: #000; padding: 15px; border-radius: 10px; font-size: 1.2em; color: #D4AF37; text-align: center; margin-top: 10px; font-weight: bold; }
    .live-container { text-align: center; padding: 40px; }
    .live-label { color: #ff0000; font-size: 2.5em; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 15px; }
    .pulse { width: 25px; height: 25px; background: red; border-radius: 50%; animation: pulse 1s infinite; }
    .loading-text { color: #ffffff; font-size: 2em; margin-top: 20px; animation: blink 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(0.9); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.5; } 100% { transform: scale(0.9); opacity: 1; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    .footer { text-align: center; margin-top: 40px; color: #ffffff; font-size: 1.4em; }
</style>

</div>

    <button class="tab-btn" onclick="showTab(event, 'archive')">الأرشيف</button>
    <button class="tab-btn" onclick="showTab(event, 'upcoming')">القادمة</button>
    <button class="tab-btn" onclick="showTab(event, 'knockout')">الإقصائيات</button>
</div>
