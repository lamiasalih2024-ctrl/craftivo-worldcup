<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Craftivo LMS | كأس العالم 2026</title>

<style>
    body{
        margin:0;
        font-family:sans-serif;
        background:#0b0f1a;
        color:white;
    }

    /* الهيدر */
    .header{
        text-align:center;
        padding:25px;
        background:#0f172a;
        border-bottom:2px solid #1f2a44;
    }

    .title{
        font-size:46px;
        font-weight:bold;
        margin-bottom:5px;
    }

    .subtitle{
        font-size:22px;
        color:#9ca3af;
        letter-spacing:2px;
    }

    /* التبويبات */
    .nav-bar{
        display:flex;
        justify-content:center;
        gap:15px;
        padding:15px;
        flex-wrap:wrap;
        background:#0b0f1a;
    }

    .nav-btn{
        padding:16px 32px;
        border:none;
        border-radius:12px;
        background:#1f2a44;
        color:white;
        font-size:24px;   /* 🔥 كبير وواضح */
        cursor:pointer;
        font-weight:bold;
    }

    .nav-btn:hover{
        background:#2d3b5f;
    }

    /* الصفحات */
    .page{
        display:none;
        padding:20px;
    }

    .active{
        display:block;
    }

    /* كارد المباشر */
    .card{
        background:#111a2e;
        padding:35px;
        border-radius:18px;
        text-align:center;
        font-size:30px;   /* 🔥 واضح وكبير */
        line-height:1.8;
    }

    /* LIVE indicator */
    .live-row{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:12px;
        font-size:32px;
        font-weight:bold;
        margin-bottom:15px;
    }

    .dot{
        width:18px;
        height:18px;
        background:red;
        border-radius:50%;
        animation:blink 1s infinite;
    }

    @keyframes blink{
        50%{opacity:0.3;}
    }
</style>
</head>

<body>

<!-- الهيدر -->
<div class="header">
    <div class="title">⚽ Craftivo LMS</div>
    <div class="subtitle">WORLD CUP 2026 COVERAGE</div>
</div>

<!-- التبويبات -->
<div class="nav-bar">
    <button class="nav-btn">🔴 مباشر</button>
    <button class="nav-btn">📊 السابقة</button>
    <button class="nav-btn">📅 القادمة</button>
</div>

<!-- صفحة المباشر -->
<div class="page active">

    <div class="card">

        <div class="live-row">
            <div class="dot"></div>
            <div>مباشر</div>
        </div>

        <div>
            لا توجد مباريات حالياً
        </div>

    </div>

</div>

</body>
</html>
