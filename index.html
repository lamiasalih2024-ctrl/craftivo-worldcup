<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Craftivo | 2026</title>
<style>
body{margin:0;font-family:system-ui, sans-serif;background:#070b16;color:#fff;}
.header{text-align:center;font-size:32px;padding:20px;font-weight:900;}
.nav-bar{display:flex;justify-content:center;gap:10px;margin-bottom:20px;}
.nav-btn{padding:10px 20px;background:#1f2a44;border:none;border-radius:10px;color:white;cursor:pointer;}
.page{display:none;padding:20px;}
.active{display:block;}
.match{background:rgba(255,255,255,0.05);padding:15px;margin:10px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center;}
</style>
</head>
<body>

<div class="header">⚽ Craftivo - تغطية كأس العالم 2026</div>

<div class="nav-bar">
  <button class="nav-btn" onclick="show('live')">🔴 مباشر</button>
  <button class="nav-btn" onclick="show('archive')">📺 السابقة</button>
  <button class="nav-btn" onclick="show('upcoming')">⏳ القادمة</button>
</div>

<div id="live" class="page active"><h2>🔥 المباريات المباشرة</h2><div id="live-matches">جاري البحث عن مباريات حالية...</div></div>
<div id="archive" class="page"><h2>📺 النتائج السابقة</h2><div id="archive-matches">جاري تحميل النتائج...</div></div>
<div id="upcoming" class="page"><h2>⏳ المباريات القادمة</h2><div id="upcoming-matches">جاري تحميل المواعيد...</div></div>

<script>
function show(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ضعي مفتاحك هنا بدقة
const KEY = "PUT_YOUR_API_KEY_HERE";

async function loadMatches(endpoint, boxId) {
  const box = document.getElementById(boxId);
  try {
    const res = await fetch(`https://v3.football.api-sports.io/${endpoint}`, {
      headers: {"x-apisports-key": KEY}
    });
    const data = await res.json();
    if(!data.response || data.response.length === 0) {
      box.innerHTML = "لا توجد بيانات متاحة حالياً.";
      return;
    }
    box.innerHTML = data.response.map(m => `
      <div class="match">
        <span>${m.teams.home.name}</span>
        <b>${m.goals.home ?? '-'} : ${m.goals.away ?? '-'}</b>
        <span>${m.teams.away.name}</span>
      </div>
    `).join('');
  } catch(e) { box.innerHTML = "خطأ في الاتصال بالسيرفر."; }
}

// روابط البحث (تأكدي من صحة league=1 إذا كان هو كأس العالم في حسابك)
loadMatches("fixtures?live=all", "live-matches");
loadMatches("fixtures?league=1&season=2026&status=FT", "archive-matches");
loadMatches("fixtures?league=1&season=2026&status=NS", "upcoming-matches");
</script>
</body>
</html>
