<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
    body { background: #05070f; color: #fff; font-family: 'Cairo', sans-serif; }
    .brand-title { font-size: 3rem; font-weight: 900; background: linear-gradient(to bottom, #fbbf24, #b45309); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
    .card { background: #0f172a; border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid #334155; }
    .live-card { border: 3px solid #ef4444; }
  </style>
</head>
<body class="p-4">
<div class="max-w-2xl mx-auto">
  <div class="brand-title">Craftivo</div>
  <p class="text-center text-gray-400 font-bold mb-8">تغطية كأس العالم 2026</p>
  
  <div id="live-container"></div>
  <div id="archive-list"></div>
  
  <div class="text-center mt-12 p-8 border-t border-gray-800">
    <p class="font-bold text-gray-400">Craftivo | LMS 🤍</p>
  </div>
</div>

<script>
// ضعي مفتاحك هنا بين القوسين
const API_KEY = "ضعي_مفتاحك_هنا";

async function updateData() {
    // عرض المباشر (سيتم تحديثه بالـ API لاحقاً)
    document.getElementById('live-container').innerHTML = `
        <div class="card live-card">
            <span class="text-red-500 font-bold">🔴 مباشر الآن</span>
            <div class="text-xl font-bold">الكونغو 0 - 1 البرتغال</div>
        </div>`;
    
    // عرض الأرشيف الثابت لضمان عدم اختفائه
    const matches = [
        { group: "A", match: "المكسيك - ج.أفريقيا", score: "2 - 0" },
        { group: "B", match: "كندا - البوسنة", score: "1 - 1" }
    ];
    document.getElementById('archive-list').innerHTML = matches.map(m => `
        <div class="card">
            <div class="text-yellow-500 font-bold">المجموعة ${m.group}</div>
            <div class="text-lg font-bold">${m.match}</div>
            <div class="text-2xl font-black text-yellow-400">${m.score}</div>
        </div>
    `).join('');
}
updateData();
</script>
</body>
</html>
