<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Craftivo TV | تغطية كأس العالم 2026</title>

<style>
body {
    font-family: sans-serif;
    background: #0b0f1a;
    margin: 0;
    color: white;
    font-size: 20px; /* 🔥 تكبير الخط الأساسي */
}

/* الهيدر */
.header {
    text-align: center;
    padding: 20px;
    font-size: 34px; /* أكبر */
    font-weight: bold;
}

.sub {
    font-size: 18px;
    color: #aaa;
}

/* NAV */
.nav-bar {
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 10px;
}

.nav-btn {
    padding: 14px 28px;
    border: none;
    background: #1f2a44;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px; /* 🔥 أكبر */
    font-weight: bold;
}

.nav-btn:hover {
    background: #2d3f66;
}

/* الصفحات */
.page-content { display: none; padding: 20px; }
.active { display: block; }

/* الكارد */
.card {
    background: #111a2e;
    padding: 35px;
    border-radius: 15px;
    text-align: center;
    font-size: 22px; /* 🔥 أكبر */
}

/* LIVE indicator */
.live-indicator {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #ff3b3b;
    font-weight: bold;
    font-size: 20px;
}

.dot {
    width: 12px;
    height: 12px;
    background: red;
    border-radius: 50%;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

/* GREEN FLASH */
.green-flash {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #00ff88;
    color: #000;
    padding: 14px 30px;
    border-radius: 12px;
    font-weight: bold;
    box-shadow: 0 0 20px #00ff88;
    animation: fadeOut 2s forwards;
    font-size: 18px; /* 🔥 أكبر */
    z-index: 9999;
}

@keyframes fadeOut {
    0% { opacity: 1; transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) scale(0.9); }
}

/* الفرق */
.match {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin-top: 20px;
    font-size: 22px; /* 🔥 أكبر */
}

.team img {
    width: 70px;
    height: 45px;
    border-radius: 5px;
}

.status {
    margin-top: 15px;
    color: #ffd166;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="header">
⚽ Craftivo TV
<div class="sub">تغطية كأس العالم 2026 ❤️</div>
</div>

<div class="nav-bar">
    <button class="nav-btn" onclick="openPage('live')">مباشر</button>
    <button class="nav-btn" onclick="openPage('archive')">السابقة</button>
    <button class="nav-btn" onclick="openPage('upcoming')">القادمة</button>
</div>

<div id="live" class="page-content active">
    <div class="card">

        <div class="live-indicator">
            <div class="dot"></div> LIVE
        </div>

        <div id="matchBox">جاري التحديث...</div>

    </div>
</div>

<div id="archive" class="page-content">
    <div class="card">المباريات السابقة</div>
</div>

<div id="upcoming" class="page-content">
    <div class="card">المباريات القادمة</div>
</div>

<script>

function openPage(pageName) {
    document.querySelectorAll('.page-content')
        .forEach(p => p.classList.remove('active'));

    document.getElementById(pageName).classList.add('active');

    if (pageName === 'live') {
        showGreenFlash("تم الدخول إلى البث المباشر");
    }
}

function showGreenFlash(message) {
    const flash = document.createElement("div");
    flash.className = "green-flash";
    flash.innerText = message;

    document.body.appendChild(flash);

    setTimeout(() => flash.remove(), 2000);
}
</script>

</body>
</html>
