<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تغطية كأس العالم 2026 | Craft TV</title>
    <style>
        body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        .header { text-align: center; padding: 30px; border-bottom: 2px solid #D4AF37; }
        .main-title { font-size: 3.5em; font-weight: 900; color: #D4AF37; margin: 0; text-shadow: 0 0 15px #D4AF37; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .ball { display: inline-block; animation: rotate 3s linear infinite; font-size: 0.8em; margin-right: 10px; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .tabs { display: flex; justify-content: center; gap: 5px; margin: 20px 0; }
        .tab { padding: 10px 15px; background: #222; border: 1px solid #444; cursor: pointer; color: #D4AF37; font-weight: bold; border-radius: 5px; }
        .tab.active { background: #D4AF37; color: #000; }
        .page { display: none; padding: 15px; max-width: 600px; margin: auto; }
        .page.active { display: block; }
        .live-indicator { color: red; font-size: 2em; font-weight: bold; animation: blink 1s infinite; text-align: center; margin-top: 20px; }
        .loading-dots { animation: dots 1.5s infinite; }
        @keyframes dots { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; } }
        .group-card { background: #151515; border: 1px solid #333; padding: 15px; margin-bottom: 15px; border-radius: 10px; }
        .group-title { color: #D4AF37; text-align: center; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #333; }
        .match-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 0; border-bottom: 1px solid #222; }
        .footer { text-align: center; padding: 30px; border-top: 2px solid #333; color: #fff; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="main-title"><span class="ball">⚽</span> CRAFT TV</h1>
</div>

<div class="tabs">
    <div class="tab active" onclick="showPage('live', this)">المباشر</div>
    <div class="tab" onclick="showPage('archive', this)">الأرشيف</div>
    <div class="tab" onclick="showPage('upcoming', this)">القادمة</div>
    <div class="tab" onclick="showPage('knockout', this)">الإقصائيات</div>
</div>

<div id="live" class="page active">
    <div class="live-indicator">● مباشر</div>
    <p style="text-align:center; font-size: 1.5em;">جاري التحديث <span class="loading-dots"></span></p>
</div>

<div id="archive" class="page"><div id="archiveContainer"></div></div>
<div id="upcoming" class="page"><div id="upcomingContainer"></div></div>
<div id="knockout" class="page">
    <div class="group-card">
        <div class="match-row"><span>دور الـ 32</span><span></span><span>16 مباراة</span></div>
        <div class="match-row"><span>دور الـ 16</span><span></span><span>8 مباريات</span></div>
        <div class="match-row"><span>دور الـ 8</span><span></span><span>4 مباريات</span></div>
        <div class="match-row"><span>دور الـ 4</span><span></span><span>2 مباراة</span></div>
        <div class="match-row" style="color:#D4AF37;"><span>النهائي 🏆</span><span></span><span>مباراة واحدة</span></div>
    </div>
</div>

<div class="footer">Craft TV 🤍 LMS</div>

<script>
    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    const fullData = [
        {n: "المجموعة أ", m: [{t1: "المكسيك 🇲🇽", s: "0-2", t2: "جنوب أفريقيا 🇿🇦"}, {t1: "كوريا الجنوبية 🇰🇷", s: "2-1", t2: "التشيك 🇨🇿"}, {t1: "التشيك 🇨🇿", s: "1-1", t2: "جنوب أفريقيا 🇿🇦"}, {t1: "المكسيك 🇲🇽", s: "0-1", t2: "كوريا الجنوبية 🇰🇷"}]},
        {n: "المجموعة ب", m: [{t1: "كندا 🇨🇦", s: "1-1", t2: "البوسنة والهرسك 🇧🇦"}, {t1: "قطر 🇶🇦", s: "1-1", t2: "سويسرا 🇨🇭"}, {t1: "سويسرا 🇨🇭", s: "4-1", t2: "البوسنة والهرسك 🇧🇦"}, {t1: "كندا 🇨🇦", s: "0-6", t2: "قطر 🇶🇦"}]},
        {n: "المجموعة ج", m: [{t1: "البرازيل 🇧🇷", s: "1-1", t2: "المغرب 🇲🇦"}, {t1: "هايتي 🇭🇹", s: "0-1", t2: "إسكتلندا 🏴󠁧󠁢󠁳󠁣󠁴󠁿"}, {t1: "المغرب 🇲🇦", s: "1-0", t2: "إسكتلندا 🏴󠁧󠁢󠁳󠁣󠁴󠁿"}, {t1: "البرازيل 🇧🇷", s: "0-3", t2: "هايتي 🇭🇹"}]},
        {n: "المجموعة د", m: [{t1: "الولايات المتحدة 🇺🇸", s: "4-1", t2: "باراغواي 🇵🇾"}, {t1: "أستراليا 🇦🇺", s: "0-2", t2: "تركيا 🇹🇷"}, {t1: "الولايات المتحدة 🇺🇸", s: "0-2", t2: "أستراليا 🇦🇺"}, {t1: "تركيا 🇹🇷", s: "1-0", t2: "باراغواي 🇵🇾"}]},
        {n: "المجموعة هـ", m: [{t1: "ألمانيا 🇩🇪", s: "7-1", t2: "كوراساو 🇨🇼"}, {t1: "ساحل العاج 🇨🇮", s: "0-1", t2: "الإكوادور 🇪🇨"}]},
        {n: "المجموعة و", m: [{t1: "اليابان 🇯🇵", s: "2-2", t2: "هولندا 🇳🇱"}, {t1: "السويد 🇸🇪", s: "5-1", t2: "تونس 🇹🇳"}]},
        {n: "المجموعة ز", m: [{t1: "إسبانيا 🇪🇸", s: "0-0", t2: "الرأس الأخضر 🇨🇻"}, {t1: "السعودية 🇸🇦", s: "1-1", t2: "أوروغواي 🇺🇾"}]},
        {n: "المجموعة ح", m: [{t1: "بلجيكا 🇧🇪", s: "1-1", t2: "مصر 🇪🇬"}, {t1: "إيران 🇮🇷", s: "2-2", t2: "نيوزيلندا 🇳🇿"}]},
        {n: "المجموعة ط", m: [{t1: "الأرجنتين 🇦🇷", s: "0-0", t2: "السنغال 🇸🇳"}, {t1: "غانا 🇬🇭", s: "1-2", t2: "كرواتيا 🇭🇷"}]},
        {n: "المجموعة ي", m: [{t1: "فرنسا 🇫🇷", s: "3-0", t2: "فيتنام 🇻🇳"}, {t1: "صربيا 🇷🇸", s: "1-1", t2: "نيجيريا 🇳🇬"}]},
        {n: "المجموعة ك", m: [{t1: "إيطاليا 🇮🇹", s: "2-0", t2: "أوزبكستان 🇺🇿"}, {t1: "البيرو 🇵🇪", s: "0-1", t2: "النرويج 🇳🇴"}]},
        {n: "المجموعة ل", m: [{t1: "إنجلترا 🏴󠁧󠁢󠁥󠁮󠁧󠁿", s: "4-0", t2: "تنزانيا 🇹🇿"}, {t1: "البرتغال 🇵🇹", s: "1-0", t2: "كولومبيا 🇨🇴"}]}
    ];

    const arc = document.getElementById('archiveContainer');
    fullData.forEach(g => {
        let h = `<div class="group-card"><div class="group-title">${g.n}</div>`;
        g.m.forEach(m => h += `<div class="match-row"><div style="text-align:right;">${m.t1}</div><div style="color:#D4AF37; font-weight:bold;">${m.s}</div><div style="text-align:left;">${m.t2}</div></div>`);
        arc.innerHTML += h + `</div>`;
    });
</script>
</body>
</html>
