<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Craftivo TV | تغطية كأس العالم 2026</title>

<style>
body {
    font-family: sans-serif;
    background: #0b0f1a;
    margin: 0;
    color: white;
    font-size: 20px;
}

/* HEADER */
.header {
    text-align: center;
    padding: 25px;
    font-size: 42px; /* 🔥 أكبر */
    font-weight: bold;
}

.sub {
    font-size: 22px; /* 🔥 أكبر */
    color: #aaa;
    margin-top: 8px;
}

/* NAV */
.nav-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 15px;
}

/* 🔥 تكبير التبويبات */
.nav-btn {
    padding: 18px 40px;
    border: none;
    background: #1f2a44;
    color: white;
    border-radius: 12px;
    cursor: pointer;
    font-size: 22px; /* 🔥 أكبر جداً */
    font-weight: bold;
    transition: 0.3s;
}

.nav-btn:hover {
    background: #2d3f66;
    transform: scale(1.05);
}

/* الصفحات */
.page-content {
    display: none;
    padding: 25px;
}

.active {
    display: block;
}

/* الكارد */
.card {
    background: #111a2e;
    padding: 40px;
    border-radius: 15px;
    text-align: center;
    font-size: 24px;
}

/* LIVE */
.live-indicator {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: #ff3b3b;
    font-weight: bold;
    font-size: 22px;
}

.dot {
    width: 14px;
    height: 14px;
    background: red;
    border-radius: 50%;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

/* GREEN FLASH */
.green-flash {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #00ff88;
    color: #000;
    padding: 14px 30px;
    border-radius: 12px;
    font-weight: bold;
    box-shadow: 0 0 20px #00ff88;
    animation: fadeOut 2s forwards;
    font-size: 18px;
    z-index: 9999;
}

@keyframes fadeOut {
    0% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) scale(0.9); }
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 20px;
    margin-top: 40px;
    font-size: 20px;
    color: #aaa;
}
</style>
</head>

<body>

<div class="header">
⚽ Craftivo TV
<div class="sub">تغطية كأس العالم 2026</div>
</div>

<div class="nav-bar">
    <button class="nav-btn" onclick="openPage('live')">مباشر</button>
    <button class="nav-btn" onclick="openPage('archive')">السابقة</button>
    <button class="nav-btn" onclick="openPage('upcoming')">القادمة</button>
</div>

<div id="live" class="page-content active">
    <div class="card">

        <div class="live-indicator">
            <div class="dot"></div> LIVE
        </div>

        <div id="matchBox">جاري التحديث...</div>

    </div>
</div>

<div id="archive" class="page-content">
    <div class="card">المباريات السابقة</div>
</div>

<div id="upcoming" class="page-content">
    <div class="card">المباريات القادمة</div>
</div>

<!-- FOOTER -->
<div class="footer">
    Craftivo | تصميم LMS 🤍
</div>

<script>

function openPage(pageName) {
    document.querySelectorAll('.page-content')
        .forEach(p => p.classList.remove('active'));

    document.getElementById(pageName).classList.add('active');

    if (pageName === 'live') {
        showGreenFlash("تم الدخول إلى البث المباشر");
    }
}

function showGreenFlash(message) {
    const flash = document.createElement("div");
    flash.className = "green-flash";
    flash.innerText = message;

    document.body.appendChild(flash);

    setTimeout(() => flash.remove(), 2000);
}
</script>

</body>
</html>
