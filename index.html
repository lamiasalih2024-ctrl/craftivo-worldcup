<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Craftivo - كأس العالم</title>

<style>
body{
    font-family:sans-serif;
    background:#0b0f1a;
    color:white;
    margin:0;
    padding:20px;
}

.header{
    text-align:center;
    font-size:40px;
    font-weight:bold;
    margin-bottom:20px;
}

.nav{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
}

.btn{
    padding:15px 25px;
    background:#1f2a44;
    border:none;
    color:white;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
}

.page{ display:none; }
.active{ display:block; }

.card{
    background:#111a2e;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
}

/* مباراة سطر واحد */
.match{
    display:flex;
    justify-content:space-between;
    align-items:center;
    white-space:nowrap;
    font-size:18px;
}

.team{
    display:flex;
    gap:5px;
    font-weight:bold;
}

.vs{ color:#00ff88; margin:0 5px; }

.time{ color:#ffeb3b; font-size:16px; }

/* خارطة الأدوار */
.map{
    text-align:center;
    font-size:18px;
    color:#aaa;
    line-height:2;
}
</style>
</head>

<body>

<div class="header">⚽ Craftivo World Cup 2026</div>

<div class="nav">
<button class="btn" onclick="show('live')">مباشر</button>
<button class="btn" onclick="show('upcoming')">القادمة</button>
</div>

<!-- LIVE -->
<div id="live" class="page active">
<div class="card">
🔴 مباراة مباشرة:
<br><br>

<div class="match">
<div class="team">🇫🇷 فرنسا</div>
<div><span class="vs">VS</span></div>
<div class="team">🇧🇷 البرازيل</div>
<div class="time">1 - 0</div>
</div>

</div>
</div>

<!-- UPCOMING -->
<div id="upcoming" class="page">

<div class="card">

<div class="match">
<div class="team">🇧🇷 البرازيل</div>
<div><span class="vs">VS</span></div>
<div class="team">🇦🇷 الأرجنتين</div>
<div class="time">20/06 | 18:00</div>
</div>

</div>

<div class="card map">
<b>خارطة البطولة</b><br>
دور 32<br>
دور 16<br>
ربع النهائي<br>
نصف النهائي<br>
النهائي
</div>

</div>

<script>
function show(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
