<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e17; color: #ffffff; font-family: sans-serif; }
        .page { display: none; }
        .page.active { display: block; }
        .nav-btn { flex: 1; padding: 12px; font-weight: 800; border-radius: 12px; background: #1f2937; color: #9ca3af; transition: 0.3s; }
        .nav-btn.active { background: #eab308; color: #000; }
        .group-card { background: #111827; border: 1px solid #374151; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .live-pulse { width: 14px; height: 14px; background: #ef4444; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="p-4">

    <nav class="flex gap-2 mb-8">
        <button id="btn-live" class="nav-btn active" onclick="show('live', 'btn-live')">بث مباشر</button>
        <button id="btn-archive" class="nav-btn" onclick="show('archive', 'btn-archive')">السابقة</button>
        <button id="btn-upcoming" class="nav-btn" onclick="show('upcoming', 'btn-upcoming')">القادمة</button>
    </nav>

    <div id="live" class="page active text-center">
        <div class="group-card py-16">
            <div class="flex items-center justify-center gap-2 mb-4"><span class="live-pulse"></span> <span class="text-red-500 font-bold">مباشر</span></div>
            <p class="text-xl text-slate-400">لا توجد مباراة مباشرة حالياً</p>
        </div>
    </div>

    <div id="archive" class="page">
        <h2 class="text-2xl font-bold text-center mb-6 text-yellow-500">نتائج المباريات</h2>
        <div class="group-card">
            <h3 class="text-lg font-bold text-yellow-400 mb-4 border-b border-gray-700 pb-2">المجموعة A</h3>
            <div class="grid grid-cols-2 gap-4 text-sm">
                <div class="space-y-3">
                    <p>🇲🇽 المكسيك 2 - 0 جنوب أفريقيا 🇿🇦</p>
                </div>
                <div class="space-y-3">
                    <p>🇰🇷 كوريا الجنوبية 2 - 1 التشيك 🇨🇿</p>
                </div>
            </div>
        </div>
        </div>

    <div id="upcoming" class="page text-center">
        <h2 class="text-2xl font-bold mb-4">المباريات القادمة</h2>
        <p class="text-yellow-500 font-bold mb-6">بتوقيت مكة المكرمة 🕋</p>
        <div class="group-card">
            <p class="text-lg">[الفريق A] vs [الفريق B] - [التاريخ] [الوقت]</p>
        </div>
    </div>

    <script>
        function show(pageId, btnId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.getElementById(btnId).classList.add('active');
        }
    </script>
</body>
</html>
