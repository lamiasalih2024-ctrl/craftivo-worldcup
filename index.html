<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Craftivo | تغطية كأس العالم 2026</title>
<style>
  body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #070b16; color: #fff; padding: 20px; }
  
  .header-container { text-align: center; margin-top: 30px; margin-bottom: 40px; }
  .title { font-size: 55px; font-weight: 900; color: #fff; margin: 0; }
  .subtitle { font-size: 32px; font-weight: 700; color: #00ff88; margin-top: 10px; }
  
  .nav-bar { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
  .nav-btn { padding: 18px 35px; font-size: 22px; font-weight: 800; border-radius: 15px; cursor: pointer; background: #1f2a44; border: none; color: #fff; transition: 0.3s; }
  .nav-btn:hover { background: #2d3e66; transform: scale(1.05); }
  
  .page { display: none; }
  .active { display: block; }
  
  .match { background: rgba(255,255,255,0.05); padding: 25px; margin: 15px 0; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 24px; border: 1px solid rgba(255,255,255,0.1); }
  
  .footer { text-align: center; margin-top: 60px; font-size: 20px; opacity: 0.7; }
</style>
</head>
<body>

<div class="header-container">
  <div class="title">Craftivo ⚽</div>
  <div class="subtitle">تغطية كأس العالم 2026</div>
</div>

<div class="nav-bar">
  <button class="nav-btn" onclick="show('live')">🔴 مباشر</button>
  <button class="nav-btn" onclick="show('archive')">📺 السابقة</button>
  <button class="nav-btn" onclick="show('upcoming')">⏳ القادمة</button>
</div>

<div id="live" class="page active">
  <div id="live-matches" style="text-align:center; font-size:20px;">جاري التحميل...</div>
</div>

<div id="archive" class="page">
  <div id="archive-matches" style="text-align:center; font-size:20px;">جاري التحميل...</div>
</div>

<div id="upcoming" class="page">
  <div id="upcoming-matches" style="text-align:center; font-size:20px;">جاري التحميل...</div>
</div>

<div class="footer">LMS 🤍</div>

<script>
function show(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// مفتاح الـ API مضاف هنا
const KEY = "7963d39579msh5453e0591f414a3p1d5c2ajsn5501d6706e57"; 

async function loadMatches(endpoint, boxId) {
  const box = document.getElementById(boxId);
  try {
    const res = await fetch(`https://v3.football.api-sports.io/${endpoint}`, {
      headers: {"x-apisports-key": KEY}
    });
    const data = await res.json();
    if(!data.response || data.response.length === 0) { box.innerHTML = "لا توجد مباريات حالياً."; return; }
    
    box.innerHTML = data.response.map(m => `
      <div class="match">
        <span>${m.teams.home.name}</span>
        <b style="color:#00ff88;">${m.goals.home ?? '0'} - ${m.goals.away ?? '0'}</b>
        <span>${m.teams.away.name}</span>
      </div>
    `).join('');
  } catch(e) { box.innerHTML = "حدث خطأ في الاتصال، يرجى التحديث."; }
}

loadMatches("fixtures?live=all", "live-matches");
loadMatches("fixtures?league=1&season=2026&status=FT", "archive-matches");
loadMatches("fixtures?league=1&season=2026&status=NS", "upcoming-matches");
</script>

</body>
</html>
