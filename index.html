<!-- صفحة الأرشيف المصححة والكاملة -->
<div class="card">
    <style>
        .group-title { text-align: center; font-size: 1.5em; margin-bottom: 20px; color: #fff; border-bottom: 1px solid #2c3e50; padding-bottom: 10px; }
        .match-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 15px; margin-bottom: 15px; }
        .team-box { display: flex; align-items: center; gap: 10px; }
        .team-box.left { justify-content: flex-start; }
        .team-box.right { justify-content: flex-end; flex-direction: row-reverse; }
        .res-box { font-weight: bold; color: #00ff88; font-size: 1.2em; min-width: 60px; text-align: center; }
        .flag { font-size: 1.8em; }
    </style>

    <!-- مثال لمجموعة واحدة - كرري نفس هذا التنسيق لبقية المجموعات -->
    <div class="group-box">
        <div class="group-title">المجموعة A</div>
        <div class="match-row">
            <div class="team-box left"><div class="flag">🇲🇽</div><div>المكسيك</div></div>
            <div class="res-box">2 - 0</div>
            <div class="team-box right"><div>جنوب أفريقيا</div><div class="flag">🇿🇦</div></div>
        </div>
        <div class="match-row">
            <div class="team-box left"><div class="flag">🇰🇷</div><div>كوريا الجنوبية</div></div>
            <div class="res-box">2 - 1</div>
            <div class="team-box right"><div>التشيك</div><div class="flag">🇨🇿</div></div>
        </div>
    </div>

    <!-- مجموعة B -->
    <div class="group-box">
        <div class="group-title">المجموعة B</div>
        <div class="match-row">
            <div class="team-box left"><div class="flag">🇨🇦</div><div>كندا</div></div>
            <div class="res-box">1 - 1</div>
            <div class="team-box right"><div>البوسنة</div><div class="flag">🇧🇦</div></div>
        </div>
        <div class="match-row">
            <div class="team-box left"><div class="flag">🇶🇦</div><div>قطر</div></div>
            <div class="res-box">1 - 1</div>
            <div class="team-box right"><div>سويسرا</div><div class="flag">🇨🇭</div></div>
        </div>
    </div>
    
    <!-- وهكذا دواليك لكل المجموعات بنفس التنسيق -->
</div>
