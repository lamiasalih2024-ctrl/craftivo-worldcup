<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تغطية كأس العالم 2026 | Craftivo</title>
    <style>
        body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; font-size: 20px; }
        .header { text-align: center; padding: 30px; border-bottom: 2px solid #D4AF37; }
        .main-title { font-size: 4.5em; font-weight: 900; color: #D4AF37; text-shadow: 0 0 20px #D4AF37; margin: 0; }
        .sub-title { font-size: 1.8em; color: #aaa; margin: 15px 0; }
        .tabs { display: flex; justify-content: center; gap: 15px; margin: 30px 0; flex-wrap: wrap; }
        .tab { padding: 15px 35px; background: #222; border: 2px solid #444; cursor: pointer; color: #D4AF37; border-radius: 10px; transition: 0.3s; font-size: 1.5em; font-weight: bold; }
        .tab.active { background: #D4AF37; color: #000; border-color: #D4AF37; }
        .page { display: none; padding: 25px; max-width: 950px; margin: auto; line-height: 1.8; }
        .page.active { display: block; }
        .group-card { background: #1a1a1a; border: 2px solid #333; border-radius: 15px; padding: 25px; margin-bottom: 25px; }
        .group-title { color: #D4AF37; font-size: 2em; font-weight: bold; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #444; padding-bottom: 15px; }
        .match-row { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid #222; font-size: 1.5em; }
        .points-row { margin-top: 20px; padding-top: 15px; border-top: 2px dashed #444; text-align: center; color: #D4AF37; font-weight: bold; font-size: 1.3em; line-height: 1.8; }
        .footer { text-align: center; padding: 50px; border-top: 2px solid #333; margin-top: 60px; color: #D4AF37; font-size: 1.8em; font-weight: bold; }
        
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spinning-ball { display: inline-block; animation: rotate 4s linear infinite; }
        .live-dot { height: 15px; width: 15px; background-color: red; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        .live-text { color: white; animation: blink 1s infinite; font-weight: bold; }
        .date-time { color: #888; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="main-title">CRAFTIVO <span class="spinning-ball">⚽</span></h1>
    <p class="sub-title">تغطية كأس العالم 2026 | بتوقيت مكة المكرمة</p>
</div>

<div class="tabs">
    <div class="tab active" onclick="showPage('live', this)">المباشر</div>
    <div class="tab" onclick="showPage('archive', this)">الأرشيف</div>
    <div class="tab" onclick="showPage('upcoming', this)">المباريات القادمة</div>
    <div class="tab" onclick="showPage('knockout', this)">الإقصائيات</div>
</div>

<div id="live" class="page active">
    <h2 style="font-size: 2.5em;">مباشر <span class="live-dot"></span></h2>
    <p class="live-text" style="font-size: 1.8em;">جاري التحديث...</p>
</div>

<div id="archive" class="page">
    <div id="archiveContainer"></div>
</div>

<div id="upcoming" class="page">
    <div id="upcomingContainer"></div>
</div>

<div id="knockout" class="page">
    <h2 style="text-align: center; color: #D4AF37; font-size: 2.5em;">خارطة الإقصائيات 🏆⏳</h2>
    <div class="group-card">
        <div class="match-row"><span>دور الـ 32</span><span>16 مباراة</span></div>
        <div class="match-row"><span>دور الـ 16</span><span>8 مباريات</span></div>
        <div class="match-row"><span>دور الـ 8 (ربع النهائي)</span><span>4 مباريات</span></div>
        <div class="match-row"><span>دور الـ 4 (نصف النهائي)</span><span>2 مباراة</span></div>
        <div class="match-row" style="color: #D4AF37; font-weight: bold;"><span>🏆 النهائي 🏆</span><span>مباراة واحدة</span></div>
    </div>
</div>

<div class="footer">Craft TV ♡ LMS</div>

<script>
    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    const archiveData = [
        {n: "أ", m: [{t1: "🇲🇽 المكسيك", s: "2 - 0", t2: "🇿🇦 جنوب أفريقيا"}, {t1: "🇰🇷 كوريا الجنوبية", s: "2 - 1", t2: "🇨🇿 التشيك"}, {t1: "🇨🇿 التشيك", s: "1 - 1", t2: "🇿🇦 جنوب أفريقيا"}, {t1: "🇲🇽 المكسيك", s: "1 - 0", t2: "🇰🇷 كوريا الجنوبية"}], p: "عدد النقاط: المكسيك (6) - كوريا الجنوبية (3) - التشيك (2) - جنوب أفريقيا (1)"},
        {n: "ب", m: [{t1: "🇨🇦 كندا", s: "1 - 1", t2: "🇧🇦 البوسنة والهرسك"}, {t1: "🇶🇦 قطر", s: "1 - 1", t2: "🇨🇭 سويسرا"}, {t1: "🇨🇭 سويسرا", s: "4 - 1", t2: "🇧🇦 البوسنة والهرسك"}, {t1: "🇨🇦 كندا", s: "6 - 0", t2: "🇶🇦 قطر"}], p: "عدد النقاط: كندا (4) - سويسرا (4) - البوسنة (1) - قطر (1)"},
        {n: "ج", m: [{t1: "🇧🇷 البرازيل", s: "1 - 1", t2: "🇲🇦 المغرب"}, {t1: "🇭🇹 هايتي", s: "0 - 1", t2: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا"}, {t1: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا", s: "0 - 1", t2: "🇲🇦 المغرب"}, {t1: "🇧🇷 البرازيل", s: "3 - 0", t2: "🇭🇹 هايتي"}], p: "عدد النقاط: المغرب (4) - البرازيل (4) - إسكتلندا (3) - هايتي (0)"},
        {n: "د", m: [{t1: "🇺🇸 الولايات المتحدة", s: "4 - 1", t2: "🇵🇾 باراغواي"}, {t1: "🇦🇺 أستراليا", s: "2 - 0", t2: "🇹🇷 تركيا"}, {t1: "🇺🇸 الولايات المتحدة", s: "2 - 0", t2: "🇦🇺 أستراليا"}, {t1: "🇹🇷 تركيا", s: "0 - 1", t2: "🇵🇾 باراغواي"}], p: "عدد النقاط: أمريكا (6) - تركيا (3) - أستراليا (3) - باراغواي (0)"},
        {n: "هـ", m: [{t1: "🇩🇪 ألمانيا", s: "7 - 1", t2: "🇨🇼 كوراساو"}, {t1: "🇨🇮 ساحل العاج", s: "1 - 0", t2: "🇪🇨 الإكوادور"}], p: "عدد النقاط: ألمانيا (3) - ساحل العاج (3) - الإكوادور (0) - كوراساو (0)"},
        {n: "و", m: [{t1: "🇯🇵 اليابان", s: "2 - 2", t2: "🇳🇱 هولندا"}, {t1: "🇸🇪 السويد", s: "5 - 1", t2: "تونس 🇹🇳"}, {t1: "🇳🇱 هولندا", s: "5 - 1", t2: "🇸🇪 السويد"}], p: "عدد النقاط: هولندا (4) - السويد (3) - اليابان (1) - تونس (0)"},
        {n: "ز", m: [{t1: "🇪🇸 إسبانيا", s: "0 - 0", t2: "🇨🇻 الرأس الأخضر"}, {t1: "🇸🇦 السعودية", s: "1 - 1", t2: "🇺🇾 أوروغواي"}], p: "عدد النقاط: السعودية (1) - أوروغواي (1) - إسبانيا (1) - الرأس الأخضر (1)"},
        {n: "ح", m: [{t1: "🇧🇪 بلجيكا", s: "1 - 1", t2: "🇪🇬 مصر"}, {t1: "🇮🇷 إيران", s: "2 - 2", t2: "🇳🇿 نيوزيلندا"}], p: "عدد النقاط: بلجيكا (1) - مصر (1) - إيران (1) - نيوزيلندا (1)"},
        {n: "ط", m: [{t1: "🇫🇷 فرنسا", s: "3 - 1", t2: "🇸🇳 السنغال"}, {t1: "🇮🇶 العراق", s: "1 - 4", t2: "🇳🇴 النرويج"}], p: "عدد النقاط: فرنسا (3) - النرويج (3) - السنغال (0) - العراق (0)"},
        {n: "ي", m: [{t1: "🇦🇹 النمسا", s: "3 - 1", t2: "🇯🇴 الأردن"}, {t1: "🇦🇷 الأرجنتين", s: "3 - 0", t2: "🇩🇿 الجزائر"}], p: "عدد النقاط: النمسا (3) - الأرجنتين (3) - الأردن (0) - الجزائر (0)"},
        {n: "ك", m: [{t1: "🇵🇹 البرتغال", s: "1 - 1", t2: "🇨🇩 الكونغو"}, {t1: "🇺🇿 أوزبكستان", s: "1 - 3", t2: "🇨🇴 كولومبيا"}], p: "عدد النقاط: كولومبيا (3) - البرتغال (1) - الكونغو (1) - أوزبكستان (0)"},
        {n: "ل", m: [{t1: "🏴󠁧󠁢󠁥󠁮󠁧󠁿 إنجلترا", s: "4 - 2", t2: "🇭🇷 كرواتيا"}, {t1: "🇵🇦 بنما", s: "1 - 0", t2: "🇬🇭 غانا"}], p: "عدد النقاط: إنجلترا (3) - بنما (3) - كرواتيا (0) - غانا (0)"}
    ];

    const upcomingData = [
        {n: "أ", m: [{t: "🇿🇦 جنوب أفريقيا VS 🇰🇷 كوريا الجنوبية", d: "25 يونيو، 04:00"}, {t: "🇨🇿 التشيك VS 🇲🇽 المكسيك", d: "25 يونيو، 04:00"}]},
        {n: "ب", m: [{t: "🇨🇭 سويسرا VS 🇨🇦 كندا", d: "24 يونيو، 22:00"}, {t: "🇧🇦 البوسنة والهرسك VS 🇶🇦 قطر", d: "24 يونيو، 22:00"}]},
        {n: "ج", m: [{t: "🇲🇦 المغرب VS 🇭🇹 هايتي", d: "25 يونيو، 01:00"}, {t: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا VS 🇧🇷 البرازيل", d: "25 يونيو، 01:00"}]},
        {n: "د", m: [{t: "🇹🇷 تركيا VS 🇺🇸 الولايات المتحدة", d: "26 يونيو، 05:00"}, {t: "🇵🇾 باراغواي VS 🇦🇺 أستراليا", d: "26 يونيو، 05:00"}]}
    ];

    const arcCont = document.getElementById('archiveContainer');
    archiveData.forEach(g => {
        let h = `<div class="group-card"><div class="group-title">المجموعة ${g.n}</div>`;
        g.m.forEach(m => h += `<div class="match-row"><span>${m.t1}</span><span style="color:#D4AF37;">${m.s}</span><span>${m.t2}</span></div>`);
        arcCont.innerHTML += h + `<div class="points-row">${g.p}</div></div>`;
    });

    const upCont = document.getElementById('upcomingContainer');
    upcomingData.forEach(g => {
        let h = `<div class="group-card"><div class="group-title">المجموعة ${g.n}</div>`;
        g.m.forEach(m => h += `<div class="match-row"><span>${m.t}</span><span class="date-time">${m.d}</span></div>`);
        upCont.innerHTML += h + `</div>`;
    });
</script>
</body>
</html>
