<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تغطية كأس العالم 2026 | Craftivo</title>
    <style>
        body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        .header { text-align: center; padding: 25px; border-bottom: 2px solid #D4AF37; }
        .main-title { font-size: 2.5em; color: #D4AF37; margin: 0; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .logo-ball { width: 45px; animation: rotate 3s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .tabs { display: flex; justify-content: space-between; margin: 20px 10px; gap: 5px; }
        .tab { flex: 1; padding: 15px 5px; background: #222; cursor: pointer; color: #D4AF37; border-radius: 8px; font-weight: 900; text-align: center; font-size: 18px; border: 2px solid #D4AF37; }
        .tab.active { background: #D4AF37; color: #000; }
        
        .page { display: none; padding: 15px; max-width: 600px; margin: auto; }
        .page.active { display: block; }
        
        .group-card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .group-title { color: #D4AF37; font-weight: 900; text-align: center; font-size: 20px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .match-row { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; padding: 10px 0; }
        .team { display: flex; flex-direction: column; align-items: center; width: 35%; gap: 5px; }
        .team span { font-size: 16px; font-weight: bold; }
        .score { font-size: 24px; font-weight: 900; color: #D4AF37; width: 20%; text-align: center; }
        
        .standings { margin-top: 15px; color: #fff; font-size: 17px; font-weight: bold; text-align: center; background: #222; padding: 10px; border-radius: 8px; }
        .footer { text-align: center; padding: 20px; color: #D4AF37; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="main-title"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccerball.svg" class="logo-ball"> CRAFTIVO</h1>
</div>

<div class="tabs">
    <div class="tab active" onclick="showPage('live', this)">المباشر</div>
    <div class="tab" onclick="showPage('archive', this)">الأرشيف</div>
    <div class="tab" onclick="showPage('upcoming', this)">القادمة</div>
    <div class="tab" onclick="showPage('knockout', this)">الإقصائيات</div>
</div>

<div id="live" class="page active"><div class="group-card" style="text-align: center;">جاري التحديث...</div></div>
<div id="archive" class="page"></div>
<div id="upcoming" class="page"></div>
<div id="knockout" class="page"></div>

<div class="footer">Craft TV ♡ LMS</div>

<script>
    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    const data = [
        {n: "أ", m: [{t1: "🇲🇽 المكسيك", s: "2-0", t2: "🇿🇦 جنوب أفريقيا"}, {t1: "🇰🇷 كوريا الجنوبية", s: "2-1", t2: "🇨🇿 التشيك"}, {t1: "🇨🇿 التشيك", s: "1-1", t2: "🇿🇦 جنوب أفريقيا"}, {t1: "🇲🇽 المكسيك", s: "1-0", t2: "🇰🇷 كوريا الجنوبية"}]},
        {n: "ب", m: [{t1: "🇨🇦 كندا", s: "1-1", t2: "🇧🇦 البوسنة والهرسك"}, {t1: "🇶🇦 قطر", s: "1-1", t2: "🇨🇭 سويسرا"}, {t1: "🇨🇭 سويسرا", s: "4-1", t2: "🇧🇦 البوسنة والهرسك"}, {t1: "🇨🇦 كندا", s: "6-0", t2: "🇶🇦 قطر"}]}
        /* يمكنك إضافة باقي المجموعات بنفس هذا التنسيق */
    ];

    function toAr(n) { return n.toString().replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]); }

    const arcCont = document.getElementById('archive');
    data.forEach(g => {
        let h = `<div class="group-card"><div class="group-title">المجموعة ${g.n}</div>`;
        let t = {};
        g.m.forEach(m => {
            let [g1, g2] = m.s.split('-').map(Number);
            h += `<div class="match-row">
                    <div class="team">${m.t1}</div>
                    <div class="score">${toAr(g1)}-${toAr(g2)}</div>
                    <div class="team">${m.t2}</div>
                  </div>`;
            [m.t1, m.t2].forEach(n => { if(!t[n]) t[n] = 0; });
            if(g1 > g2) t[m.t1] += 3; else if(g2 > g1) t[m.t2] += 3; else { t[m.t1] += 1; t[m.t2] += 1; }
        });
        let res = Object.entries(t).sort((a,b) => b[1] - a[1]).map(i => `${i[0].replace(/[^أ-ي]/g, '')}(${toAr(i[1])})`).join('، ');
        arcCont.innerHTML += h + `<div class="standings">النقاط: ${res}</div></div>`;
    });
</script>
</body>
</html>
