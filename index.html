<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تغطية كأس العالم 2026 - Craftivo</title>
    <style>
        body { background-color: #0b0e14; color: #ffffff; font-family: 'Arial', sans-serif; padding: 20px; }
        .brand-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #D4AF37; padding-bottom: 10px; }
        .brand-title { color: #D4AF37; font-size: 2.5em; font-weight: 900; margin: 0; letter-spacing: 2px; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .group-card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 15px; transition: 0.3s; }
        .group-card:hover { border-color: #D4AF37; }
        .group-title { color: #D4AF37; font-size: 1.3em; text-align: center; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .match-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 1em; }
        .team { width: 40%; display: flex; align-items: center; white-space: nowrap; }
        .score { width: 20%; text-align: center; font-weight: bold; color: #D4AF37; background: #222; border-radius: 4px; padding: 2px 0; }
    </style>
</head>
<body>

    <div class="brand-header"><h1 class="brand-title">CRAFTIVO</h1></div>

    <div class="container" id="dataContainer"></div>

    <script>
        const groups = [
            {n: "أ", m: [{t1: "🇲🇽 المكسيك", s: "2 - 0", t2: "🇿🇦 جنوب أفريقيا"}, {t1: "🇰🇷 كوريا الجنوبية", s: "2 - 1", t2: "🇨🇿 التشيك"}, {t1: "🇨🇿 التشيك", s: "1 - 1", t2: "🇿🇦 جنوب أفريقيا"}, {t1: "🇲🇽 المكسيك", s: "1 - 0", t2: "🇰🇷 كوريا الجنوبية"}]},
            {n: "ب", m: [{t1: "🇨🇦 كندا", s: "1 - 1", t2: "🇧🇦 البوسنة والهرسك"}, {t1: "🇶🇦 قطر", s: "1 - 1", t2: "🇨🇭 سويسرا"}, {t1: "🇨🇭 سويسرا", s: "4 - 1", t2: "🇧🇦 البوسنة والهرسك"}, {t1: "🇨🇦 كندا", s: "6 - 0", t2: "🇶🇦 قطر"}]},
            {n: "ج", m: [{t1: "🇧🇷 البرازيل", s: "1 - 1", t2: "🇲🇦 المغرب"}, {t1: "🇭🇹 هايتي", s: "0 - 1", t2: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا"}, {t1: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا", s: "0 - 1", t2: "🇲🇦 المغرب"}, {t1: "🇧🇷 البرازيل", s: "3 - 0", t2: "🇭🇹 هايتي"}]},
            {n: "د", m: [{t1: "🇺🇸 الولايات المتحدة", s: "4 - 1", t2: "🇵🇾 باراغواي"}, {t1: "🇦🇺 أستراليا", s: "2 - 0", t2: "🇹🇷 تركيا"}, {t1: "🇺🇸 الولايات المتحدة", s: "2 - 0", t2: "🇦🇺 أستراليا"}, {t1: "🇹🇷 تركيا", s: "0 - 1", t2: "🇵🇾 باراغواي"}]},
            {n: "هـ", m: [{t1: "🇩🇪 ألمانيا", s: "7 - 1", t2: "🇨🇼 كوراساو"}, {t1: "🇨🇮 ساحل العاج", s: "1 - 0", t2: "🇪🇨 الإكوادور"}]},
            {n: "و", m: [{t1: "🇯🇵 اليابان", s: "2 - 2", t2: "🇳🇱 هولندا"}, {t1: "🇸🇪 السويد", s: "5 - 1", t2: "🇹🇳 تونس"}]},
            {n: "ز", m: [{t1: "🇪🇸 إسبانيا", s: "0 - 0", t2: "🇨🇻 الرأس الأخضر"}, {t1: "🇸🇦 السعودية", s: "1 - 1", t2: "🇺🇾 أوروغواي"}]},
            {n: "ح", m: [{t1: "🇧🇪 بلجيكا", s: "1 - 1", t2: "🇪🇬 مصر"}, {t1: "🇮🇷 إيران", s: "2 - 2", t2: "🇳🇿 نيوزيلندا"}]},
            {n: "ط", m: [{t1: "🇫🇷 فرنسا", s: "3 - 1", t2: "🇸🇳 السنغال"}, {t1: "🇮🇶 العراق", s: "1 - 4", t2: "🇳🇴 النرويج"}]},
            {n: "ي", m: [{t1: "🇦🇹 النمسا", s: "3 - 1", t2: "🇯🇴 الأردن"}, {t1: "🇦🇷 الأرجنتين", s: "3 - 0", t2: "🇩🇿 الجزائر"}]},
            {n: "ك", m: [{t1: "🇵🇹 البرتغال", s: "1 - 1", t2: "🇨🇩 الكونغو"}, {t1: "🇺🇿 أوزبكستان", s: "1 - 3", t2: "🇨🇴 كولومبيا"}]},
            {n: "ل", m: [{t1: "🏴󠁧󠁢󠁥󠁮󠁧󠁿 إنجلترا", s: "4 - 2", t2: "🇭🇷 كرواتيا"}, {t1: "🇵🇦 بنما", s: "1 - 0", t2: "🇬🇭 غانا"}]}
        ];

        const container = document.getElementById('dataContainer');
        groups.forEach(g => {
            let html = `<div class="group-card"><div class="group-title">المجموعة ${g.n}</div>`;
            g.m.forEach(m => {
                html += `<div class="match-row"><div class="team" style="justify-content: flex-end;">${m.t1}</div><div class="score">${m.s}</div><div class="team" style="justify-content: flex-start;">${m.t2}</div></div>`;
            });
            html += `</div>`;
            container.innerHTML += html;
        });
    </script>
</body>
</html>
