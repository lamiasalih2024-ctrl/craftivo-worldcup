<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغطية كأس العالم 2026 | Craftivo</title>
    <style>
        body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        .header { text-align: center; padding: 20px; border-bottom: 2px solid #D4AF37; }
        .main-title { font-size: 2em; font-weight: 900; color: #D4AF37; }
        .tabs { display: flex; justify-content: center; gap: 5px; margin: 15px 0; }
        .tab { padding: 10px 10px; background: #222; border: 1px solid #444; cursor: pointer; color: #D4AF37; border-radius: 5px; font-size: 0.8em; }
        .tab.active { background: #D4AF37; color: #000; }
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .group-card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 12px; margin-bottom: 15px; }
        .group-title { color: #D4AF37; font-weight: bold; text-align: center; margin-bottom: 10px; border-bottom: 1px solid #444; }
        .match-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #222; font-size: 0.9em; }
        .score { color: #D4AF37; font-weight: bold; min-width: 45px; text-align: center; }
        .points-row { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #444; text-align: center; color: #D4AF37; font-size: 0.8em; }
        .upcoming-item { padding: 8px; text-align: center; border-bottom: 1px solid #333; font-size: 0.85em; }
        .live-dot { height: 10px; width: 10px; background-color: red; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="header">
    <h1 class="main-title">CRAFTIVO ⚽</h1>
</div>

<div class="tabs">
    <div class="tab" onclick="showPage('live', this)">المباشر</div>
    <div class="tab active" onclick="showPage('archive', this)">الأرشيف</div>
    <div class="tab" onclick="showPage('upcoming', this)">القادمة</div>
    <div class="tab" onclick="showPage('knockout', this)">الإقصائيات</div>
</div>

<div id="live" class="page"><h2 style="color:red">مباشر <span class="live-dot"></span></h2><p>جاري التحديث...</p></div>
<div id="archive" class="page active"><div id="archiveContainer"></div></div>
<div id="upcoming" class="page"><div id="upcomingContainer"></div></div>
<div id="knockout" class="page">
    <div class="group-card">
        <div class="group-title">خارطة الإقصائيات 🏆</div>
        <div class="match-row"><span>دور الـ 32</span><span>16 مباراة</span></div>
        <div class="match-row"><span>دور الـ 16</span><span>8 مباريات</span></div>
        <div class="match-row"><span>ربع النهائي</span><span>4 مباريات</span></div>
        <div class="match-row"><span>نصف النهائي</span><span>2 مباراة</span></div>
        <div class="match-row" style="color:#D4AF37"><span>النهائي</span><span>1 مباراة</span></div>
    </div>
</div>

<script>
    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    const archiveData = [
        {n: "أ", m: [{t1: "🇲🇽 المكسيك", s: "2-0", t2: "🇿🇦 جنوب أفريقيا"}, {t1: "🇰🇷 كوريا", s: "2-1", t2: "🇨🇿 التشيك"}, {t1: "🇨🇿 التشيك", s: "1-1", t2: "🇿🇦 جنوب أفريقيا"}, {t1: "🇲🇽 المكسيك", s: "1-0", t2: "🇰🇷 كوريا"}], p: "النقاط: المكسيك (6)، كوريا (3)، جنوب أفريقيا (1)، التشيك (1)"},
        {n: "ب", m: [{t1: "🇨🇦 كندا", s: "1-1", t2: "🇧🇦 البوسنة"}, {t1: "🇶🇦 قطر", s: "1-1", t2: "🇨🇭 سويسرا"}, {t1: "🇨🇭 سويسرا", s: "4-1", t2: "🇧🇦 البوسنة"}, {t1: "🇨🇦 كندا", s: "6-0", t2: "🇶🇦 قطر"}], p: "النقاط: كندا (4)، سويسرا (4)، البوسنة (1)، قطر (1)"},
        {n: "ج", m: [{t1: "🇧🇷 البرازيل", s: "1-1", t2: "🇲🇦 المغرب"}, {t1: "🇭🇹 هايتي", s: "0-1", t2: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا"}, {t1: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا", s: "0-1", t2: "🇲🇦 المغرب"}, {t1: "🇧🇷 البرازيل", s: "3-0", t2: "🇭🇹 هايتي"}], p: "النقاط: المغرب (4)، البرازيل (4)، إسكتلندا (3)، هايتي (0)"},
        {n: "د", m: [{t1: "🇺🇸 أمريكا", s: "4-1", t2: "🇵🇾 باراغواي"}, {t1: "🇦🇺 أستراليا", s: "2-0", t2: "🇹🇷 تركيا"}, {t1: "🇺🇸 أمريكا", s: "2-0", t2: "🇦🇺 أستراليا"}, {t1: "🇹🇷 تركيا", s: "0-1", t2: "🇵🇾 باراغواي"}], p: "النقاط: أمريكا (6)، باراغواي (3)، أستراليا (3)، تركيا (0)"},
        {n: "هـ", m: [{t1: "🇩🇪 ألمانيا", s: "7-1", t2: "🇨🇼 كوراساو"}, {t1: "🇨🇮 كوت ديفوار", s: "1-0", t2: "🇪🇨 الإكوادور"}], p: "النقاط: ألمانيا (3)، كوت ديفوار (3)، الإكوادور (0)، كوراساو (0)"},
        {n: "و", m: [{t1: "🇯🇵 اليابان", s: "2-2", t2: "🇳🇱 هولندا"}, {t1: "🇸🇪 السويد", s: "5-1", t2: "🇹🇳 تونس"}, {t1: "🇳🇱 هولندا", s: "5-1", t2: "🇸🇪 السويد"}], p: "النقاط: هولندا (4)، السويد (3)، اليابان (1)، تونس (0)"},
        {n: "ز", m: [{t1: "🇪🇸 إسبانيا", s: "0-0", t2: "🇨🇻 الرأس الأخضر"}, {t1: "🇸🇦 السعودية", s: "1-1", t2: "🇺🇾 أوروغواي"}], p: "النقاط: السعودية (1)، أوروغواي (1)، إسبانيا (1)، الرأس الأخضر (1)"},
        {n: "ح", m: [{t1: "🇧🇪 بلجيكا", s: "1-1", t2: "🇪🇬 مصر"}, {t1: "🇮🇷 إيران", s: "2-2", t2: "🇳🇿 نيوزيلندا"}], p: "النقاط: بلجيكا (1)، مصر (1)، إيران (1)، نيوزيلندا (1)"},
        {n: "ط", m: [{t1: "🇫🇷 فرنسا", s: "3-1", t2: "🇸🇳 السنغال"}, {t1: "🇮🇶 العراق", s: "1-4", t2: "🇳🇴 النرويج"}], p: "النقاط: فرنسا (3)، النرويج (3)، السنغال (0)، العراق (0)"},
        {n: "ي", m: [{t1: "🇦🇹 النمسا", s: "3-1", t2: "🇯🇴 الأردن"}, {t1: "🇦🇷 الأرجنتين", s: "3-0", t2: "🇩🇿 الجزائر"}], p: "النقاط: النمسا (3)، الأرجنتين (3)، الأردن (0)، الجزائر (0)"},
        {n: "ك", m: [{t1: "🇵🇹 البرتغال", s: "1-1", t2: "🇨🇩 الكونغو"}, {t1: "🇺🇿 أوزبكستان", s: "1-3", t2: "🇨🇴 كولومبيا"}], p: "النقاط: كولومبيا (3)، البرتغال (1)، الكونغو (1)، أوزبكستان (0)"},
        {n: "ل", m: [{t1: "🏴󠁧󠁢󠁥󠁮󠁧󠁿 إنجلترا", s: "4-2", t2: "🇭🇷 كرواتيا"}, {t1: "🇵🇦 بنما", s: "1-0", t2: "🇬🇭 غانا"}], p: "النقاط: كرواتيا (3)، إنجلترا (3)، بنما (3)، غانا (0)"}
    ];

    const upcomingData = [
        {n: "أ", m: ["🇿🇦 جنوب أفريقيا VS 🇰🇷 كوريا الجنوبية - 25 يونيو 04:00", "🇨🇿 التشيك VS 🇲🇽 المكسيك - 25 يونيو 04:00"]},
        {n: "ب", m: ["🇨🇭 سويسرا VS 🇨🇦 كندا - 24 يونيو 22:00", "🇧🇦 البوسنة VS 🇶🇦 قطر - 24 يونيو 22:00"]},
        {n: "ج", m: ["🇲🇦 المغرب VS 🇭🇹 هايتي - 25 يونيو 01:00", "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا VS 🇧🇷 البرازيل - 25 يونيو 01:00"]},
        {n: "د", m: ["🇹🇷 تركيا VS 🇺🇸 أمريكا - 26 يونيو 05:00", "🇵🇾 باراغواي VS 🇦🇺 أستراليا - 26 يونيو 05:00"]},
        {n: "هـ", m: ["🇩🇪 ألمانيا VS 🇨🇮 كوت ديفوار - اليوم 23:00", "🇪🇨 الإكوادور VS 🇨🇼 كوراساو - غداً 03:00"]},
        {n: "و", m: ["🇹🇳 تونس VS 🇯🇵 اليابان - غداً 07:00", "🇯🇵 اليابان VS 🇸🇪 السويد - 26 يونيو 02:00"]},
        {n: "ز", m: ["🇪🇸 إسبانيا VS 🇸🇦 السعودية - 19:00", "🇺🇾 أوروغواي VS 🇨🇻 الرأس الأخضر - 22 يونيو 01:00"]},
        {n: "ح", m: ["🇧🇪 بلجيكا VS 🇮🇷 إيران - 22:00", "🇳🇿 نيوزيلندا VS 🇪🇬 مصر - 22 يونيو 04:00"]},
        {n: "ط", m: ["🇫🇷 فرنسا VS 🇮🇶 العراق - 23 يونيو 00:00", "🇳🇴 النرويج VS 🇸🇳 السنغال - 23 يونيو 03:00"]},
        {n: "ي", m: ["🇦🇷 الأرجنتين VS 🇦🇹 النمسا - 22 يونيو 20:00", "🇯🇴 الأردن VS 🇩🇿 الجزائر - 23 يونيو 06:00"]},
        {n: "ك", m: ["🇵🇹 البرتغال VS 🇺🇿 أوزبكستان - 23 يونيو 20:00", "🇨🇴 كولومبيا VS 🇨🇩 الكونغو - 24 يونيو 05:00"]},
        {n: "ل", m: ["🏴󠁧󠁢󠁥󠁮󠁧󠁿 إنجلترا VS 🇬🇭 غانا - 23 يونيو 23:00", "🇵🇦 بنما VS 🇭🇷 كرواتيا - 24 يونيو 02:00"]}
    ];

    archiveData.forEach(g => {
        let h = `<div class="group-card"><div class="group-title">المجموعة ${g.n}</div>`;
        g.m.forEach(m => h += `<div class="match-row"><div>${m.t1}</div><div class="score">${m.s}</div><div>${m.t2}</div></div>`);
        document.getElementById('archiveContainer').innerHTML += h + `<div class="points-row">${g.p}</div></div>`;
    });

    upcomingData.forEach(g => {
        let h = `<div class="group-card"><div class="group-title">المجموعة ${g.n}</div>`;
        g.m.forEach(m => h += `<div class="upcoming-item">${m}</div>`);
        document.getElementById('upcomingContainer').innerHTML += h + `</div>`;
    });
</script>
</body>
</html>
