<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Craftivo | تغطية كأس العالم 2026</title>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6">
  <div class="max-w-2xl mx-auto text-center">
    <h1 class="text-4xl font-black text-yellow-500 mb-2">Craftivo</h1>
    <p class="text-gray-400 mb-8">تغطية كأس العالم 2026</p>
    
    <!-- منطقة النتائج -->
    <div id="live-scores" class="space-y-4">
      <div class="p-6 bg-slate-900 rounded-2xl border border-slate-800">
        جاري تحديث البيانات...
      </div>
    </div>

    <!-- توقيع الموقع -->
    <footer class="mt-12 text-sm text-gray-500">
      <p>❤️ Craftivo | LMS</p>
    </footer>
  </div>

  <script>
    async function fetchScores() {
      try {
        const res = await fetch("/api/football");
        const data = await res.json();
        const liveScoresDiv = document.getElementById('live-scores');
        
        if (data.response && data.response.length > 0) {
          liveScoresDiv.innerHTML = data.response.map(game => {
            const isLive = game.fixture.status.short === '1H' || game.fixture.status.short === '2H' || game.fixture.status.short === 'ET';
            return `
              <div class="p-6 bg-slate-900 rounded-2xl border ${isLive ? 'border-red-500/30' : 'border-slate-800'}">
                ${isLive ? '<div class="text-red-500 font-bold animate-pulse">🔴 مباشر</div>' : '<div class="text-gray-400 text-sm">مباراة</div>'}
                <div class="text-xl font-bold my-2">${game.teams.home.name} ${game.goals.home ?? 0} - ${game.goals.away ?? 0} ${game.teams.away.name}</div>
              </div>
            `;
          }).join('');
        } else {
          liveScoresDiv.innerHTML = '<div class="p-6 text-gray-500">لا توجد مباريات حالياً.</div>';
        }
      } catch (err) {
        console.error("خطأ في جلب البيانات:", err);
      }
    }

    fetchScores();
    setInterval(fetchScores, 60000);
  </script>
</body>
</html>
