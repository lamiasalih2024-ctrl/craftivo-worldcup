<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #05070f; color: #fff; font-family: sans-serif; }
    .card { background: #1a1a2e; border-radius: 15px; padding: 15px; margin-bottom: 10px; border: 1px solid #333; }
    .live-card { border: 2px solid #dc2626; background: #1f0b0b; }
    .title-yellow { color: #fbbf24; font-weight: bold; }
    .match-row { font-size: 1.1rem; font-weight: bold; }
  </style>
</head>
<body class="p-4">

<div class="max-w-xl mx-auto">
  <h1 class="text-3xl font-black text-center text-yellow-500 py-4">Craftivo</h1>
  
  <div id="live-container"></div>
  <div id="groups-container"></div>

  <div class="text-center mt-10 border-t border-gray-800 pt-6">
    <div style="font-size: 2rem;">🤍</div>
    <p class="text-gray-400 font-bold">Craftivo | LMS</p>
  </div>
</div>

<script>
if (Notification.permission !== "granted") Notification.requestPermission();

const matchesData = [
  { group:"LIVE", home: "🇨🇬 الكونغو", away: "🇵🇹 البرتغال", score: "0 - 1" },
  { group:"A", home: "🇲🇽 المكسيك", away: "🇿🇦 ج.أفريقيا", score: "2 - 0" },
  { group:"B", home: "🇨🇦 كندا", away: "🇧🇦 البوسنة", score: "1 - 1" },
  { group:"C", home: "🇩🇪 ألمانيا", away: "🇨🇼 كوراساو", score: "7 - 1" },
  { group:"D", home: "🇫🇷 فرنسا", away: "🇸🇳 السنغال", score: "3 - 1" },
  { group:"E", home: "🇸🇪 السويد", away: "🇹🇳 تونس", score: "5 - 1" },
  { group:"F", home: "🇸🇦 السعودية", away: "🇺🇾 الأوروغواي", score: "1 - 1" },
  { group:"G", home: "🇮🇷 إيران", away: "🇳🇿 نيوزيلندا", score: "2 - 2" },
  { group:"H", home: "🇶🇦 قطر", away: "🇨🇭 سويسرا", score: "1 - 1" },
  { group:"I", home: "🇯🇵 اليابان", away: "🇳🇴 النرويج", score: "0 - 0" },
  { group:"J", home: "🇧🇷 البرازيل", away: "🇲🇦 المغرب", score: "3 - 0" },
  { group:"K", home: "🇮🇹 إيطاليا", away: "🇳🇬 نيجيريا", score: "2 - 1" },
  { group:"L", home: "🇪🇸 إسبانيا", away: "🇪🇬 مصر", score: "0 - 0" }
];

// عرض المباشر
const live = matchesData.find(m => m.group === "LIVE");
document.getElementById("live-container").innerHTML = `
  <div class="card live-card">
    <div class="text-red-500 font-bold mb-1 animate-pulse">مباشر الآن 🔴</div>
    <div class="match-row">${live.home} ${live.score} ${live.away}</div>
  </div>`;
if (Notification.permission === "granted") new Notification("⚽ هدف مباشر!", { body: `${live.home} ${live.score} ${live.away}` });

// عرض المجموعات كاملة
const groups = document.getElementById("groups-container");
matchesData.filter(m => m.group !== "LIVE").forEach(m => {
  groups.innerHTML += `
    <div class="card">
      <div class="title-yellow">المجموعة ${m.group}</div>
      <div class="match-row">${m.home} ${m.score} ${m.away}</div>
    </div>`;
});
</script>
</body>
</html>
