<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Craftivo | تغطية كأس العالم 2026</title>
    <style>
        body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        .header { text-align: center; padding: 25px; border-bottom: 3px solid #D4AF37; }
        .main-title { font-size: 2.5em; font-weight: 900; color: #D4AF37; margin: 0; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .ball { display: inline-block; animation: rotate 3s linear infinite; font-size: 0.8em; margin: 0 10px; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .sub-header { color: #fff; font-size: 1.1em; margin-top: 5px; }
        .makkah-time { color: #aaa; font-size: 0.85em; }
        .tabs { display: flex; justify-content: center; gap: 5px; margin: 20px 0; }
        .tab { padding: 8px 12px; background: #222; border: 1px solid #444; cursor: pointer; color: #D4AF37; font-weight: bold; border-radius: 5px; font-size: 0.85em; }
        .tab.active { background: #D4AF37; color: #000; border-color: #D4AF37; }
        .page { display: none; padding: 15px; max-width: 600px; margin: auto; }
        .page.active { display: block; }
        .group-card { background: #151515; border: 1px solid #333; padding: 12px; margin-bottom: 15px; border-radius: 10px; }
        .group-name { color: #D4AF37; text-align: center; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .match-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 7px 0; border-bottom: 1px solid #222; font-size: 0.9em; }
        .score { color: #D4AF37; font-weight: bold; background: #222; padding: 2px 10px; border-radius: 4px; margin: 0 10px; }
        .points-table { margin-top: 8px; font-size: 0.75em; color: #ddd; text-align: center; border-top: 1px dashed #444; padding-top: 6px; }
        .footer { text-align: center; padding: 30px; font-weight: bold; border-top: 2px solid #333; }
        .live-dot { height: 12px; width: 12px; background-color: red; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="main-title"><span class="ball">⚽</span> Craftivo</h1>
    <p class="sub-header">تغطية كأس العالم 2026</p>
    <p class="makkah-time">بتوقيت مكة المكرمة</p>
</div>

<div class="tabs">
    <div class="tab active" onclick="showPage('live', this)">المباشر</div>
    <div class="tab" onclick="showPage('archive', this)">الأرشيف</div>
    <div class="tab" onclick="showPage('upcoming', this)">القادمة</div>
    <div class="tab" onclick="showPage('knockout', this)">الإقصائيات</div>
</div>

<div id="live" class="page active" style="text-align:center;">
    <span class="live-dot"></span> <span style="color:red; font-weight:bold;">مباشر</span>
    <p>جاري التحديث ....</p>
</div>

<div id="archive" class="page"><div id="arc-content"></div></div>
<div id="upcoming" class="page"><div id="up-content"></div></div>
<div id="knockout" class="page">
    <div class="group-card">
        <div class="match-row"><span>دور الـ 32</span><span>16 مباراة</span></div>
        <div class="match-row"><span>دور الـ 16</span><span>8 مباريات</span></div>
        <div class="match-row"><span>دور الـ 8</span><span>4 مباريات</span></div>
        <div class="match-row"><span>دور الـ 4</span><span>2 مباراة</span></div>
        <div class="match-row" style="color:#D4AF37;"><span>الفاينال 🏆</span><span>مباراة واحدة</span></div>
    </div>
</div>

<div class="footer">Craftivo 🤍 LMS</div>

<script>
    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    const archiveData = [
        {n: "المجموعة أ", m: [{t1: "المكسيك 🇲🇽", s: "0 : 2", t2: "جنوب أفريقيا 🇿🇦"}, {t1: "كوريا 🇰🇷", s: "2 : 1", t2: "التشيك 🇨🇿"}], pts: "🇿🇦 3 | 🇰🇷 3 | 🇨🇿 1 | 🇲🇽 0"},
        {n: "المجموعة ب", m: [{t1: "كندا 🇨🇦", s: "1 : 1", t2: "البوسنة 🇧🇦"}, {t1: "قطر 🇶🇦", s: "1 : 1", t2: "سويسرا 🇨🇭"}], pts: "🇨🇦 2 | 🇧🇦 2 | 🇶🇦 2 | 🇨🇭 2"},
        {n: "المجموعة ج", m: [{t1: "البرازيل 🇧🇷", s: "1 : 1", t2: "المغرب 🇲🇦"}, {t1: "هايتي 🇭🇹", s: "0 : 1", t2: "إسكتلندا 🏴󠁧󠁢󠁳󠁣󠁴󠁿"}], pts: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 3 | 🇧🇷 1 | 🇲🇦 1 | 🇭🇹 0"},
        {n: "المجموعة د", m: [{t1: "أمريكا 🇺🇸", s: "4 : 1", t2: "باراغواي 🇵🇾"}, {t1: "أستراليا 🇦🇺", s: "0 : 2", t2: "تركيا 🇹🇷"}], pts: "🇺🇸 3 | 🇹🇷 3 | 🇦🇺 0 | 🇵🇾 0"},
        {n: "المجموعة هـ", m: [{t1: "ألمانيا 🇩🇪", s: "7 : 1", t2: "كوراساو 🇨🇼"}, {t1: "ساحل العاج 🇨🇮", s: "0 : 1", t2: "الإكوادور 🇪🇨"}], pts: "🇩🇪 3 | 🇪🇨 3 | 🇨🇮 0 | 🇨🇼 0"},
        {n: "المجموعة و", m: [{t1: "اليابان 🇯🇵", s: "2 : 2", t2: "هولندا 🇳🇱"}, {t1: "السويد 🇸🇪", s: "5 : 1", t2: "تونس 🇹🇳"}], pts: "🇸🇪 3 | 🇯🇵 1 | 🇳🇱 1 | 🇹🇳 0"},
        {n: "المجموعة ز", m: [{t1: "إسبانيا 🇪🇸", s: "0 : 0", t2: "الرأس الأخضر 🇨🇻"}, {t1: "السعودية 🇸🇦", s: "1 : 1", t2: "أوروغواي 🇺🇾"}], pts: "🇸🇦 1 | 🇺🇾 1 | 🇪🇸 1 | 🇨🇻 1"},
        {n: "المجموعة ح", m: [{t1: "بلجيكا 🇧🇪", s: "1 : 1", t2: "مصر 🇪🇬"}, {t1: "إيران 🇮🇷", s: "2 : 2", t2: "نيوزيلندا 🇳🇿"}], pts: "🇧🇪 1 | 🇪🇬 1 | 🇮🇷 1 | 🇳🇿 1"},
        {n: "المجموعة ط", m: [{t1: "الأرجنتين 🇦🇷", s: "0 : 0", t2: "السنغال 🇸🇳"}, {t1: "غانا 🇬🇭", s: "1 : 2", t2: "كرواتيا 🇭🇷"}], pts: "🇭🇷 3 | 🇦🇷 1 | 🇸🇳 1 | 🇬🇭 0"},
        {n: "المجموعة ي", m: [{t1: "فرنسا 🇫🇷", s: "3 : 0", t2: "فيتنام 🇻🇳"}, {t1: "صربيا 🇷🇸", s: "1 : 1", t2: "نيجيريا 🇳🇬"}], pts: "🇫🇷 3 | 🇷🇸 1 | 🇳🇬 1 | 🇻🇳 0"},
        {n: "المجموعة ك", m: [{t1: "إيطاليا 🇮🇹", s: "2 : 0", t2: "أوزبكستان 🇺🇿"}, {t1: "البيرو 🇵🇪", s: "0 : 1", t2: "النرويج 🇳🇴"}], pts: "🇮🇹 3 | 🇳🇴 3 | 🇵🇪 0 | 🇺🇿 0"},
        {n: "المجموعة ل", m: [{t1: "إنجلترا 🏴󠁧󠁢󠁥󠁮󠁧󠁿", s: "4 : 0", t2: "تنزانيا 🇹🇿"}, {t1: "البرتغال 🇵🇹", s: "1 : 0", t2: "كولومبيا 🇨🇴"}], pts: "🏴󠁧󠁢󠁥󠁮󠁧󠁿 3 | 🇵🇹 3 | 🇨🇴 0 | 🇹🇿 0"}
    ];

    const upcomingData = [
        {n: "المجموعة هـ", m: [{t1: "ألمانيا 🇩🇪", s: "22:00", t2: "ساحل العاج 🇨🇮"}]},
        {n: "المجموعة و", m: [{t1: "هولندا 🇳🇱", s: "19:00", t2: "السويد 🇸🇪"}]}
    ];

    const arcDiv = document.getElementById('arc-content');
    archiveData.forEach(g => {
        let h = `<div class="group-card"><div class="group-name">${g.n}</div>`;
        g.m.forEach(m => h += `<div class="match-row"><div>${m.t1}</div><div class="score">${m.s}</div><div>${m.t2}</div></div>`);
        h += `<div class="points-table">${g.pts}</div></div>`;
        arcDiv.innerHTML += h;
    });

    const upDiv = document.getElementById('up-content');
    upcomingData.forEach(g => {
        let h = `<div class="group-card"><div class="group-name">${g.n}</div>`;
        g.m.forEach(m => h += `<div class="match-row"><div>${m.t1}</div><div class="score">${m.s}</div><div>${m.t2}</div></div>`);
        upDiv.innerHTML += h + `</div>`;
    });
</script>
</body>
</html>
