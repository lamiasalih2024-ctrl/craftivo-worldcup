<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #05070f; color: white; font-family: sans-serif; }
    .card { background: #111; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 10px; }
    .group-label { color: #fbbf24; font-size: 1.2rem; font-weight: 900; margin-top: 25px; margin-bottom: 10px; border-bottom: 2px solid #fbbf24; display: block; }
    .section-head { color: #3b82f6; font-size: 1.2rem; font-weight: 800; margin-top: 35px; margin-bottom: 15px; border-right: 4px solid #3b82f6; padding-right: 10px; }
    .footer { text-align: center; margin-top: 50px; padding: 20px; border-top: 1px solid #333; color: #666; font-size: 0.9rem; }
  </style>
</head>
<body class="p-4">
  <div class="max-w-xl mx-auto">
    <div class="text-center py-6">
        <h1 class="text-4xl font-black text-yellow-500">Craftivo</h1>
        <p class="text-gray-400 mt-2 font-bold">تغطية كأس العالم 2026</p>
        <p class="text-blue-400 font-bold text-sm mt-1">بتوقيت مكة المكرمة</p>
    </div>
    
    <div id="manual-results">
        <h2 class="text-yellow-500 font-bold border-b border-yellow-500 mb-4">سجل النتائج (A - L)</h2>
    </div>

    <div id="dynamic-matches">
        <div id="live-section"></div>
        <div id="upcoming-section"></div>
        <div id="finished-section"></div>
    </div>

    <div class="footer">
        <p>© 2026 Craftivo - جميع الحقوق محفوظة</p>
    </div>
  </div>

  <script>
    const groups = ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L"];
    const manualContainer = document.getElementById('manual-results');
    groups.forEach(g => {
        manualContainer.innerHTML += `<span class="group-label">المجموعة ${g}</span>`;
    });

    let lastMatches = [];
    const sentEvents = new Set();
    if ("Notification" in window) Notification.requestPermission();

    async function updateMatches() {
      try {
        const res = await fetch('/api/football');
        const data = await res.json();
        const matches = data.response;
        
        if (!Array.isArray(matches)) return;
        matches.sort((a, b) => new Date(a.fixture.date) - new Date(b.fixture.date));
        
        let liveHTML = '<div class="section-head">🔴 مباريات مباشرة</div>';
        let upHTML = '<div class="section-head">🕒 مباريات قادمة</div>';
        let finHTML = '<div class="section-head">🏁 مباريات انتهت</div>';

        let liveCount = 0, upCount = 0, finCount = 0;

        matches.forEach(m => {
          const home = m?.teams?.home?.name || "—";
          const away = m?.teams?.away?.name || "—";
          const homeGoals = m?.goals?.home ?? 0;
          const awayGoals = m?.goals?.away ?? 0;
          
          const card = `<div class="card flex justify-between font-bold"><span>${home}</span> <span class="text-yellow-500">${homeGoals} - ${awayGoals}</span> <span>${away}</span></div>`;
          
          if(m?.fixture?.status?.short === "LIVE") {
            liveHTML += card; liveCount++;
            const eventKey = `${m.fixture.id}_${m.fixture.status.elapsed}_${JSON.stringify(m.goals)}`;
            const old = lastMatches.find(x => x.fixture?.id === m.fixture.id);
            if(old && (old.goals?.home !== homeGoals || old.goals?.away !== awayGoals) && !sentEvents.has(eventKey)) {
                new Notification("⚽ هدف!", { body: `${home} ${homeGoals} - ${awayGoals} ${away}` });
                sentEvents.add(eventKey);
            }
          } else if(m?.fixture?.status?.short === "NS") { upHTML += card; upCount++; }
          else if(m?.fixture?.status?.short === "FT") { finHTML += card; finCount++; }
        });
        
        if (liveCount === 0) liveHTML += "<p class='text-gray-500 text-sm'>لا توجد مباريات مباشرة حالياً</p>";
        if (upCount === 0) upHTML += "<p class='text-gray-500 text-sm'>لا توجد مباريات قادمة حالياً</p>";
        if (finCount === 0) finHTML += "<p class='text-gray-500 text-sm'>لا توجد نتائج مسجلة</p>";
        
        document.getElementById('live-section').innerHTML = liveHTML;
        document.getElementById('upcoming-section').innerHTML = upHTML;
        document.getElementById('finished-section').innerHTML = finHTML;
        
        lastMatches = JSON.parse(JSON.stringify(matches));
      } catch (e) { console.log("خطأ في الاتصال"); }
    }

    setInterval(updateMatches, 30000);
    updateMatches();
  </script>
</body>
</html>
