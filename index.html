<style>
    body { background-color: #0b0e14; color: #ffffff; font-family: 'Arial', sans-serif; padding: 20px; direction: rtl; }
    .brand-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #D4AF37; padding-bottom: 20px; }
    .brand-title { color: #D4AF37; font-size: 4em; font-weight: 900; text-transform: uppercase; margin: 0; }
    .event-title { color: #ffffff; font-size: 2.2em; margin: 15px 0; font-weight: bold; }
    .timezone { color: #D4AF37; font-size: 1.6em; font-weight: bold; }
    
    .tabs { display: flex; justify-content: space-around; margin-bottom: 30px; }
    .tab-btn { background: #1a1a1a; color: #D4AF37; border: 2px solid #D4AF37; padding: 18px; flex: 1; margin: 0 5px; border-radius: 12px; cursor: pointer; font-size: 1.4em; font-weight: bold; }
    .tab-btn.active { background: #D4AF37; color: #000; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .group-card { background: #1a1a1a; border: 4px solid #D4AF37; border-radius: 25px; padding: 25px; margin-bottom: 30px; }
    .group-title { color: #D4AF37; font-size: 2.4em; text-align: center; margin-bottom: 20px; font-weight: bold; }
    .match-row { text-align: center; font-size: 1.8em; padding: 15px 0; border-bottom: 1px dashed #444; color: #fff; }
    .points-bar { background: #000; padding: 20px; border-radius: 12px; font-size: 1.4em; color: #D4AF37; font-weight: bold; margin-top: 15px; text-align: center; }
    
    .footer { text-align: center; margin-top: 50px; color: #ffffff; font-size: 1.6em; }
</style>

<div class="brand-header">
    <h1 class="brand-title">CRAFTIVO</h1>
    <h2 class="event-title">تغطية كأس العالم 2026</h2>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="showTab(event, 'live')">مباشر</button>
    <button class="tab-btn" onclick="showTab(event, 'archive')">الأرشيف</button>
    <button class="tab-btn" onclick="showTab(event, 'upcoming')">القادمة</button>
    <button class="tab-btn" onclick="showTab(event, 'knockout')">الإقصائيات</button>
</div>

</div>

<div class="footer"><p>Craftivo - 🤍LMS</p></div>

<script>
function showTab(evt, id) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    evt.currentTarget.classList.add('active');
}
</script>
