<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Craftivo | تغطية كأس العالم 2026</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background:#070b16;
  color:#fff;
  padding:20px;
}

.header{
  text-align:center;
  margin:30px 0;
}

.title{
  font-size:55px;
  font-weight:900;
  background:linear-gradient(to bottom,#ffd700,#b8860b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  font-size:22px;
  color:#00ff88;
  font-weight:600;
}

/* tabs */
.nav-bar{
  display:flex;
  justify-content:center;
  gap:12px;
  margin:30px 0;
  flex-wrap:wrap;
}

.nav-btn{
  padding:15px 25px;
  border-radius:50px;
  border:1px solid #2d3e66;
  background:#1a2238;
  color:#fff;
  cursor:pointer;
}

/* cards */
.match{
  background:linear-gradient(145deg,#111827,#070b16);
  margin:12px auto;
  max-width:520px;
  padding:18px;
  border-radius:16px;
  border:1px solid #1f2a44;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.team{
  width:40%;
  text-align:center;
}

.score{
  color:#00ff88;
  font-size:26px;
  font-weight:900;
}

/* LIVE animation */
.live{
  display:inline-block;
  width:10px;
  height:10px;
  background:red;
  border-radius:50%;
  animation:blink 1s infinite;
  margin-left:6px;
}

@keyframes blink{
  50%{opacity:0.2;}
}

.footer{
  text-align:center;
  margin-top:40px;
  opacity:0.6;
}
</style>
</head>

<body>

<div class="header">
  <div class="title">Craftivo</div>
  <div class="subtitle">تغطية كأس العالم 2026</div>
</div>

<div class="nav-bar">
  <button class="nav-btn" onclick="show('live')">🔴 مباشر</button>
  <button class="nav-btn" onclick="show('past')">📺 السابقة</button>
  <button class="nav-btn" onclick="show('next')">⏳ القادمة</button>
</div>

<div id="live">
  <div class="match">
    <div class="team">السعودية</div>
    <div class="score">2 - 1</div>
    <div class="team">الأرجنتين</div>
  </div>

  <div class="match">
    <div class="team">فرنسا</div>
    <div class="score">1 - 0</div>
    <div class="team">البرازيل</div>
  </div>
</div>

<div id="past" style="display:none;">
  <div class="match">
    <div class="team">ألمانيا</div>
    <div class="score">0 - 2</div>
    <div class="team">إسبانيا</div>
  </div>
</div>

<div id="next" style="display:none;">
  <div class="match">
    <div class="team">إيطاليا</div>
    <div class="score">--</div>
    <div class="team">هولندا</div>
  </div>
</div>

<div class="footer">LMS 🤍</div>

<script>
function show(id){
  document.getElementById('live').style.display='none';
  document.getElementById('past').style.display='none';
  document.getElementById('next').style.display='none';

  document.getElementById(id).style.display='block';
}
</script>

</body>
</html>
