<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Craftivo | تغطية كأس العالم 2026</title>
  <style>
    @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; background: #15803d; } }
    .goal-flash { animation: flash 1s ease-in-out; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6">
  <div class="max-w-2xl mx-auto text-center">
    <h1 class="text-4xl font-black text-yellow-500 mb-2">Craftivo</h1>
    <p class="text-gray-400 mb-8">تغطية كأس العالم 2026</p>
    
    <div id="live-scores" class="space-y-4">
      <div class="p-6 bg-slate-900 rounded-2xl border border-slate-800 animate-pulse">جاري تحديث البيانات...</div>
    </div>

    <footer class="mt-12 text-sm text-gray-500"><p>❤️ Craftivo | LMS</p></footer>
  </div>

  <script>
    let lastScores = {}; // لتخزين النتائج ومقارنتها

    async function fetchScores() {
      try {
        const res = await fetch("/api/football");
        const data = await res.json();
        const liveScoresDiv = document.getElementById('live-scores');
        
        if (data.response && data.response.length > 0) {
          liveScoresDiv.innerHTML = data.response.map(game => {
            const gameId = game.fixture.id;
            const currentScore = `${game.goals.home}-${game.goals.away}`;
            let flashClass = '';

            // كشف هدف جديد
            if (lastScores[gameId] && lastScores[gameId] !== currentScore) {
              flashClass = 'goal-flash';
            }
            lastScores[gameId] = currentScore;

            return `
              <div class="p-6 bg-slate-900 rounded-2xl border border-slate-800 transition-all ${flashClass}">
                <div class="flex justify-between items-center mb-4">
                  <span class="text-red-500 font-bold">🔴 مباشر</span>
                  <span class="text-xs bg-slate-800 px-2 py-1 rounded text-yellow-500">${game.fixture.status.elapsed}'</span>
                </div>
                <div class="flex items-center justify-between text-2xl font-bold">
                  <div class="flex flex-col items-center w-1/3">
                    <img src="${game.teams.home.logo}" class="w-12 h-12 mb-2">
                    <span>${game.goals.home}</span>
                  </div>
                  <div class="text-gray-500 text-sm">VS</div>
                  <div class="flex flex-col items-center w-1/3">
                    <img src="${game.teams.away.logo}" class="w-12 h-12 mb-2">
                    <span>${game.goals.away}</span>
                  </div>
                </div>
                <div class="text-sm mt-2 text-gray-300">${game.teams.home.name} ضد ${game.teams.away.name}</div>
              </div>
            `;
          }).join('');
        } else {
          liveScoresDiv.innerHTML = '<div class="p-6 text-gray-500">لا توجد مباريات حالياً.</div>';
        }
      } catch (err) { console.error(err); }
    }

    fetchScores();
    setInterval(fetchScores, 15000); // تحديث كل 15 ثانية
  </script>
</body>
</html>
