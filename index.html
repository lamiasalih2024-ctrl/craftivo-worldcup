<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
    body { background: #05070f; color: #fff; font-family: 'Cairo', sans-serif; }
    
    /* هوية احترافية */
    .brand-title { font-size: 4rem; font-weight: 900; background: linear-gradient(to bottom, #fbbf24, #b45309); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-top: 20px; }
    
    /* بطاقات واضحة وكبيرة */
    .section-title { font-size: 1.8rem; font-weight: 900; color: #fbbf24; margin: 30px 0 15px; border-bottom: 2px solid #fbbf24; padding-bottom: 10px; }
    .card { background: #0f172a; border-radius: 20px; padding: 25px; margin-bottom: 20px; border: 1px solid #334155; }
    .live-card { border: 3px solid #ef4444; box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }
    
    .score-text { font-size: 2.5rem; font-weight: 900; margin: 10px 0; color: #fff; }
    .teams-text { font-size: 1.5rem; font-weight: bold; }
    .live-badge { background: #ef4444; color: white; padding: 5px 15px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; animation: pulse 1.5s infinite; }
    
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body class="p-6">

<div class="max-w-3xl mx-auto">
  <!-- العنوان الرئيسي -->
  <div class="brand-title">Craftivo</div>
  <p class="text-center text-gray-400 font-bold text-xl mb-10">التغطية الرسمية لكأس العالم 2026</p>

  <!-- 1. قسم المباشر (يظهر في الأعلى) -->
  <div id="live-container">
    <h2 class="section-title">مباراة مباشرة الآن 🔴</h2>
    <div class="card live-card">
      <div class="live-badge inline-block mb-3">شغال الآن</div>
      <div class="teams-text">🇨🇬 الكونغو 🆚 🇵🇹 البرتغال</div>
      <div class="score-text">0 - 1</div>
    </div>
  </div>

  <!-- 2. قسم الأرشيف (النتائج السابقة) -->
  <div id="archive-container">
    <h2 class="section-title">نتائج المباريات السابقة</h2>
    <div id="matches-list"></div>
  </div>
</div>

<script>
// إذن الإشعارات تلقائياً
if (Notification.permission !== "granted") Notification.requestPermission();

// محاكاة تنبيه الأهداف (لو تغيرت النتيجة، سيأتي إشعار)
function triggerGoalAlert(oldScore, newScore) {
    if (oldScore !== newScore && Notification.permission === "granted") {
        new Notification("⚽ هدف جديد في Craftivo!", { body: `النتيجة أصبحت ${newScore}` });
    }
}

// قائمة المباريات الثابتة (لن تختفي أبداً)
const archiveData = [
  { group: "A", match: "المكسيك 🇲🇽 - جنوب أفريقيا 🇿🇦", score: "2 - 0" },
  { group: "B", match: "كندا 🇨🇦 - البوسنة 🇧🇦", score: "1 - 1" },
  { group: "C", match: "ألمانيا 🇩🇪 - كوراساو 🇨🇼", score: "7 - 1" },
  { group: "D", match: "فرنسا 🇫🇷 - السنغال 🇸🇳", score: "3 - 1" },
  { group: "E", match: "السويد 🇸🇪 - تونس 🇹🇳", score: "5 - 1" },
  { group: "F", match: "السعودية 🇸🇦 - الأوروغواي 🇺🇾", score: "1 - 1" },
  { group: "G", match: "إيران 🇮🇷 - نيوزيلندا 🇳🇿", score: "2 - 2" },
  { group: "H", match: "قطر 🇶🇦 - سويسرا 🇨🇭", score: "1 - 1" },
  { group: "I", match: "اليابان 🇯🇵 - النرويج 🇳🇴", score: "0 - 0" },
  { group: "J", match: "البرازيل 🇧🇷 - المغرب 🇲🇦", score: "3 - 0" },
  { group: "K", match: "إيطاليا 🇮🇹 - نيجيريا 🇳🇬", score: "2 - 1" },
  { group: "L", match: "إسبانيا 🇪🇸 - مصر 🇪🇬", score: "0 - 0" }
];

const list = document.getElementById("matches-list");
archiveData.forEach(m => {
  list.innerHTML += `
    <div class="card">
      <div class="text-yellow-500 font-bold text-lg mb-2">المجموعة ${m.group}</div>
      <div class="text-xl font-bold">${m.match}</div>
      <div class="text-3xl text-yellow-400 font-black mt-2">${m.score}</div>
    </div>
  `;
});
</script>
</body>
</html>
