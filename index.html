<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #05070f; color: white; font-family: sans-serif; }
    .card { background: #111; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 10px; }
    .group-label { color: #fbbf24; font-size: 1.2rem; font-weight: 900; margin-top: 20px; margin-bottom: 10px; border-bottom: 2px solid #fbbf24; display: block; }
    .section-head { color: #3b82f6; font-size: 1.1rem; font-weight: 800; margin-top: 25px; margin-bottom: 10px; border-right: 4px solid #3b82f6; padding-right: 10px; }
    .footer { text-align: center; margin-top: 50px; padding: 20px; border-top: 1px solid #333; color: #666; }
  </style>
</head>
<body class="p-4">
  <div class="max-w-xl mx-auto">
    <div class="text-center py-6">
        <h1 class="text-4xl font-black text-yellow-500">Craftivo</h1>
        <p class="text-gray-400 mt-2">تغطية كأس العالم 2026</p>
        <p class="text-blue-400 font-bold text-sm mt-1">بتوقيت مكة المكرمة</p>
    </div>
    
    <div id="manual-results">
        <h2 class="text-yellow-500 font-bold border-b border-yellow-500 mb-4">سجل النتائج (A - L)</h2>
    </div>

    <div id="dynamic-matches">
        <div id="live-section"></div>
        <div id="upcoming-section"></div>
        <div id="finished-section"></div>
    </div>

    <div class="footer">
        <p>© 2026 Craftivo - جميع الحقوق محفوظة</p>
    </div>
  </div>

  <script>
    // جميع المجموعات موجودة دائماً
    const groups = ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L"];
    const container = document.getElementById('manual-results');
    
    groups.forEach(g => {
        container.innerHTML += `<span class="group-label">المجموعة ${g}</span>`;
        // هنا يمكنك إضافة منطق لجلب مباريات كل مجموعة إذا توفرت
    });

    async function updateMatches() {
        // منطق التحديث مع الحماية
        const liveS = document.getElementById('live-section');
        const upS = document.getElementById('upcoming-section');
        const finS = document.getElementById('finished-section');

        liveS.innerHTML = '<div class="section-head">🔴 مباريات مباشرة</div><p class="text-gray-500 text-sm">لا توجد مباريات مباشرة حالياً</p>';
        upS.innerHTML = '<div class="section-head">🕒 مباريات قادمة</div><p class="text-gray-500 text-sm">لا توجد مباريات قادمة حالياً</p>';
        finS.innerHTML = '<div class="section-head">🏁 مباريات انتهت</div><p class="text-gray-500 text-sm">لا توجد نتائج مسجلة</p>';
        
        // جلب البيانات من الـ API وتعبئة الأقسام...
    }
    updateMatches();
  </script>
</body>
</html>
