<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Craftivo | تغطية كأس العالم 2026</title>
  <style>
    body { background: #05070f; color: white; font-family: sans-serif; }
    .league-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
  </style>
</head>
<body>

<section class="text-center py-10 px-4">
  <h1 class="text-5xl font-black text-yellow-500">Craftivo</h1>
  <p class="text-gray-300 mt-2 font-bold text-lg">تغطية كأس العالم 2026</p>
</section>

<div id="content" class="max-w-2xl mx-auto px-4 pb-20">
    <div class="text-center text-gray-500">جاري الاتصال بقاعدة البيانات...</div>
</div>

<script>
  fetch('/api/football')
    .then(response => response.json())
    .then(data => {
      const content = document.getElementById('content');
      content.innerHTML = '<h2 class="text-xl font-bold mb-4 text-center">الدوريات المتاحة</h2>';
      
      data.response.forEach(item => {
        const div = document.createElement('div');
        div.className = 'league-card flex items-center justify-between';
        div.innerHTML = `
          <span class="font-bold text-yellow-500">${item.league.name}</span>
          <img src="${item.league.logo}" class="w-8 h-8 object-contain">
        `;
        content.appendChild(div);
      });
    })
    .catch(err => {
      document.getElementById('content').innerHTML = '<p class="text-red-500 text-center">خطأ في جلب البيانات.</p>';
    });
</script>

</body>
</html>
