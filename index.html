<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Craftivo | كأس العالم 2026</title>
  <style>
    body { background: #05070f; color: white; font-family: sans-serif; }
    .card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .gold-text { color: #fbbf24; }
  </style>
</head>
<body>

<section class="text-center py-10 px-4">
  <h1 class="text-5xl font-black gold-text">Craftivo</h1>
  <p class="text-gray-300 mt-2 font-bold text-lg">تغطية كأس العالم 2026</p>
  <p class="text-yellow-600 text-sm mt-1">جميع المباريات بتوقيت مكة المكرمة</p>
</section>

<div id="app" class="max-w-4xl mx-auto px-4 pb-20">
    <div class="card text-center">
        <h2 class="text-xl font-bold mb-2">جاري تحميل البيانات...</h2>
        <p class="text-gray-500">يرجى الانتظار ثوانٍ قليلة.</p>
    </div>
</div>

<script>
  async function loadData() {
    try {
      const response = await fetch('/api/football');
      const data = await response.json();
      const app = document.getElementById('app');
      
      // إذا كانت البيانات موجودة، سنقوم بعرضها
      if (data && data.response) {
        app.innerHTML = ''; // مسح رسالة التحميل
        data.response.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h2 class="text-2xl font-bold gold-text mb-4">${item.league.name}</h2>
            <p class="text-gray-300">نتابع معكم النتائج المحدثة أولاً بأول.</p>
          `;
          app.appendChild(card);
        });
      }
    } catch (e) {
      document.getElementById('app').innerHTML = '<div class="card text-center text-red-500">حدث خطأ في عرض البيانات.</div>';
    }
  }
  loadData();
</script>

</body>
</html>
