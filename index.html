<style>
    body { background-color: #0b0e14; color: #ffffff; font-family: 'Arial', sans-serif; padding: 15px; }
    
    /* الهيدر الذهبي */
    .brand-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #D4AF37; padding-bottom: 20px; }
    .brand-title { color: #D4AF37; font-size: 3.5em; font-weight: 900; text-shadow: 2px 2px 5px #000; text-transform: uppercase; }
    .event-title { color: #ffffff; font-size: 1.8em; margin: 10px 0; font-weight: bold; }
    .timezone { color: #D4AF37; font-size: 1.3em; font-weight: bold; }

    /* التبويبات */
    .tabs { display: flex; justify-content: space-around; margin-bottom: 25px; }
    .tab-btn { background: #1a1a1a; color: #D4AF37; border: 2px solid #D4AF37; padding: 15px; flex: 1; margin: 0 5px; border-radius: 10px; cursor: pointer; font-size: 1.2em; font-weight: bold; }
    .tab-btn.active { background: #D4AF37; color: #000; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* كروت الأرشيف */
    .group-card { background: #1a1a1a; border: 2px solid #D4AF37; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
    .group-title { color: #D4AF37; font-size: 1.8em; text-align: center; margin-bottom: 15px; font-weight: bold; }
    .match-row { text-align: center; font-size: 1.3em; padding: 10px 0; border-bottom: 1px dashed #444; }
    .points-bar { background: #000; padding: 10px; border-radius: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 1em; color: #D4AF37; font-weight: bold; margin-top: 10px; }

    /* المباشر */
    .live-indicator { color: #FF0000; font-size: 1.5em; font-weight: bold; text-align: center; margin-top: 20px; }
    .pulse { width: 15px; height: 15px; background: red; border-radius: 50%; display: inline-block; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { opacity: 0.3; } 100% { transform: scale(1); } }
</style>

<div class="brand-header">
    <h1 class="brand-title">Craftivo</h1>
    <h2 class="event-title">تغطية كأس العالم 2026</h2>
    <p class="timezone">بتوقيت مكة المكرمة</p>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="showTab(event, 'live')">مباشر</button>
    <button class="tab-btn" onclick="showTab(event, 'archive')">الأرشيف</button>
    <button class="tab-btn" onclick="showTab(event, 'upcoming')">القادمة</button>
    <button class="tab-btn" onclick="showTab(event, 'knockout')">الإقصائيات</button>
</div>

<div id="live" class="tab-content active">
    <div class="live-indicator"><span class="pulse"></span> مباشر</div>
    <h3 style="text-align:center;">جاري التحديث...</h3>
</div>

<div id="archive" class="tab-content">
    <div class="group-card">
        <div class="group-title">المجموعة A</div>
        <div class="match-row">🇲🇽 المكسيك (2) - (0) جنوب أفريقيا 🇿🇦</div>
        <div class="match-row">🇰🇷 كوريا الجنوبية (2) - (1) التشيك 🇨🇿</div>
        <div class="points-bar"><span>المكسيك: 3</span><span>كوريا: 3</span><span>ج.أفريقيا: 0</span><span>التشيك: 0</span></div>
    </div>
    </div>

<script>
function showTab(evt, id) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    evt.currentTarget.classList.add('active');
}
</script>
