<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تغطية كأس العالم 2026</title>
    <style>
        body { background-color: #0b0e14; color: #fff; font-family: sans-serif; margin: 0; }
        .header { text-align: center; padding: 20px; border-bottom: 2px solid #D4AF37; }
        .main-title { font-size: 1.8em; color: #D4AF37; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .logo-ball { width: 40px; animation: rotate 3s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .tabs { display: flex; justify-content: center; gap: 5px; margin: 15px 0; }
        .tab { padding: 10px; background: #222; color: #D4AF37; cursor: pointer; border-radius: 5px; border: 1px solid #444; }
        .tab.active { background: #D4AF37; color: #000; }
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .group-card { background: #1a1a1a; border-radius: 10px; padding: 15px; margin-bottom: 20px; text-align: center; }
        .group-title { color: #D4AF37; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .match-row { display: flex; align-items: center; justify-content: space-around; padding: 10px 0; border-bottom: 1px dashed #333; }
        .score-col { display: flex; flex-direction: column; font-weight: bold; color: #D4AF37; }
        .points-footer { margin-top: 10px; color: #D4AF37; font-size: 0.9em; border-top: 1px solid #444; padding-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="main-title">
        <img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccerball.svg" class="logo-ball">
        CRAFTIVO
    </h1>
</div>

<div class="tabs">
    <div class="tab" onclick="showPage('live', this)">المباشر</div>
    <div class="tab" onclick="showPage('upcoming', this)">المباريات القادمة</div>
    <div class="tab active" onclick="showPage('archive', this)">الأرشيف</div>
    <div class="tab" onclick="showPage('knockout', this)">الإقصائيات</div>
</div>

<div id="live" class="page">...</div>
<div id="upcoming" class="page">...</div>
<div id="archive" class="page active"></div>
<div id="knockout" class="page">...</div>

<script>
    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    const data = [
        {name: "أ", matches: [
            {t1: "المكسيك 🇲🇽", s1: "2", s2: "0", t2: "جنوب أفريقيا 🇿🇦"},
            {t1: "كوريا الجنوبية 🇰🇷", s1: "2", s2: "1", t2: "التشيك 🇨🇿"}
        ], pts: "عدد النقاط: المكسيك(6)، كوريا الجنوبية(3)، التشيك(1)، جنوب أفريقيا(1)"}
    ];

    const container = document.getElementById('archive');
    data.forEach(group => {
        let html = `<div class="group-card"><div class="group-title">المجموعة ${group.name}</div>`;
        group.matches.forEach(m => {
            html += `<div class="match-row">
                <div>${m.t1}</div>
                <div class="score-col"><span>${m.s1}</span><span>-</span><span>${m.s2}</span></div>
                <div>${m.t2}</div>
            </div>`;
        });
        html += `<div class="points-footer">${group.pts}</div></div>`;
        container.innerHTML += html;
    });
</script>
</body>
</html>
