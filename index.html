<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Craftivo - تغطية كأس العالم 2026</title>
</head>
<body class="bg-slate-950 text-white p-4">
    <div class="max-w-md mx-auto">
        <!-- إضافة اسم الاستوديو في الأعلى -->
        <div class="text-center mb-6">
            <h1 class="text-4xl font-black text-yellow-500">Craftivo</h1>
            <p class="text-slate-400 text-sm mt-1">تغطية حصرية ومباشرة لكأس العالم 2026</p>
        </div>

        <!-- قسم المباريات المكتملة -->
        <h2 class="text-xl font-bold text-green-500 mb-4 border-b border-green-800 pb-2">المباريات المكتملة</h2>
        <div class="space-y-3 mb-10">
            <div class="bg-slate-900 p-4 rounded-xl flex justify-between items-center border border-slate-700">
                <span class="font-bold w-1/3">الأرجنتين</span>
                <span class="bg-green-600 px-3 py-1 rounded-lg font-bold">3 - 1</span>
                <span class="font-bold w-1/3 text-left">صربيا</span>
            </div>
            <div class="bg-slate-900 p-4 rounded-xl flex justify-between items-center border border-slate-700">
                <span class="font-bold w-1/3">مصر</span>
                <span class="bg-green-600 px-3 py-1 rounded-lg font-bold">2 - 1</span>
                <span class="font-bold w-1/3 text-left">المغرب</span>
            </div>
        </div>

        <!-- قسم المباريات المرتقبة -->
        <h2 class="text-xl font-bold text-blue-400 mb-4 border-b border-blue-800 pb-2">مباريات مرتقبة</h2>
        <div class="space-y-3">
            <div class="bg-slate-900 p-4 rounded-xl flex justify-between items-center border border-slate-700 opacity-60">
                <span class="font-bold w-1/3">إسبانيا</span>
                <span class="bg-slate-700 px-2 py-1 rounded-lg text-sm">0 - 0</span>
                <span class="font-bold w-1/3 text-left">فرنسا</span>
            </div>
        </div>
        
        <!-- التذييل مع اسم الاستوديو -->
        <div class="mt-12 text-center border-t border-slate-800 pt-6">
            <p class="text-yellow-500 font-bold">© 2026 Craftivo Studio</p>
            <p class="text-slate-500 text-xs mt-2">جميع حقوق التغطية محفوظة لاستوديو كراتيفيو</p>
        </div>
    </div>
</body>
</html>
