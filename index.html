<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Craftivo | كأس العالم 2026</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0b0f1a;
  color:#fff;
  font-size:20px;
}

/* الهيدر */
.header{
  text-align:center;
  font-size:42px;
  font-weight:bold;
  padding:20px;
}

/* شريط التبويبات */
.nav-bar{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:20px;
}

.nav-btn{
  padding:14px 26px;
  background:#1f2a44;
  border:none;
  color:#fff;
  border-radius:10px;
  cursor:pointer;
  font-size:20px;
}

.nav-btn:hover{
  background:#2b3a5e;
}

/* المباشر */
.live-dot{
  width:12px;
  height:12px;
  background:red;
  border-radius:50%;
  display:inline-block;
  margin-left:8px;
  animation: blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0.3;}
}

.card{
  background:#111a2e;
  margin:15px;
  padding:20px;
  border-radius:15px;
}

/* مباراة */
.match{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #222;
  font-size:22px;
}

.team{
  width:40%;
  display:flex;
  gap:10px;
  align-items:center;
}

.center{
  width:20%;
  text-align:center;
  color:#00ff88;
  font-weight:bold;
}

/* التبويبات */
.page{display:none;}
.active{display:block;}

.loading{
  opacity:0.7;
}
</style>
</head>

<body>

<div class="header">⚽ Craftivo TV - كأس العالم 2026</div>

<div class="nav-bar">
<button class="nav-btn" onclick="show('live')">🔴 مباشر</button>
<button class="nav-btn" onclick="show('archive')">السابقة</button>
<button class="nav-btn" onclick="show('upcoming')">القادمة</button>
</div>

<!-- LIVE -->
<div id="live" class="page active">
  <div class="card">
    <h2>مباشر <span class="live-dot"></span></h2>
    <div id="live-matches" class="loading">جاري التحميل...</div>
  </div>
</div>

<!-- ARCHIVE -->
<div id="archive" class="page">
  <div class="card">
    <h2>المباريات السابقة</h2>
    <div id="past-matches">سيتم إضافة البيانات لاحقاً</div>
  </div>
</div>

<!-- UPCOMING -->
<div id="upcoming" class="page">
  <div class="card">
    <h2>المباريات القادمة</h2>
    <div id="upcoming-matches">سيتم إضافة البيانات لاحقاً</div>
  </div>
</div>

<script>

/* تبديل التبويبات */
function show(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* 🔴 جلب المباريات المباشرة */
async function loadLive(){

  const container = document.getElementById("live-matches");
  container.innerHTML = "جاري التحميل...";

  try{

    const url = "https://v3.football.api-sports.io/fixtures?live=all";

    const res = await fetch(url,{
      headers:{
        "x-apisports-key":"PUT_YOUR_KEY_HERE"
      }
    });

    const data = await res.json();

    if(!data.response || data.response.length === 0){
      container.innerHTML = "لا توجد مباريات مباشرة حالياً";
      return;
    }

    container.innerHTML = "";

    data.response.forEach(m => {

      const home = m.teams.home.name;
      const away = m.teams.away.name;

      const homeGoals = m.goals.home ?? 0;
      const awayGoals = m.goals.away ?? 0;

      container.innerHTML += `
        <div class="match">
          <div class="team">🏠 ${home}</div>
          <div class="center">${homeGoals} - ${awayGoals}</div>
          <div class="team" style="justify-content:flex-end;">
            ${away} 🌍
          </div>
        </div>
      `;
    });

  }catch(error){
    console.error(error);
    container.innerHTML = "حدث خطأ في جلب البيانات ⚠️";
  }
}

/* تشغيل التحديث */
loadLive();
setInterval(loadLive, 30000);

</script>

</body>
</html>
