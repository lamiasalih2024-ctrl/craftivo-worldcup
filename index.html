<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Craftivo | Debug</title>
</head>
<body class="bg-slate-950 text-white p-6 text-center">
  <h1 class="text-2xl text-yellow-500 font-bold">Craftivo Status</h1>
  <div id="status-box" class="mt-4 p-4 bg-slate-900 border border-slate-800 rounded">
    جاري الفحص...
  </div>

  <script>
    async function checkAPI() {
      const box = document.getElementById('status-box');
      try {
        const res = await fetch("/api/football");
        const data = await res.json();
        
        if (data.response && data.response.length > 0) {
          box.innerHTML = `تم العثور على ${data.response.length} مباريات! <br> الحالة: ${data.response[0].fixture.status.long}`;
        } else {
          box.innerHTML = "السيرفر يعمل، لكن لا توجد مباريات حية حالياً في الـ API.";
        }
      } catch (err) {
        box.innerHTML = "خطأ في الاتصال بالـ API: " + err.message;
      }
    }
    checkAPI();
  </script>
</body>
</html>
