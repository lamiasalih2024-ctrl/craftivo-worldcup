<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
    body { background: #05070f; color: #fff; font-family: 'Cairo', sans-serif; }
    .brand-title { font-size: 3.5rem; font-weight: 900; background: linear-gradient(to bottom, #fbbf24, #b45309); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
    .card { background: #0f172a; border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
    .live-card { border: 2px solid #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); }
    .goal-flash { animation: flash 1s infinite; }
    @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>
</head>
<body class="p-4">

<div class="max-w-2xl mx-auto">
  <div class="brand-title">Craftivo</div>
  <p class="text-center text-yellow-500 font-bold text-lg mb-8">التغطية الرسمية لكأس العالم 2026</p>

  <!-- منطقة المباشر -->
  <div id="live-container"></div>
  
  <!-- الأرشيف والنتائج -->
  <div id="archive-container"></div>
</div>

<script>
// تفعيل إذن الإشعارات فوراً
if (Notification.permission !== "granted") Notification.requestPermission();

let lastScore = ""; // متغير لمراقبة تغير النتيجة

async function fetchMatchData() {
    // ضعي رابط الـ API الخاص بكِ هنا
    // const response = await fetch("YOUR_API_URL");
    // const data = await response.json();
    
    // محاكاة لبيانات هدف تم تسجيله
    const currentScore = "1 - 1"; // مثال لنتيجة تغيرت
    const matchName = "الكونغو ضد البرتغال";
    
    // منطق اكتشاف الهدف وإرسال الإشعار
    if (lastScore !== "" && lastScore !== currentScore) {
        if (Notification.permission === "granted") {
            new Notification("⚽ هدف جديد في Craftivo!", { 
                body: `${matchName} - النتيجة الآن ${currentScore}` 
            });
        }
    }
    lastScore = currentScore;
}

// تحديث البيانات كل 10 ثوانٍ
setInterval(fetchMatchData, 10000);
</script>
</body>
</html>
