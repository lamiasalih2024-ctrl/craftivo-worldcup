<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Craftivo | تغطية كأس العالم 2026</title>
  <style>
    body { background: radial-gradient(circle at top, #0b1020, #05070f); color: white; font-family: sans-serif; }
    .group-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 20px; }
    .gold-text { color: #eab308; }
    .match-line { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 12px 0; }
    .time-slot { font-size: 0.75rem; color: #fbbf24; background: rgba(251, 191, 36, 0.1); padding: 4px 8px; border-radius: 6px; }
  </style>
</head>
<body>

<section class="text-center py-10">
  <h1 class="text-5xl font-black gold-text">Craftivo</h1>
  <p class="text-gray-300 mt-2 font-bold italic">تغطية كأس العالم 2026</p>
  <p class="text-yellow-500 text-sm mt-1">جميع المباريات بتوقيت مكة المكرمة</p>
</section>

<section class="px-4 pb-16">
  <h2 class="text-3xl font-bold mb-8 text-center">🏆 جدول المجموعات والنتائج</h2>
  <div id="matches-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
    <!-- سيتم ملء البيانات هنا تلقائياً بواسطة JavaScript -->
    <p class="text-center text-gray-400">جاري تحميل البيانات الحية...</p>
  </div>
</section>

<footer class="text-center py-10 text-gray-500 border-t border-white/10">
  <p>© 2026 Craftivo Creative Studio</p>
</footer>

<script>
  async function loadMatches() {
    try {
      const response = await fetch('/api/football');
      const data = await response.json();
      
      const container = document.getElementById('matches-container');
      container.innerHTML = ''; // مسح رسالة التحميل

      // هنا سنقوم بعرض البيانات المستلمة
      // بناءً على هيكل الـ JSON الذي ظهر في 1000891340.jpg
      if (data.response && data.response.length > 0) {
        data.response.forEach(item => {
          const league = item.league.name;
          const card = document.createElement('div');
          card.className = 'group-card';
          card.innerHTML = `<h3 class="font-bold text-yellow-500 mb-2">${league}</h3>
                            <div class="match-line"><span>يتم تحديث البيانات...</span></div>`;
          container.appendChild(card);
        });
      }
    } catch (error) {
      document.getElementById('matches-container').innerHTML = '<p class="text-red-400">خطأ في تحميل البيانات المباشرة.</p>';
    }
  }
  
  loadMatches();
</script>
</body>
</html>
