<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Craftivo | تغطية كأس العالم 2026</title>
  <style>
    body { background: #05070f; color: white; font-family: sans-serif; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  </style>
</head>
<body>

<section class="text-center py-10">
  <h1 class="text-5xl font-black text-yellow-500">Craftivo</h1>
  <p class="text-gray-300 mt-2 italic">تغطية كأس العالم 2026</p>
</section>

<div id="app" class="max-w-4xl mx-auto px-4">
  <p class="text-center">جاري جلب النتائج الحية...</p>
</div>

<script>
  async function fetchMatches() {
    try {
      const response = await fetch('/api/football');
      const data = await response.json();
      const app = document.getElementById('app');
      app.innerHTML = ''; 

      // عرض بيانات الدوريات والمباريات من الـ API
      data.response.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <h2 class="text-xl font-bold text-yellow-500 mb-4">${item.league.name}</h2>
          <p class="text-gray-400">تغطية المباريات والنتائج ستظهر هنا فور تحديثها من المصدر.</p>
        `;
        app.appendChild(div);
      });
    } catch (e) {
      document.getElementById('app').innerHTML = '<p class="text-red-500">حدث خطأ في الاتصال، يرجى المحاولة لاحقاً.</p>';
    }
  }
  fetchMatches();
</script>

</body>
</html>
