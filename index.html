<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تغطية كأس العالم 2026 | Craftivo</title>
    <style>
        body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; font-size: 20px; }
        .header { text-align: center; padding: 25px; border-bottom: 2px solid #D4AF37; }
        .main-title { font-size: 3em; color: #D4AF37; margin: 0; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .logo-ball { width: 50px; animation: rotate 3s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .tabs { display: flex; justify-content: space-between; margin: 20px 10px; gap: 5px; }
        .tab { flex: 1; padding: 20px 5px; background: #222; cursor: pointer; color: #D4AF37; border-radius: 8px; font-weight: 900; text-align: center; font-size: 22px; border: 2px solid #D4AF37; }
        .tab.active { background: #D4AF37; color: #000; border: 2px solid #D4AF37; }
        
        .page { display: none; padding: 20px; max-width: 800px; margin: auto; }
        .page.active { display: block; }
        
        .group-card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .group-title { color: #D4AF37; font-weight: bold; text-align: center; border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 10px; }
        .match-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; }
        .score { color: #D4AF37; font-weight: bold; direction: ltr; display: inline-block; }
        .standings { margin-top: 10px; color: #aaa; font-weight: bold; text-align: center; font-size: 18px; }
        
        .footer { text-align: center; padding: 20px; color: #D4AF37; font-weight: bold; }
        @keyframes blink { 50% { opacity: 0; } }
        .live-dot { height: 10px; width: 10px; background-color: red; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="main-title"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccerball.svg" class="logo-ball"> CRAFTIVO</h1>
    <p>تغطية كأس العالم 2026 | بتوقيت مكة المكرمة</p>
</div>

<div class="tabs">
    <div class="tab active" onclick="showPage('live', this)">المباشر</div>
    <div class="tab" onclick="showPage('archive', this)">الأرشيف</div>
    <div class="tab" onclick="showPage('upcoming', this)">المباريات القادمة</div>
    <div class="tab" onclick="showPage('knockout', this)">الإقصائيات</div>
</div>

<div id="live" class="page active">
    <div class="group-card" style="text-align: center;">
        <h3 style="color: red;">مباشر <span class="live-dot"></span></h3>
        <p style="animation: blink 2s infinite;">جاري التحديث...</p>
    </div>
</div>

<div id="archive" class="page"></div>
<div id="upcoming" class="page"></div>
<div id="knockout" class="page"></div>

<div class="footer">Craft TV ♡ LMS</div>

<script>
    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    const data = [
        {n: "أ", m: [{t1: "🇲🇽 المكسيك", s: "2-0", t2: "🇿🇦 جنوب أفريقيا"}, {t1: "🇰🇷 كوريا الجنوبية", s: "2-1", t2: "🇨🇿 التشيك"}, {t1: "🇨🇿 التشيك", s: "1-1", t2: "🇿🇦 جنوب أفريقيا"}, {t1: "🇲🇽 المكسيك", s: "1-0", t2: "🇰🇷 كوريا الجنوبية"}]},
        {n: "ب", m: [{t1: "🇨🇦 كندا", s: "1-1", t2: "🇧🇦 البوسنة والهرسك"}, {t1: "🇶🇦 قطر", s: "1-1", t2: "🇨🇭 سويسرا"}, {t1: "🇨🇭 سويسرا", s: "4-1", t2: "🇧🇦 البوسنة والهرسك"}, {t1: "🇨🇦 كندا", s: "6-0", t2: "🇶🇦 قطر"}]},
        {n: "ج", m: [{t1: "🇧🇷 البرازيل", s: "1-1", t2: "🇲🇦 المغرب"}, {t1: "🇭🇹 هايتي", s: "0-1", t2: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا"}, {t1: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا", s: "0-1", t2: "🇲🇦 المغرب"}, {t1: "🇧🇷 البرازيل", s: "3-0", t2: "🇭🇹 هايتي"}]},
        {n: "د", m: [{t1: "🇺🇸 الولايات المتحدة", s: "4-1", t2: "🇵🇾 باراغواي"}, {t1: "🇦🇺 أستراليا", s: "2-0", t2: "🇹🇷 تركيا"}, {t1: "🇺🇸 الولايات المتحدة", s: "2-0", t2: "🇦🇺 أستراليا"}, {t1: "🇹🇷 تركيا", s: "0-1", t2: "🇵🇾 باراغواي"}]},
        {n: "هـ", m: [{t1: "🇩🇪 ألمانيا", s: "7-1", t2: "🇨🇼 كوراساو"}, {t1: "🇨🇮 ساحل العاج", s: "1-0", t2: "🇪🇨 الإكوادور"}]},
        {n: "و", m: [{t1: "🇳🇱 هولندا", s: "2-2", t2: "🇯🇵 اليابان"}, {t1: "🇸🇪 السويد", s: "5-1", t2: "🇹🇳 تونس"}, {t1: "🇳🇱 هولندا", s: "5-1", t2: "🇸🇪 السويد"}]},
        {n: "ز", m: [{t1: "🇧🇪 بلجيكا", s: "1-1", t2: "🇪🇬 مصر"}, {t1: "🇮🇷 إيران", s: "2-2", t2: "🇳🇿 نيوزيلندا"}]},
        {n: "ح", m: [{t1: "🇪🇸 إسبانيا", s: "0-0", t2: "🇨🇻 الرأس الأخضر"}, {t1: "🇸🇦 السعودية", s: "1-1", t2: "🇺🇾 أورجواي"}]},
        {n: "ط", m: [{t1: "🇫🇷 فرنسا", s: "3-1", t2: "🇸🇳 السنغال"}, {t1: "🇮🇶 العراق", s: "1-4", t2: "🇳🇴 النرويج"}]},
        {n: "ي", m: [{t1: "🇦🇹 النمسا", s: "3-1", t2: "🇯🇴 الأردن"}, {t1: "🇦🇷 الأرجنتين", s: "3-0", t2: "🇩🇿 الجزائر"}]},
        {n: "ك", m: [{t1: "🇵🇹 البرتغال", s: "1-1", t2: "🇨🇩 الكونغو"}, {t1: "🇺🇿 أوزبكستان", s: "1-3", t2: "🇨🇴 كولومبيا"}]},
        {n: "ل", m: [{t1: "🏴󠁧󠁢󠁥󠁮󠁧󠁿 إنجلترا", s: "4-2", t2: "🇭🇷 كرواتيا"}, {t1: "🇬🇭 غانا", s: "1-0", t2: "🇵🇦 بنما"}]}
    ];

    function toAr(n) { return n.toString().replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]); }

    const arcCont = document.getElementById('archive');
    data.forEach(g => {
        let h = `<div class="group-card"><div class="group-title">المجموعة ${g.n}</div>`;
        let t = {};
        g.m.forEach(m => {
            let [g1, g2] = m.s.split('-').map(Number);
            h += `<div class="match-row"><span>${m.t1}</span><span class="score">${toAr(g1)}-${toAr(g2)}</span><span>${m.t2}</span></div>`;
            [m.t1, m.t2].forEach(n => { if(!t[n]) t[n] = 0; });
            if(g1 > g2) t[m.t1] += 3; else if(g2 > g1) t[m.t2] += 3; else { t[m.t1] += 1; t[m.t2] += 1; }
        });
        let res = Object.entries(t).sort((a,b) => b[1] - a[1]).map(i => `${i[0]}(${toAr(i[1])})`).join('، ');
        arcCont.innerHTML += h + `<div class="standings">النقاط: ${res}</div></div>`;
    });
</script>
</body>
</html>
