<style>
    body { background-color: #0b0e14; color: #ffffff; font-family: sans-serif; padding: 15px; }
    
    /* تنسيق التبويبات */
    .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; }
    .tab-btn { background: #262d3a; color: #fff; border: none; padding: 15px; flex: 1; margin: 0 5px; border-radius: 10px; cursor: pointer; font-size: 1.2em; font-weight: bold; }
    .tab-btn.active { background: #f1c40f; color: #0b0e14; }

    /* إخفاء المحتوى غير النشط */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* تنسيق المحتوى */
    .match-container { padding: 25px; background-color: #1c222d; border-radius: 15px; }
    .match-card { background-color: #262d3a; padding: 25px; border-radius: 12px; border-left: 8px solid #f1c40f; margin-top: 15px; }
    
    .match-info { display: flex; justify-content: space-between; font-size: 1.5em; font-weight: bold; margin-bottom: 15px; }
    .match-details { font-size: 1.3em; color: #ecf0f1; }
    
    .footer { text-align: center; margin-top: 50px; color: #7f8c8d; font-size: 1.4em; }
</style>

<!-- التبويبات -->
<div class="tabs">
    <button class="tab-btn active" onclick="showTab('live')">مباشر</button>
    <button class="tab-btn" onclick="showTab('past')">السابقة</button>
    <button class="tab-btn" onclick="showTab('upcoming')">القادمة</button>
</div>

<!-- المحتوى: مباشر -->
<div id="live" class="tab-content active">
    <div class="match-container">
        <div class="match-card">
            <div class="match-info">
                <span style="color:#e74c3c">● مباشر</span>
                <span>الفريق ب vs الفريق أ</span>
            </div>
            <div class="match-details">النتيجة: 1 - 0 | الدقيقة: 45'</div>
        </div>
    </div>
</div>

<!-- المحتوى: السابقة -->
<div id="past" class="tab-content">
    <div class="match-container">
        <div class="match-card">
            <div class="match-info">
                <span style="color:#95a5a6">انتهت</span>
                <span>الفريق د vs الفريق ج</span>
            </div>
            <div class="match-details">النتيجة: 2 - 1 | التاريخ: 18 يونيو 2026</div>
        </div>
    </div>
</div>

<!-- المحتوى: القادمة -->
<div id="upcoming" class="tab-content">
    <div class="match-container">
        <div class="match-card">
            <div class="match-info">
                <span style="color:#2ecc71">قريباً</span>
                <span>الفريق و vs الفريق هـ</span>
            </div>
            <div class="match-details">التاريخ: 20 يونيو 2026 | 09:00 مساءً</div>
        </div>
    </div>
</div>

<div class="footer"><p>❤ LMS</p></div>

<script>
    function showTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }
</script>
