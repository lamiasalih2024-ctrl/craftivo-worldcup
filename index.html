<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
    body { background: #05070f; color: #fff; font-family: 'Cairo', sans-serif; }
    
    .brand-title { font-size: 3.5rem; font-weight: 900; background: linear-gradient(to bottom, #fbbf24, #b45309); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-top: 20px; }
    .section-title { font-size: 1.6rem; font-weight: 900; color: #fbbf24; margin: 30px 0 15px; border-bottom: 2px solid #fbbf24; padding-bottom: 5px; }
    .card { background: #0f172a; border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid #334155; }
    .live-card { border: 3px solid #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }
    
    .bracket-box { background: #1e293b; border: 2px solid #fbbf24; padding: 20px; border-radius: 15px; text-align: center; margin: 30px 0; font-weight: bold; }
  </style>
</head>
<body class="p-4">

<div class="max-w-2xl mx-auto">
  <div class="brand-title">Craftivo</div>
  <p class="text-center text-gray-400 font-bold text-xl mb-8">تغطية كأس العالم 2026</p>

  <!-- المباشر -->
  <div id="live-container">
    <h2 class="section-title">مباراة مباشرة الآن 🔴</h2>
    <div class="card live-card text-center">
      <div class="text-xl font-bold">🇨🇬 الكونغو 🆚 🇵🇹 البرتغال</div>
      <div class="text-4xl font-black text-red-500 mt-2">0 - 1</div>
    </div>
  </div>

  <!-- النتائج السابقة -->
  <h2 class="section-title">نتائج المباريات السابقة</h2>
  <div id="matches-list"></div>

  <!-- الخارطة -->
  <div class="bracket-box">
    <div class="text-yellow-500 mb-2 underline">خارطة الأدوار الإقصائية 🏆</div>
    دور الـ 32 ⟵ دور الـ 16 ⟵ ربع النهائي ⟵ نصف النهائي ⟵ النهائي
  </div>

  <!-- التوقيع -->
  <div class="text-center mt-12 mb-6 border-t border-gray-800 pt-8">
    <div style="font-size: 2.5rem;">🤍</div>
    <p class="font-bold text-gray-400 text-lg">Craftivo | LMS</p>
  </div>
</div>

<script>
const archiveData = [
  { group: "A", match: "المكسيك 🇲🇽 - جنوب أفريقيا 🇿🇦", score: "2 - 0" },
  { group: "B", match: "كندا 🇨🇦 - البوسنة 🇧🇦", score: "1 - 1" },
  { group: "C", match: "ألمانيا 🇩🇪 - كوراساو 🇨🇼", score: "7 - 1" },
  { group: "D", match: "فرنسا 🇫🇷 - السنغال 🇸🇳", score: "3 - 1" },
  { group: "E", match: "السويد 🇸🇪 - تونس 🇹🇳", score: "5 - 1" },
  { group: "F", match: "السعودية 🇸🇦 - الأوروغواي 🇺🇾", score: "1 - 1" },
  { group: "G", match: "إيران 🇮🇷 - نيوزيلندا 🇳🇿", score: "2 - 2" },
  { group: "H", match: "قطر 🇶🇦 - سويسرا 🇨🇭", score: "1 - 1" },
  { group: "I", match: "اليابان 🇯🇵 - النرويج 🇳🇴", score: "0 - 0" },
  { group: "J", match: "البرازيل 🇧🇷 - المغرب 🇲🇦", score: "3 - 0" },
  { group: "K", match: "إيطاليا 🇮🇹 - نيجيريا 🇳🇬", score: "2 - 1" },
  { group: "L", match: "إسبانيا 🇪🇸 - مصر 🇪🇬", score: "0 - 0" }
];

const list = document.getElementById("matches-list");
archiveData.forEach(m => {
  list.innerHTML += `
    <div class="card">
      <div class="text-yellow-500 font-bold">المجموعة ${m.group}</div>
      <div class="text-lg font-bold mt-1">${m.match}</div>
      <div class="text-2xl font-black text-yellow-400 mt-2">${m.score}</div>
    </div>
  `;
});
</script>
</body>
</html>
