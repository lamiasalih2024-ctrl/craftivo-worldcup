<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Craftivo | تغطية كأس العالم 2026</title>
  <style>
    body { background: #05070f; color: white; font-family: sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
    .match-card { background: rgba(255, 255, 255, 0.05); border: 1px solid #333; border-radius: 15px; padding: 20px; margin-bottom: 15px; }
    footer { margin-top: auto; padding: 20px; text-align: center; color: #666; font-size: 0.8rem; border-top: 1px solid #222; }
  </style>
</head>
<body class="p-4">
  <header class="text-center py-6">
    <h1 class="text-5xl font-black text-yellow-500">Craftivo</h1>
    <p class="text-gray-400 mt-2 text-lg font-bold">تغطية كأس العالم 2026</p>
  </header>

  <main id="content" class="max-w-xl mx-auto flex-grow">
    <div class="text-center text-gray-500 animate-pulse">جاري تحميل السجل...</div>
  </main>

  <footer>
    <p>Craftivo &copy; 2026 | تطوير: LMS Systems</p>
    <p class="mt-1">نظام تغطية المباريات الذكي</p>
  </footer>

  <script>
    // سجل المباريات التاريخي المحدث بناءً على 1000891419.jpg والمشاركات السابقة
    const manualMatches = [
      { date: "2026-06-01", home: "المكسيك", away: "جنوب أفريقيا", scoreHome: 2, scoreAway: 0 },
      { date: "2026-06-02", home: "كوريا الجنوبية", away: "التشيك", scoreHome: 2, scoreAway: 1 },
      { date: "2026-06-03", home: "كندا", away: "البوسنة", scoreHome: 1, scoreAway: 1 },
      { date: "2026-06-04", home: "قطر", away: "سويسرا", scoreHome: 1, scoreAway: 1 },
      { date: "2026-06-05", home: "أمريكا", away: "باراغواي", scoreHome: 4, scoreAway: 1 },
      { date: "2026-06-06", home: "أستراليا", away: "تركيا", scoreHome: 2, scoreAway: 0 },
      { date: "2026-06-07", home: "ألمانيا", away: "كوراساو", scoreHome: 7, scoreAway: 1 },
      { date: "2026-06-08", home: "ساحل العاج", away: "الإكوادور", scoreHome: 1, scoreAway: 0 },
      { date: "2026-06-09", home: "هولندا", away: "اليابان", scoreHome: 2, scoreAway: 2 },
      { date: "2026-06-10", home: "السويد", away: "تونس", scoreHome: 5, scoreAway: 1 },
      { date: "2026-06-11", home: "بلجيكا", away: "مصر", scoreHome: 1, scoreAway: 1 },
      { date: "2026-06-12", home: "إيران", away: "نيوزيلندا", scoreHome: 2, scoreAway: 2 },
      { date: "2026-06-13", home: "إسبانيا", away: "الرأس الأخضر", scoreHome: 0, scoreAway: 0 },
      { date: "2026-06-14", home: "السعودية", away: "الأوروغواي", scoreHome: 1, scoreAway: 1 },
      { date: "2026-06-15", home: "فرنسا", away: "السنغال", scoreHome: 3, scoreAway: 1 },
      { date: "2026-06-17", home: "العراق", away: "النرويج", scoreHome: 1, scoreAway: 4 },
      { date: "2026-06-17", home: "الأرجنتين", away: "الجزائر", scoreHome: 3, scoreAway: 0 },
      { date: "2026-06-17", home: "النمسا", away: "الأردن", scoreHome: 3, scoreAway: 1 }
    ];

    fetch('/api/football')
      .then(res => res.json())
      .then(data => {
        const content = document.getElementById('content');
        content.innerHTML = '<h2 class="text-xl font-bold mb-4 text-center text-yellow-500">سجل المباريات</h2>';
        
        manualMatches.forEach(m => {
          content.innerHTML += `
            <div class="match-card text-center border border-yellow-500/30">
              <p class="text-xs text-gray-400 mb-2">${m.date}</p>
              <div class="flex justify-between items-center text-lg font-bold">
                <span>${m.home}</span>
                <span class="text-yellow-500">${m.scoreHome} - ${m.scoreAway}</span>
                <span>${m.away}</span>
              </div>
              <p class="text-xs mt-2 text-green-500">انتهت</p>
            </div>`;
        });
      });
  </script>
</body>
</html>
