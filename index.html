<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تغطية كأس العالم 2026 | Craftivo</title>
    <style>
        body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; font-size: 20px; }
        .header { text-align: center; padding: 30px; border-bottom: 2px solid #D4AF37; }
        .main-title { font-size: 4.5em; font-weight: 900; color: #D4AF37; text-shadow: 0 0 20px #D4AF37; margin: 0; }
        .sub-title { font-size: 1.8em; color: #aaa; margin: 15px 0; }
        .tabs { display: flex; justify-content: center; gap: 15px; margin: 30px 0; flex-wrap: wrap; }
        .tab { padding: 15px 35px; background: #222; border: 2px solid #444; cursor: pointer; color: #D4AF37; border-radius: 10px; transition: 0.3s; font-size: 1.5em; font-weight: bold; }
        .tab.active { background: #D4AF37; color: #000; border-color: #D4AF37; }
        .page { display: none; padding: 25px; max-width: 950px; margin: auto; line-height: 1.8; }
        .page.active { display: block; }
        .group-card { background: #1a1a1a; border: 2px solid #333; border-radius: 15px; padding: 25px; margin-bottom: 25px; }
        .group-title { color: #D4AF37; font-size: 2em; font-weight: bold; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #444; padding-bottom: 15px; }
        .match-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 18px 0; border-bottom: 1px solid #222; font-size: 1.3em; }
        .team-r { text-align: right; }
        .team-l { text-align: left; }
        .score { color: #D4AF37; font-weight: bold; padding: 0 20px; text-align: center; }
        .points-row { margin-top: 20px; padding-top: 15px; border-top: 2px dashed #444; text-align: center; color: #D4AF37; font-weight: bold; font-size: 1.1em; }
        .footer { text-align: center; padding: 50px; border-top: 2px solid #333; margin-top: 60px; color: #D4AF37; font-size: 1.8em; font-weight: bold; }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spinning-ball { display: inline-block; animation: rotate 4s linear infinite; }
        .live-dot { height: 15px; width: 15px; background-color: red; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        .live-title { color: red; font-size: 2.5em; font-weight: bold; }
        .update-text { color: white; animation: blink 1s infinite; font-weight: bold; font-size: 1.8em; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="main-title">CRAFTIVO <span class="spinning-ball">⚽</span></h1>
    <p class="sub-title">تغطية كأس العالم 2026 | بتوقيت مكة المكرمة</p>
</div>

<div class="tabs">
    <div class="tab" onclick="showPage('live', this)">المباشر</div>
    <div class="tab active" onclick="showPage('archive', this)">الأرشيف</div>
    <div class="tab" onclick="showPage('upcoming', this)">المباريات القادمة</div>
    <div class="tab" onclick="showPage('knockout', this)">الإقصائيات</div>
</div>

<div id="live" class="page">
    <h2 class="live-title">مباشر <span class="live-dot"></span></h2>
    <p class="update-text">جاري التحديث...</p>
</div>

<div id="archive" class="page active">
    <div id="archiveContainer"></div>
</div>

<div id="upcoming" class="page">
    <div id="upcomingContainer"></div>
</div>

<div id="knockout" class="page">
    <h2 style="text-align: center; color: #D4AF37; font-size: 2.5em;">خارطة الإقصائيات 🏆⏳</h2>
    <div class="group-card">
        <div class="match-row"><span>دور الـ 32</span><span></span><span>16 مباراة</span></div>
        <div class="match-row"><span>دور الـ 16</span><span></span><span>8 مباريات</span></div>
        <div class="match-row"><span>دور الـ 8 (ربع النهائي)</span><span></span><span>4 مباريات</span></div>
        <div class="match-row"><span>دور الـ 4 (نصف النهائي)</span><span></span><span>2 مباراة</span></div>
        <div class="match-row" style="color: #D4AF37; font-weight: bold;"><span>🏆 النهائي 🏆</span><span></span><span>مباراة واحدة</span></div>
    </div>
</div>

<div class="footer">Craft TV ♡ LMS</div>

        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

        el.classList.add('active');
    }

        {n: "ب", m: [{t1: "🇨🇦 كندا", s: "1 - 1", t2: "🇧🇦 البوسنة والهرسك"}, {t1: "🇶🇦 قطر", s: "1 - 1", t2: "🇨🇭 سويسرا"}, {t1: "🇨🇭 سويسرا", s: "4 - 1", t2: "🇧🇦 البوسنة والهرسك"}, {t1: "🇨🇦 كندا", s: "6 - 0", t2: "🇶🇦 قطر"}], p: "عدد النقاط: كندا (4)، سويسرا (4)، البوسنة والهرسك (1)، قطر (1)"},
        {n: "ج", m: [{t1: "🇧🇷 البرازيل", s: "1 - 1", t2: "🇲🇦 المغرب"}, {t1: "🇭🇹 هايتي", s: "0 - 1", t2: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا"}, {t1: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا", s: "0 - 1", t2: "🇲🇦 المغرب"}, {t1: "🇧🇷 البرازيل", s: "3 - 0", t2: "🇭🇹 هايتي"}], p: "عدد النقاط: المغرب (4)، البرازيل (4)، إسكتلندا (3)، هايتي (0)"},

        {n: "ز", m: ["🇪🇸 إسبانيا VS 🇸🇦 السعودية - 19:00", "🇺🇾 أوروغواي VS 🇨🇻 الرأس الأخضر - 22 يونيو، 01:00", "🇨🇻 الرأس الأخضر VS 🇸🇦 السعودية - 27 يونيو، 03:00", "🇺🇾 أوروغواي VS 🇪🇸 إسبانيا - 27 يونيو، 03:00"]},
        {n: "ح", m: ["🇧🇪 بلجيكا VS 🇮🇷 إيران - 22:00", "🇳🇿 نيوزيلندا VS 🇪🇬 مصر - 22 يونيو، 04:00", "🇳🇿 نيوزيلندا VS 🇧🇪 بلجيكا - 27 يونيو، 06:00", "🇪🇬 مصر VS 🇮🇷 إيران - 27 يونيو، 06:00"]},

    const arcCont = document.getElementById('archiveContainer');
    archiveData.forEach(g => {
        let h = `<div class="group-card"><div class="group-title">المجموعة ${g.n}</div>`;
        g.m.forEach(m => h += `<div class="match-row"><div class="team-r">${m.t1}</div><div class="score">${m.s}</div><div class="team-l">${m.t2}</div></div>`);
        arcCont.innerHTML += h + `<div class="points-row">${g.p}</div></div>`;
    });

    const upCont = document.getElementById('upcomingContainer');
    upcomingData.forEach(g => {
        let h = `<div class="group-card"><div class="group-title">المجموعة ${g.n}</div>`;
        g.m.forEach(m => h += `<div class="match-row" style="grid-template-columns: 1fr;"><div class="team-r">${m}</div></div>`);
        upCont.innerHTML += h + `</div>`;
    });
</script>
</body>
</html>
