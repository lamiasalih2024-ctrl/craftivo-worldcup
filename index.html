<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craftivo | تغطية كأس العالم 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #05070f; color: white; font-family: sans-serif; }
    .group-container { margin-top: 25px; border-bottom: 1px solid #222; padding-bottom: 15px; }
    .group-title { color: #fbbf24; font-size: 1.3rem; font-weight: 900; border-right: 4px solid #fbbf24; padding-right: 10px; margin-bottom: 15px; }
    .match-card { background: #111; border: 1px solid #333; border-radius: 10px; padding: 12px; margin-bottom: 8px; font-weight: bold; }
    .footer-signature { text-align: center; padding: 40px; margin-top: 50px; border-top: 1px solid #222; }
  </style>
</head>
<body class="p-4">

<div class="max-w-xl mx-auto">
  <div class="text-center py-6">
    <h1 class="text-4xl font-black text-yellow-500">Craftivo</h1>
    <p class="text-gray-400 font-bold">تغطية كأس العالم 2026</p>
    <p class="text-blue-500 text-xs mt-1 font-bold">بتوقيت مكة المكرمة</p>
  </div>

  <div id="app-container"></div>

  <div class="footer-signature">
    <div style="font-size: 2rem;">🤍</div>
    <p class="text-gray-400 font-bold mt-2">Craftivo | LMS</p>
    <p class="text-xs text-gray-600">تصميم وتطوير: لمياء صالح</p>
  </div>
</div>

<script>
const groups = ["A","B","C","D","E","F","G","H","I","J","K","L"];
// قاعدة بيانات كاملة لكل المجموعات مع الأعلام
const matchesData = [
  { group:"A", home:"المكسيك 🇲🇽", away:"جنوب أفريقيا 🇿🇦", score:"2 - 0" },
  { group:"B", home:"الأرجنتين 🇦🇷", away:"الجزائر 🇩🇿", score:"3 - 0" },
  { group:"C", home:"ألمانيا 🇩🇪", away:"كوراساو 🇨🇼", score:"7 - 1" },
  { group:"D", home:"أمريكا 🇺🇸", away:"باراغواي 🇵🇾", score:"4 - 1" },
  { group:"E", home:"أستراليا 🇦🇺", away:"تركيا 🇹🇷", score:"2 - 0" },
  { group:"F", home:"السويد 🇸🇪", away:"تونس 🇹🇳", score:"5 - 1" },
  { group:"G", home:"إيران 🇮🇷", away:"نيوزيلندا 🇳🇿", score:"2 - 2" },
  { group:"H", home:"فرنسا 🇫🇷", away:"السنغال 🇸🇳", score:"3 - 1" },
  { group:"I", home:"السعودية 🇸🇦", away:"الأوروغواي 🇺🇾", score:"1 - 1" },
  { group:"J", home:"البرازيل 🇧🇷", away:"المغرب 🇲🇦", score:"3 - 0" },
  { group:"K", home:"إيطاليا 🇮🇹", away:"نيجيريا 🇳🇬", score:"2 - 1" },
  { group:"L", home:"إسبانيا 🇪🇸", away:"مصر 🇪🇬", score:"0 - 0" }
];

const container = document.getElementById("app-container");

groups.forEach(g => {
  let div = document.createElement("div");
  div.className = "group-container";
  div.innerHTML = `<h2 class="group-title">المجموعة ${g}</h2>`;
  
  const matches = matchesData.filter(m => m.group === g);
  
  if(matches.length > 0) {
    matches.forEach(m => {
      div.innerHTML += `
        <div class="match-card flex justify-between items-center">
          <span>${m.home}</span>
          <span class="text-yellow-500 text-lg">${m.score}</span>
          <span>${m.away}</span>
        </div>`;
    });
  } else {
    div.innerHTML += `<p class="text-gray-600 text-sm italic mr-4">بانتظار المباريات...</p>`;
  }
  container.appendChild(div);
});
</script>
</body>
</html>
