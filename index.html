<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e17; color: #fff; font-family: sans-serif; }
        .page { display: none; } .page.active { display: block; }
        .nav-btn { flex: 1; padding: 12px; font-weight: 800; border-radius: 12px; background: #1f2937; color: #9ca3af; }
        .nav-btn.active { background: #eab308; color: #000; }
        .group-card { background: #111827; border: 1px solid #374151; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .match-divider { border-top: 1px solid #374151; margin: 15px 0; padding-top: 15px; }
        .team-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body class="p-4">

    <nav class="flex gap-2 mb-8">
        <button id="btn-live" class="nav-btn active" onclick="show('live', 'btn-live')">بث مباشر</button>
        <button id="btn-archive" class="nav-btn" onclick="show('archive', 'btn-archive')">السابقة</button>
        <button id="btn-upcoming" class="nav-btn" onclick="show('upcoming', 'btn-upcoming')">القادمة</button>
    </nav>

    <!-- المباشر -->
    <div id="live" class="page active text-center">
        <div class="group-card py-16"><p class="text-slate-400">لا توجد مباريات مباشرة حالياً</p></div>
    </div>

    <!-- السابقة (المجموعات من A لـ L) -->
    <div id="archive" class="page">
        <!-- تكرار هذا الكارد للمجموعات -->
        <div class="group-card">
            <h3 class="text-yellow-500 font-bold mb-4">المجموعة A</h3>
            <div class="team-row"><span>🇲🇽 المكسيك</span> <span>2</span></div>
            <div class="team-row"><span>🇿🇦 جنوب أفريقيا</span> <span>0</span></div>
            <div class="match-divider"></div>
            <div class="team-row"><span>🇰🇷 كوريا الجنوبية</span> <span>2</span></div>
            <div class="team-row"><span>🇨🇿 التشيك</span> <span>1</span></div>
        </div>
        
        <!-- يمكنكِ نسخ الكارد أعلاه وتغيير البيانات للمجموعات B, C...L -->
        <div class="group-card">
            <h3 class="text-yellow-500 font-bold mb-4">المجموعة B</h3>
            <div class="team-row"><span>🇨🇦 كندا</span> <span>1</span></div>
            <div class="team-row"><span>🇧🇦 البوسنة</span> <span>1</span></div>
            <div class="match-divider"></div>
            <div class="team-row"><span>🇶🇦 قطر</span> <span>1</span></div>
            <div class="team-row"><span>🇨🇭 سويسرا</span> <span>1</span></div>
        </div>
        <!-- وهكذا لكل المجموعات -->
    </div>

    <script>
        function show(pageId, btnId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.getElementById(btnId).classList.add('active');
        }
    </script>
</body>
</html>
