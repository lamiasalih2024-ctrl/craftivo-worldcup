<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Craftivo | البث المباشر</title>
<style>
  body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #070b16; color: #fff; padding: 20px; text-align: center; }
  .header-container { margin-top: 30px; margin-bottom: 40px; }
  .title { 
    font-size: 50px; font-weight: 900; 
    background: linear-gradient(to bottom, #ffd700, #b8860b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .live-indicator { 
    display: inline-flex; align-items: center; gap: 10px; 
    background: #1a2238; padding: 10px 25px; border-radius: 50px;
    border: 1px solid #ff3333; margin-bottom: 20px;
  }
  .live-dot { width: 12px; height: 12px; background: #ff3333; border-radius: 50%; animation: blink 1s infinite; }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  
  .match { 
    background: linear-gradient(145deg, #111827, #070b16); 
    padding: 20px; margin: 15px auto; border-radius: 20px; 
    display: flex; justify-content: space-between; align-items: center; 
    max-width: 500px; border: 1px solid #1f2a44; font-size: 20px;
  }
</style>
</head>
<body>

<div class="header-container">
  <div class="title">Craftivo</div>
  <div class="live-indicator"><div class="live-dot"></div> جاري البحث عن مباريات مباشرة...</div>
</div>

<div id="live-matches">جاري الاتصال بالسيرفر...</div>

<script>
const KEY = "e3af6b67b2839b4a1526bd2a3ab00e30";

async function fetchLiveMatches() {
  const box = document.getElementById("live-matches");
  try {
    // جلب المباريات المباشرة عالمياً بدون تحديد دوري لتجنب القيود
    const res = await fetch(`https://v3.football.api-sports.io/fixtures?live=all`, {
      headers: {"x-apisports-key": KEY}
    });
    const data = await res.json();
    
    if(!data.response || data.response.length === 0) { 
      box.innerHTML = "<p>لا توجد مباريات مباشرة حالياً. سيتم التحديث تلقائياً...</p>"; 
    } else {
      box.innerHTML = data.response.map(m => `
        <div class="match">
          <span>${m.teams.home.name}</span>
          <b style="color:#00ff88; font-size: 24px;">${m.goals.home} - ${m.goals.away}</b>
          <span>${m.teams.away.name}</span>
        </div>
      `).join('');
    }
  } catch(e) { 
    box.innerHTML = "يرجى التحقق من الاتصال."; 
  }
}

// تحديث الصفحة تلقائياً كل دقيقة لجلب الجديد
fetchLiveMatches();
setInterval(fetchLiveMatches, 60000);
</script>
</body>
</html>
