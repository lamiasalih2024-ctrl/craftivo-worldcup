<style>
    body { background-color: #0b0e14; color: #ffffff; font-family: 'Arial', sans-serif; padding: 20px; direction: rtl; }
    .brand-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #D4AF37; }
    .brand-title { color: #D4AF37; font-size: 3em; font-weight: 900; margin: 0; }
    
    .tabs { display: flex; justify-content: space-between; margin-bottom: 25px; gap: 5px; }
    .tab-btn { background: #1a1a1a; color: #D4AF37; border: 2px solid #D4AF37; padding: 12px; flex: 1; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9em; }
    .tab-btn.active { background: #D4AF37; color: #000; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .live-container { border: 2px solid #ff0000; padding: 25px; text-align: center; border-radius: 15px; }
    .live-text { color: #ff0000; font-size: 2.2em; font-weight: bold; }
    .blink-red { width: 18px; height: 18px; background: red; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
    .flash-white { animation: flash-white 1.5s infinite; color: #ffffff; font-size: 1.6em; margin-top: 10px; }

    .group-card { background: #1a1a1a; border: 2px solid #D4AF37; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
    .group-title { color: #D4AF37; font-size: 1.5em; text-align: center; font-weight: bold; margin-bottom: 12px; }
    .match-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #333; font-size: 1.2em; }
    .team { width: 42%; display: flex; align-items: center; }
    .score { width: 16%; text-align: center; font-weight: bold; color: #D4AF37; }

    @keyframes blink { 50% { opacity: 0; } }
    @keyframes flash-white { 50% { opacity: 0.3; } }
</style>

<div class="brand-header"><h1 class="brand-title">CRAFTIVO</h1></div>

<div class="tabs">
    <button class="tab-btn active" onclick="showTab('live')">المباشر</button>
    <button class="tab-btn" onclick="showTab('archive')">الأرشيف</button>
    <button class="tab-btn" onclick="showTab('upcoming')">القادمة</button>
    <button class="tab-btn" onclick="showTab('knockout')">الدور الإقصائي</button>
</div>

<!-- المباشر -->
<div id="live" class="tab-content active">
    <div class="live-container">
        <div class="live-text">مباشر <span class="blink-red"></span></div>
        <div class="flash-white">جاري التحديث...</div>
    </div>
</div>

</div>

<script>
    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }
</script>
