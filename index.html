<style>
    body { background-color: #0b0e14; color: #ffffff; font-family: 'Arial', sans-serif; padding: 20px; direction: rtl; }
    .brand-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #D4AF37; padding-bottom: 20px; }
    .brand-title { color: #D4AF37; font-size: 3em; font-weight: 900; text-transform: uppercase; margin: 0; }
    
    /* Live Section */
    .live-container { border: 2px solid #ff0000; padding: 15px; text-align: center; margin-bottom: 20px; border-radius: 10px; }
    .live-text { color: #ff0000; font-size: 1.8em; font-weight: bold; display: inline-block; }
    .blink-red { width: 15px; height: 15px; background: red; border-radius: 50%; display: inline-block; animation: blink 1s infinite; margin-left: 10px; }
    .status-text { color: #ffffff; font-size: 1.4em; animation: flash-white 1.5s infinite; }

    /* Tabs & Content */
    .group-card { background: #1a1a1a; border: 3px solid #D4AF37; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
    .group-title { color: #D4AF37; font-size: 1.8em; text-align: center; margin-bottom: 15px; font-weight: bold; }
    .match-row { display: flex; justify-content: space-between; align-items: center; font-size: 1.3em; padding: 10px 0; border-bottom: 1px solid #333; }
    .team { display: flex; align-items: center; width: 40%; }
    .score { font-weight: bold; color: #D4AF37; width: 20%; text-align: center; }
    
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes flash-white { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>

<div class="brand-header">
    <h1 class="brand-title">CRAFTIVO</h1>
</div>

<!-- Live Section -->
<div class="live-container">
    <div class="live-text">مباشر <span class="blink-red"></span></div>
    <div class="status-text">جاري التحديث...</div>
</div>

<script>
    const groups = [
        {n: "أ (A)", m: [
            {t1: "🇿🇦 جنوب أفريقيا", s: "2 - 0", t2: "🇲🇽 المكسيك"},
            {t1: "🇰🇷 كوريا الجنوبية", s: "2 - 1", t2: "🇨🇿 التشيك"},
            {t1: "🇿🇦 جنوب أفريقيا", s: "1 - 1", t2: "🇨🇿 التشيك"},
            {t1: "🇲🇽 المكسيك", s: "1 - 0", t2: "🇰🇷 كوريا الجنوبية"}
        ], pts: "المكسيك (3)، جنوب أفريقيا (4)، كوريا الجنوبية (3)، التشيك (1)"},
        // أضيفي باقي المجموعات بنفس هذا النسق...
    ];

    groups.forEach(g => {
        document.write(`<div class="group-card"><div class="group-title">المجموعة ${g.n}</div>`);
        g.m.forEach(m => {
            document.write(`
                <div class="match-row">
                    <div class="team" style="justify-content: flex-end;">${m.t1}</div>
                    <div class="score">${m.s}</div>
                    <div class="team" style="justify-content: flex-start;">${m.t2}</div>
                </div>
            `);
        });
        document.write(`<div style="margin-top:10px; font-size: 1.1em; color:#ccc;">النقاط: ${g.pts}</div></div>`);
    });
</script>
