<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #05070f; color: #fff; font-family: sans-serif; }
    .card { background: #1a1a2e; border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid #333; }
    .title-main { font-size: 2.5rem; font-weight: 900; color: #fbbf24; text-align: center; margin-top: 20px; }
    .subtitle { font-size: 1.2rem; text-align: center; color: #9ca3af; margin-bottom: 20px; }
    .match-text { font-size: 1.5rem; font-weight: bold; margin-top: 10px; }
    .live-badge { background: #dc2626; padding: 5px 15px; border-radius: 8px; font-weight: bold; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body class="p-4">

<div class="max-w-xl mx-auto">
  <div class="title-main">Craftivo</div>
  <p class="subtitle">التغطية الرسمية لكأس العالم 2026</p>

  <!-- قسم المباشر -->
  <div id="live-area" class="mb-8"></div>

  <!-- قسم الأرشيف -->
  <h2 class="text-xl font-bold text-yellow-500 mb-4">نتائج المباريات السابقة</h2>
  <div id="archive-area"></div>

  <div class="text-center mt-12 p-6 border-t border-gray-800">
    <div style="font-size: 2rem;">🤍</div>
    <p class="font-bold text-gray-500">Craftivo | LMS</p>
  </div>
</div>

<script>
const matches = [
  { group:"LIVE", home: "🇨🇬 الكونغو", away: "🇵🇹 البرتغال", score: "0 - 1" },
  { group:"A", home: "🇲🇽 المكسيك", away: "🇿🇦 ج.أفريقيا", score: "2 - 0" },
  { group:"B", home: "🇨🇦 كندا", away: "🇧🇦 البوسنة", score: "1 - 1" },
  { group:"C", home: "🇩🇪 ألمانيا", away: "🇨🇼 كوراساو", score: "7 - 1" },
  { group:"D", home: "🇫🇷 فرنسا", away: "🇸🇳 السنغال", score: "3 - 1" },
  { group:"E", home: "🇸🇪 السويد", away: "🇹🇳 تونس", score: "5 - 1" },
  { group:"F", home: "🇸🇦 السعودية", away: "🇺🇾 الأوروغواي", score: "1 - 1" },
  { group:"G", home: "🇮🇷 إيران", away: "🇳🇿 نيوزيلندا", score: "2 - 2" },
  { group:"H", home: "🇶🇦 قطر", away: "🇨🇭 سويسرا", score: "1 - 1" },
  { group:"I", home: "🇯🇵 اليابان", away: "🇳🇴 النرويج", score: "0 - 0" },
  { group:"J", home: "🇧🇷 البرازيل", away: "🇲🇦 المغرب", score: "3 - 0" },
  { group:"K", home: "🇮🇹 إيطاليا", away: "🇳🇬 نيجيريا", score: "2 - 1" },
  { group:"L", home: "🇪🇸 إسبانيا", away: "🇪🇬 مصر", score: "0 - 0" }
];

// 1. المباشر
const live = matches.find(m => m.group === "LIVE");
document.getElementById("live-area").innerHTML = `
  <div class="card border-red-800">
    <span class="live-badge">مباشر الآن 🔴</span>
    <div class="match-text">${live.home} ${live.score} ${live.away}</div>
  </div>`;

// 2. الأرشيف
const archive = document.getElementById("archive-area");
matches.filter(m => m.group !== "LIVE").forEach(m => {
  archive.innerHTML += `
    <div class="card">
      <div class="text-yellow-500 font-bold">المجموعة ${m.group}</div>
      <div class="match-text">${m.home} ${m.score} ${m.away}</div>
    </div>`;
});
</script>
</body>
</html>
