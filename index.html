<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Craftivo | تغطية كأس العالم 2026</title>
  <style>
    body { background: #05070f; color: white; font-family: sans-serif; }
    .card { background: rgba(255, 255, 255, 0.05); border: 1px solid #333; border-radius: 12px; padding: 15px; margin: 10px 0; }
  </style>
</head>
<body class="p-4">
  <h1 class="text-center text-4xl font-black text-yellow-500 py-6">Craftivo</h1>
  <div id="content" class="max-w-xl mx-auto">
    <div id="league-btn" class="card cursor-pointer hover:bg-yellow-500/10 text-center text-xl font-bold">
      كأس العالم 2026 (اضغط هنا للمباريات)
    </div>
  </div>

  <script>
    document.getElementById('league-btn').onclick = () => {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="text-center">جاري تحميل المباريات...</div>';
      
      fetch('/api/football?type=fixtures')
        .then(res => res.json())
        .then(data => {
          content.innerHTML = '<h2 class="text-center text-xl font-bold mb-4">جدول المباريات</h2>';
          data.response.forEach(m => {
            content.innerHTML += `
              <div class="card flex justify-between items-center">
                <span>${m.teams.home.name}</span>
                <span class="text-yellow-500 font-bold">${m.goals.home ?? '-'} : ${m.goals.away ?? '-'}</span>
                <span>${m.teams.away.name}</span>
              </div>`;
          });
        });
    };
  </script>
</body>
</html>
