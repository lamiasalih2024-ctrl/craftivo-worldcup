<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Craftivo | تغطية كأس العالم 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #05070f; color: white; font-family: sans-serif; }
    .group-wrapper { margin-top: 25px; border-bottom: 1px solid #222; padding-bottom: 20px; }
    .group-title { color: #fbbf24; font-size: 1.3rem; font-weight: 900; border-right: 4px solid #fbbf24; padding-right: 10px; margin-bottom: 15px; }
    .match-card { background: #111; border: 1px solid #333; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .live-indicator { color: #ef4444; font-weight: bold; font-size: 0.8rem; animation: blink 1s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>
</head>
<body class="p-4">

<div class="max-w-xl mx-auto">
  <div class="text-center py-6">
    <h1 class="text-4xl font-black text-yellow-500">Craftivo</h1>
    <p class="text-gray-400 font-bold">تغطية كأس العالم 2026</p>
    <p class="text-blue-500 text-xs font-bold">بتوقيت مكة المكرمة</p>
  </div>

  <div id="app"></div>

  <div class="text-center mt-12 pb-10">
    <div style="font-size: 2rem;">🤍</div>
    <p class="text-gray-400 font-bold">Craftivo | LMS</p>
  </div>
</div>

<script>
// 1. هيكل المجموعات الثابت (يظهر دائماً حتى لو لم تكن هناك مباريات)
const allGroups = ["A","B","C","D","E","F","G","H","I","J","K","L"];

// 2. الداتا القديمة (تظهر كمرجع إذا تعطل الـ API)
const backupData = [
  { group: "A", home: "المكسيك 🇲🇽", away: "جنوب أفريقيا 🇿🇦", score: "2 - 0", status: "FT" },
  { group: "H", home: "فرنسا 🇫🇷", away: "السنغال 🇸🇳", score: "3 - 1", status: "FT" }
];

async function updateData() {
  const app = document.getElementById("app");
  app.innerHTML = ""; // تنظيف

  try {
    // محاولة جلب الداتا من الـ API
    const response = await fetch("/api/football");
    const data = await response.json();
    render(data.response); // عرض الداتا الحية
  } catch (e) {
    console.warn("استخدام البيانات المخزنة");
    render(backupData); // عرض الداتا القديمة إذا توقف الـ API
  }
}

function render(matches) {
  const app = document.getElementById("app");
  allGroups.forEach(g => {
    let html = `<div class="group-wrapper"><h2 class="group-title">المجموعة ${g}</h2>`;
    const groupMatches = matches.filter(m => m.group === g);
    
    if(groupMatches.length > 0) {
      groupMatches.forEach(m => {
        html += `
          <div class="match-card flex justify-between items-center">
            <span>${m.home}</span>
            <div class="text-center">
              <span class="text-yellow-500 font-bold">${m.score}</span>
              ${m.status === "LIVE" ? '<br><span class="live-indicator">مباشر 🔴</span>' : ''}
            </div>
            <span>${m.away}</span>
          </div>`;
      });
    } else {
      html += `<p class="text-gray-600 text-sm italic mr-4">بانتظار المباريات...</p>`;
    }
    app.innerHTML += html + "</div>";
  });
}

updateData();
setInterval(updateData, 30000); // تحديث كل 30 ثانية
</script>
</body>
</html>
