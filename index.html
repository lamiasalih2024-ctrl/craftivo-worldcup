<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e17; color: white; font-family: sans-serif; }
        .page { display: none; padding: 20px; }
        .page.active { display: block; }
        .nav-btn { background: #1e293b; padding: 15px 25px; border-radius: 15px; font-weight: bold; font-size: 1.5rem; color: white; }
        .nav-btn.active { background: #eab308; color: black; }
        .data-card { background: #1a1f2e; padding: 30px; border-radius: 20px; margin-bottom: 20px; border: 2px solid #334155; font-size: 2rem; }
    </style>
</head>
<body>

    <!-- أزرار التنقل -->
    <div class="flex justify-center gap-4 mt-6">
        <button id="btn-live" class="nav-btn active" onclick="show('live', 'btn-live')">بث مباشر</button>
        <button id="btn-archive" class="nav-btn" onclick="show('archive', 'btn-archive')">السابقة</button>
        <button id="btn-upcoming" class="nav-btn" onclick="show('upcoming', 'btn-upcoming')">القادمة</button>
    </div>

    <!-- صفحة المباشر -->
    <div id="live" class="page active text-center mt-10">
        <div class="data-card text-5xl font-black text-slate-500">لا توجد مباراة مباشرة حالياً</div>
    </div>

    <!-- صفحة الأرشيف (النتائج) -->
    <div id="archive" class="page mt-10">
        <h2 class="text-4xl font-bold text-center mb-10 text-yellow-500">نتائج المباريات السابقة</h2>
        <div class="data-card">🇲🇽 المكسيك 2 - 0 جنوب أفريقيا | 🇰🇷 كوريا الجنوبية 2 - 1 التشيك</div>
        <div class="data-card">🇨🇦 كندا 1 - 1 البوسنة | 🇶🇦 قطر 1 - 1 سويسرا</div>
        <div class="data-card">🇧🇷 البرازيل 1 - 1 المغرب | 🏴󠁧󠁢󠁳󠁣󠁴󠁿 اسكتلندا 1 - 0 هايتي</div>
        <!-- (يتم إضافة باقي المجموعات بنفس هذا التنسيق الكبير) -->
    </div>

    <!-- صفحة القادمة -->
    <div id="upcoming" class="page mt-10">
        <div class="text-center mb-10">
            <h2 class="text-4xl font-bold">المباريات القادمة</h2>
            <p class="text-yellow-500 text-3xl font-bold mt-4">بتوقيت مكة المكرمة 🕋</p>
        </div>
        <div class="data-card">دور الـ 32 - موعد قريب جداً</div>
    </div>

    <script>
        function show(pageId, btnId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.getElementById(btnId).classList.add('active');
        }
    </script>
</body>
</html>
