<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تغطية كأس العالم 2026 | Craftivo</title>
    <style>
        body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; font-size: 18px; }
        .header { text-align: center; padding: 30px; border-bottom: 2px solid #D4AF37; }
        .main-title { font-size: 4em; font-weight: 900; color: #D4AF37; text-shadow: 0 0 20px #D4AF37; margin: 0; }
        .sub-title { font-size: 1.5em; color: #aaa; margin: 15px 0; }
        .tabs { display: flex; justify-content: center; gap: 10px; margin: 30px 0; flex-wrap: wrap; }
        .tab { padding: 15px 30px; background: #222; border: 2px solid #444; cursor: pointer; color: #D4AF37; border-radius: 8px; transition: 0.3s; font-size: 1.3em; font-weight: bold; }
        .tab.active { background: #D4AF37; color: #000; border-color: #D4AF37; }
        .page { display: none; padding: 25px; max-width: 900px; margin: auto; line-height: 1.6; }
        .page.active { display: block; }
        .group-card { background: #1a1a1a; border: 2px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        .group-title { color: #D4AF37; font-size: 1.6em; font-weight: bold; text-align: center; margin-bottom: 15px; border-bottom: 2px solid #444; padding-bottom: 10px; }
        .match-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #222; font-size: 1.3em; }
        .points-row { margin-top: 15px; padding-top: 10px; border-top: 2px dashed #444; text-align: center; color: #D4AF37; font-weight: bold; font-size: 1.1em; }
        .footer { text-align: center; padding: 40px; border-top: 2px solid #333; margin-top: 60px; color: #D4AF37; font-size: 1.5em; font-weight: bold; }
        @keyframes blink { 50% { opacity: 0; } }
        .live-dot { height: 15px; width: 15px; background-color: red; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="main-title">CRAFTIVO ⚽</h1>
    <p class="sub-title">تغطية كأس العالم 2026 | بتوقيت مكة المكرمة</p>
</div>

<div class="tabs">
    <div class="tab active" onclick="showPage('live', this)">المباشر</div>
    <div class="tab" onclick="showPage('archive', this)">الأرشيف</div>
    <div class="tab" onclick="showPage('upcoming', this)">المباريات القادمة</div>
    <div class="tab" onclick="showPage('knockout', this)">الإقصائيات</div>
</div>

<div id="live" class="page active">
    <h2 style="font-size: 2em;">مباشر <span class="live-dot"></span></h2>
    <p style="font-size: 1.5em; animation: blink 2s infinite;">جاري التحديث...</p>
</div>

<div id="archive" class="page">
    <div id="archiveContainer"></div>
</div>

<div id="upcoming" class="page">
    <div id="upcomingContainer"></div>
</div>

<div id="knockout" class="page">
    <h2 style="text-align: center; color: #D4AF37; font-size: 2em;">خارطة الإقصائيات 🏆⏳</h2>
    <div class="group-card">
        <div class="match-row"><span>دور الـ 32</span><span>16 مباراة</span></div>
        <div class="match-row"><span>دور الـ 16</span><span>8 مباريات</span></div>
        <div class="match-row"><span>دور الـ 8 (ربع النهائي)</span><span>4 مباريات</span></div>
        <div class="match-row"><span>دور الـ 4 (نصف النهائي)</span><span>2 مباراة</span></div>
        <div class="match-row" style="color: #D4AF37; font-weight: bold;"><span>🏆 النهائي 🏆</span><span>مباراة واحدة</span></div>
    </div>
</div>

<div class="footer">Craft TV ♡ LMS</div>

<script>
    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    const archiveData = [
        {n: "أ", m: [{t1: "🇲🇽 المكسيك", s: "2 - 0", t2: "🇿🇦 جنوب أفريقيا"}, {t1: "🇰🇷 كوريا الجنوبية", s: "2 - 1", t2: "🇨🇿 التشيك"}], p: "🇿🇦 ج.أفريقيا (3) | 🇰🇷 كوريا (3) | 🇨🇿 التشيك (1) | 🇲🇽 المكسيك (0)"},
        {n: "ب", m: [{t1: "🇨🇦 كندا", s: "1 - 1", t2: "🇧🇦 البوسنة"}, {t1: "🇶🇦 قطر", s: "1 - 1", t2: "🇨🇭 سويسرا"}], p: "🇨🇦 كندا (2) | 🇧🇦 البوسنة (2) | 🇶🇦 قطر (2) | 🇨🇭 سويسرا (2)"},
        {n: "ج", m: [{t1: "🇧🇷 البرازيل", s: "1 - 1", t2: "🇲🇦 المغرب"}, {t1: "🇭🇹 هايتي", s: "0 - 1", t2: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا"}], p: "🏴󠁧󠁢󠁳󠁣󠁴󠁿 إسكتلندا (3) | 🇧🇷 البرازيل (1) | 🇲🇦 المغرب (1) | 🇭🇹 هايتي (0)"},
        {n: "د", m: [{t1: "🇺🇸 أمريكا", s: "4 - 1", t2: "🇵🇾 باراغواي"}, {t1: "🇦🇺 أستراليا", s: "0 - 2", t2: "🇹🇷 تركيا"}], p: "🇺🇸 أمريكا (3) | 🇹🇷 تركيا (3) | 🇦🇺 أستراليا (0) | 🇵🇾 باراغواي (0)"}
    ];

    const upcomingData = [
        {n: "هـ", m: [{t: "🇩🇪 ألمانيا VS 🇨🇮 ساحل العاج", d: "اليوم، 23:00"}]},
        {n: "و", m: [{t: "🇳🇱 هولندا VS 🇸🇪 السويد", d: "اليوم، 20:00"}]}
    ];

    const arcCont = document.getElementById('archiveContainer');
    archiveData.forEach(g => {
        let h = `<div class="group-card"><div class="group-title">المجموعة ${g.n}</div>`;
        g.m.forEach(m => h += `<div class="match-row"><span>${m.t1}</span><span style="color:#D4AF37;">${m.s}</span><span>${m.t2}</span></div>`);
        arcCont.innerHTML += h + `<div class="points-row">${g.p}</div></div>`;
    });

    const upCont = document.getElementById('upcomingContainer');
    upcomingData.forEach(g => {
        let h = `<div class="group-card"><div class="group-title">المجموعة ${g.n}</div>`;
        g.m.forEach(m => h += `<div class="match-row"><span>${m.t}</span><span style="font-size:0.8em; color:#888;">${m.d}</span></div>`);
        upCont.innerHTML += h + `</div>`;
    });
</script>
</body>
</html>
