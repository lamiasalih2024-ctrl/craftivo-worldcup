<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Craftivo | تغطية كأس العالم 2026</title>
  <style>
    body { background: #05070f; color: white; font-family: sans-serif; }
    .match-card { background: rgba(255, 255, 255, 0.05); border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 10px; }
    .group-title { color: #eab308; font-size: 1.2rem; font-weight: 800; margin-top: 25px; border-bottom: 2px solid #eab308; display: inline-block; }
    footer { margin-top: 40px; padding: 30px; text-align: center; color: #ffffff; font-size: 0.9rem; border-top: 1px solid #333; }
  </style>
</head>
<body class="p-4">
  <header class="text-center py-6">
    <h1 class="text-5xl font-black text-yellow-500">Craftivo</h1>
    <p class="text-gray-300 mt-2 font-bold">التغطية الرسمية | توقيت مكة</p>
  </header>

  <main class="max-w-xl mx-auto">
    <h2 class="group-title">سجل النتائج (المجموعات A-L)</h2>
    <div id="manual-results"></div>
    
    <h2 class="group-title mt-8">مباريات اليوم</h2>
    <div id="api-fixtures" class="text-center text-gray-400">جاري تحميل المباريات...</div>

    <h2 class="group-title mt-8">خارطة الأدوار</h2>
    <div class="match-card text-center text-gray-300">🏆 دور الـ 32 | 🏟️ دور الـ 16 | 🏅 ربع النهائي</div>
  </main>

  <footer>
    <p>Craftivo &copy; 2026 | تطوير: LMS Systems</p>
  </footer>

  <script>
    let oldData = [];
    if ("Notification" in window) Notification.requestPermission();

    const manualMatches = [
      { g: "المجموعة A", h: "المكسيك", a: "جنوب أفريقيا", s: "2 - 0" }, { g: "المجموعة A", h: "قطر", a: "سويسرا", s: "1 - 1" },
      { g: "المجموعة B", h: "الأرجنتين", a: "الجزائر", s: "3 - 0" }, { g: "المجموعة B", h: "النمسا", a: "الأردن", s: "3 - 1" },
      { g: "المجموعة C", h: "ألمانيا", a: "كوراساو", s: "7 - 1" }, { g: "المجموعة C", h: "كوريا الجنوبية", a: "التشيك", s: "2 - 1" },
      { g: "المجموعة D", h: "كندا", a: "البوسنة", s: "1 - 1" }, { g: "المجموعة D", h: "أمريكا", a: "باراغواي", s: "4 - 1" },
      { g: "المجموعة E", h: "أستراليا", a: "تركيا", s: "2 - 0" }, { g: "المجموعة E", h: "ساحل العاج", a: "الإكوادور", s: "1 - 0" },
      { g: "المجموعة F", h: "هولندا", a: "اليابان", s: "2 - 2" }, { g: "المجموعة F", h: "السويد", a: "تونس", s: "5 - 1" },
      { g: "المجموعة G", h: "إيران", a: "نيوزيلندا", s: "2 - 2" }, { g: "المجموعة G", h: "إسبانيا", a: "الرأس الأخضر", s: "0 - 0" },
      { g: "المجموعة H", h: "فرنسا", a: "السنغال", s: "3 - 1" }, { g: "المجموعة H", h: "العراق", a: "النرويج", s: "1 - 4" },
      { g: "المجموعة I", h: "السعودية", a: "الأوروغواي", s: "1 - 1" }, { g: "المجموعة J", h: "-", a: "-", s: "..." },
      { g: "المجموعة K", h: "-", a: "-", s: "..." }, { g: "المجموعة L", h: "-", a: "-", s: "..." }
    ];

    const container = document.getElementById('manual-results');
    manualMatches.forEach(m => {
      container.innerHTML += `
        <div class="match-card text-center">
          <p class="text-[9px] text-yellow-600">${m.g}</p>
          <div class="flex justify-between items-center font-bold">
            <span>${m.h}</span> <span class="text-yellow-500">${m.s}</span> <span>${m.a}</span>
          </div>
        </div>`;
    });

    async function checkMatches() {
      const apiDiv = document.getElementById('api-fixtures');
      try {
        const res = await fetch('/api/football');
        const data = await res.json();
        const matches = data?.response || [];
        
        apiDiv.innerHTML = matches.length === 0 ? "لا توجد مباريات حالياً" : "";

        matches.forEach(m => {
          const status = m?.fixture?.status?.short || "NS";
          const score = status === "FT" ? `${m?.goals?.home} - ${m?.goals?.away}` : "VS";
          const time = new Date(new Date(m.fixture.date).getTime() + (3 * 3600000)).toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'});
          
          apiDiv.innerHTML += `
            <div class="match-card border border-blue-500/30">
              <p class="text-xs text-blue-400">${status === "FT" ? "انتهت" : status} | الساعة ${time} مكة</p>
              <div class="font-bold text-center">${m.teams.home.name} vs ${m.teams.away.name}</div>
              <div class="text-yellow-500 text-center font-bold">${score}</div>
            </div>`;

          const oldMatch = oldData.find(old => old.fixture.id === m.fixture.id);
          if (oldMatch && oldMatch.fixture.status.short !== "FT" && status === "FT") {
            new Notification("🏁 انتهت المباراة", { body: `${m.teams.home.name} ${m.goals.home} - ${m.goals.away} ${m.teams.away.name}` });
          }
        });
        oldData = matches;
      } catch(e) { apiDiv.innerHTML = "خطأ في الاتصال بالبيانات"; }
    }
    setInterval(checkMatches, 30000);
    checkMatches();
  </script>
</body>
</html>
