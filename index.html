<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Craftivo | تغطية كأس العالم 2026</title>
</head>
<body class="bg-[#0b0e17] text-white p-4">
    <div class="max-w-4xl mx-auto space-y-12">
        <header class="text-center py-8">
            <h1 class="text-7xl font-black text-yellow-500 mb-6">Craftivo</h1>
            <p class="text-slate-400 text-4xl">تغطية كأس العالم 2026</p>
        </header>

        <div class="flex justify-center gap-6 mb-12 bg-[#1a1f2e] p-6 rounded-full border border-slate-700">
            <button onclick="showTab('live')" class="bg-yellow-600 text-black px-12 py-5 rounded-full font-black text-3xl">بث مباشر</button>
            <button onclick="showTab('history')" class="text-slate-300 hover:text-white px-12 py-5 rounded-full font-black text-3xl">المباريات السابقة</button>
            <button onclick="showTab('upcoming')" class="text-slate-300 hover:text-white px-12 py-5 rounded-full font-black text-3xl">القادمة</button>
        </div>

        <div id="live" class="tab-content">
            <div class="bg-[#1a1f2e] p-12 rounded-[3rem] border-4 border-yellow-500 text-center shadow-2xl">
                <h2 class="text-5xl font-bold text-yellow-500 mb-8 animate-pulse">🔴 Live Match Now</h2>
                <div class="text-6xl font-black flex justify-center items-center gap-8">
                    <span>🇲🇽 Mexico</span> 
                    <span class="text-yellow-500">2 - 0</span> 
                    <span>🇿🇦 S.Africa</span>
                </div>
            </div>
        </div>

        <div id="history" class="tab-content hidden space-y-8">
            <div class="grid grid-cols-1 gap-8">
                <div class="bg-[#1a1f2e] p-10 rounded-[3rem] border border-slate-700">
                    <h3 class="text-yellow-500 font-bold text-5xl mb-6">Group A</h3>
                    <div class="text-4xl font-bold space-y-4">
                        <p>🇲🇽 Mexico 2 - 0 South Africa</p>
                        <p>🇰🇷 S.Korea 2 - 1 Czech Rep</p>
                    </div>
                    <p class="text-yellow-500 text-3xl mt-6 font-bold">Points: Mexico(3), S.Korea(3)</p>
                </div>
            </div>
        </div>

        <footer class="text-center text-slate-500 py-16 border-t border-slate-800">
            <p class="text-4xl font-bold">Craftivo Studio 2026 ©</p>
            <p class="text-5xl mt-6">LMS 🤍</p>
        </footer>
    </div>

    <script>
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
    </script>
</body>
</html>
