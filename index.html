<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Craftivo | تغطية كأس العالم 2026</title>
  <style>
    body { background: #05070f; color: white; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    .match-card { background: rgba(255, 255, 255, 0.05); border: 1px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
    .group-title { color: #eab308; font-size: 1.2rem; font-weight: 800; margin-top: 25px; padding-bottom: 5px; border-bottom: 2px solid #eab308; display: inline-block; }
    footer { margin-top: auto; padding: 30px; text-align: center; color: #555; font-size: 0.8rem; border-top: 1px solid #222; }
  </style>
</head>
<body class="p-4">
  <header class="text-center py-6">
    <h1 class="text-5xl font-black text-yellow-500">Craftivo</h1>
    <p class="text-gray-400 mt-2 font-bold">التغطية الرسمية لكأس العالم 2026</p>
  </header>

  <main id="content" class="max-w-xl mx-auto flex-grow">
    <!-- هنا ستظهر البيانات -->
  </main>

  <footer>
    <p>Craftivo &copy; 2026 | تطوير: LMS Systems</p>
    <p class="mt-1">نظام تغطية المباريات الذكي</p>
  </footer>

  <script>
    // سجل البيانات الشامل (المجموعات + الأعلام + النتائج)
    const worldCupData = {
      "المجموعة الأولى": [
        { home: "🇲🇽 المكسيك", away: "🇿🇦 جنوب أفريقيا", score: "2 - 0", status: "انتهت" },
        { home: "🇶🇦 قطر", away: "🇨🇭 سويسرا", score: "1 - 1", status: "انتهت" },
        { home: "🇨🇦 كندا", away: "🇧🇦 البوسنة", score: "VS", status: "2026-06-20" }
      ],
      "المجموعة الثانية": [
        { home: "🇦🇷 الأرجنتين", away: "🇩🇿 الجزائر", score: "3 - 0", status: "انتهت" },
        { home: "🇦🇹 النمسا", away: "🇯🇴 الأردن", score: "3 - 1", status: "انتهت" },
        { home: "🇸🇦 السعودية", away: "🇺🇾 الأوروغواي", score: "VS", status: "2026-06-21" }
      ],
      "المجموعة الثالثة": [
        { home: "🇩🇪 ألمانيا", away: "🇨🇼 كوراساو", score: "7 - 1", status: "انتهت" },
        { home: "🇰🇷 كوريا الجنوبية", away: "🇨🇿 التشيك", score: "2 - 1", status: "انتهت" },
        { home: "🇧🇪 بلجيكا", away: "🇪🇬 مصر", score: "1 - 1", status: "انتهت" }
      ]
      // يمكنكِ إضافة باقي المجموعات بنفس التنسيق
    };

    const content = document.getElementById('content');
    
    // عرض المجموعات
    for (const [groupName, matches] of Object.entries(worldCupData)) {
      content.innerHTML += `<h2 class="group-title">${groupName}</h2>`;
      matches.forEach(m => {
        content.innerHTML += `
          <div class="match-card text-center">
            <div class="flex justify-between items-center text-sm font-bold">
              <span class="w-1/3">${m.home}</span>
              <span class="text-yellow-500 w-1/3 text-lg">${m.score}</span>
              <span class="w-1/3">${m.away}</span>
            </div>
            <p class="text-[10px] mt-2 text-gray-400">${m.status === "انتهت" ? "✅ انتهت" : "📅 التاريخ: " + m.status}</p>
          </div>`;
      });
    }
  </script>
</body>
</html>
