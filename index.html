<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Craftivo | تغطية كأس العالم 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #05070f; color: white; font-family: sans-serif; }
    .card { background: #111; border: 1px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
    .group-label { color: #fbbf24; font-size: 1.3rem; font-weight: 900; margin-top: 25px; margin-bottom: 10px; border-right: 4px solid #fbbf24; padding-right: 10px; display: block; }
    .footer { text-align: center; padding: 40px; margin-top: 50px; border-top: 1px solid #222; }
    .flag { font-size: 1.2rem; margin: 0 5px; }
  </style>
</head>
<body class="p-4">

<div class="max-w-xl mx-auto">
  <div class="text-center py-6">
    <h1 class="text-5xl font-black text-yellow-500">Craftivo</h1>
    <p class="text-gray-300 font-bold mt-2">تغطية كأس العالم 2026</p>
    <p class="text-blue-500 text-sm font-bold">بتوقيت مكة المكرمة</p>
  </div>

  <div id="app-container"></div>

  <div class="footer">
    <div style="font-size: 2rem;">🤍</div>
    <p class="text-gray-400 font-bold mt-2">Craftivo | LMS</p>
    <p class="text-xs text-gray-600">تصميم وتطوير: لمياء صالح</p>
  </div>
</div>

<script>
// 1. قاموس الأعلام (ربط اسم الدولة بالـ Emoji)
const flagMap = {
  "المكسيك": "🇲🇽", "جنوب أفريقيا": "🇿🇦", "الأرجنتين": "🇦🇷", "الجزائر": "🇩🇿",
  "ألمانيا": "🇩🇪", "كوراساو": "🇨🇼", "قطر": "🇶🇦", "سويسرا": "🇨🇭",
  "فرنسا": "🇫🇷", "السنغال": "🇸🇳", "العراق": "🇮🇶", "النرويج": "🇳🇴",
  "السعودية": "🇸🇦", "الأوروغواي": "🇺🇾", "هولندا": "🇳🇱", "اليابان": "🇯🇵"
  // يمكنك إضافة بقية الدول هنا بنفس الطريقة
};

const groups = ["A","B","C","D","E","F","G","H","I","J","K","L"];
const appContainer = document.getElementById("app-container");

// بناء الهيكل
groups.forEach(g => {
  appContainer.innerHTML += `
    <div class="group-container">
      <span class="group-label">المجموعة ${g}</span>
      <div id="group-${g}"></div>
    </div>
  `;
});

// 2. دالة العرض مع الأعلام
function renderMatches(matches) {
  matches.forEach(m => {
    const group = m.group || "A";
    const target = document.getElementById(`group-${group}`);
    if (!target) return;

    // جلب الأعلام
    const homeFlag = flagMap[m.homeName] || "🏳️";
    const awayFlag = flagMap[m.awayName] || "🏳️";
    
    target.innerHTML += `
      <div class="card">
        <div class="flex justify-between items-center font-bold text-lg">
          <span>${homeFlag} ${m.homeName}</span>
          <span class="text-yellow-500">${m.score}</span>
          <span>${m.awayName} ${awayFlag}</span>
        </div>
        <div class="text-xs text-gray-500 mt-2">
            النقاط: ${m.points} | الفارق: ${m.diff}
        </div>
      </div>
    `;
  });
}

// 3. البيانات (الربط مع الـ API سيوضع هنا مكان القائمة الثابتة)
const demoMatches = [
  { group: "A", homeName: "المكسيك", awayName: "جنوب أفريقيا", score: "2 - 0", points: 3, diff: 2 },
  { group: "H", homeName: "فرنسا", awayName: "السنغال", score: "3 - 1", points: 3, diff: 2 }
];

renderMatches(demoMatches);
</script>

</body>
</html>
