<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Craftivo | تغطية كأس العالم 2026</title>
</head>
<body class="bg-slate-950 text-white p-6">
    <div class="max-w-2xl mx-auto">
        <!-- العنوان -->
        <div class="text-center mb-10">
            <h1 class="text-5xl font-black text-yellow-500 mb-2">Craftivo</h1>
            <p class="text-slate-400 text-lg">تغطية كأس العالم 2026</p>
        </div>

        <!-- المجموعات -->
        <div class="space-y-6 mb-12">
            <!-- هيكل المجموعة -->
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-700">
                <h3 class="text-yellow-500 font-bold text-xl mb-4 border-b border-slate-800 pb-2">المجموعة A</h3>
                <div class="space-y-3">
                    <div class="flex justify-between items-center text-md"><span>المكسيك × جنوب أفريقيا</span> <span class="bg-green-700 px-3 py-1 rounded-lg font-bold">2-0</span></div>
                    <div class="flex justify-between items-center text-md"><span>كوريا الجنوبية × التشيك</span> <span class="bg-green-700 px-3 py-1 rounded-lg font-bold">2-1</span></div>
                </div>
            </div>
            
            <!-- (كرري هذا الهيكل لكل المجموعات B حتى L مع تغيير النتائج) -->
            <!-- سأضع لك مثالاً لمجموعة غير ملعوبة لترحي الطريقة -->
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-700 opacity-70">
                <h3 class="text-blue-400 font-bold text-xl mb-4 border-b border-slate-800 pb-2">المجموعة I</h3>
                <div class="space-y-3">
                    <div class="flex justify-between items-center text-md"><span>فرنسا × السنغال</span> <span class="bg-slate-800 px-3 py-1 rounded-lg">-</span></div>
                    <div class="flex justify-between items-center text-md"><span>العراق × النرويج</span> <span class="bg-slate-800 px-3 py-1 rounded-lg">-</span></div>
                </div>
            </div>
        </div>

        <!-- أدوار البطولة -->
        <h2 class="text-2xl font-bold text-yellow-500 mb-6 border-b border-slate-800 pb-2">خارطة الطريق نحو النهائي 🏆</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center font-bold text-slate-400">دور الـ 32</div>
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center font-bold text-slate-400">دور الـ 16</div>
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center font-bold text-slate-400">دور الـ 8</div>
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center font-bold text-slate-400">نصف النهائي</div>
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center font-bold text-yellow-500 col-span-1 md:col-span-2">النهائي الكبير</div>
        </div>

        <!-- التذييل -->
        <footer class="mt-16 text-center border-t border-slate-800 pt-8">
            <p class="text-yellow-500 font-bold text-lg">© 2026 Craftivo Studio</p>
        </footer>
    </div>
</body>
</html>
