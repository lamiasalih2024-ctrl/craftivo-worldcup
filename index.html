<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Craftivo TV | تغطية كأس العالم 2026</title>

<style>
body {
    font-family: sans-serif;
    background: #0b0f1a;
    margin: 0;
    color: white;
}

/* الهيدر */
.header {
    text-align: center;
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
}

.sub {
    font-size: 14px;
    color: #aaa;
}

/* NAV */
.nav-bar {
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 10px;
}

.nav-btn {
    padding: 12px 25px;
    border: none;
    background: #1f2a44;
    color: white;
    border-radius: 10px;
    cursor: pointer;
}

.nav-btn:hover {
    background: #2d3f66;
}

/* الصفحات */
.page-content { display: none; padding: 20px; }
.active { display: block; }

/* الكارد */
.card {
    background: #111a2e;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
}

/* LIVE indicator */
.live-indicator {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #ff3b3b;
    font-weight: bold;
}

.dot {
    width: 10px;
    height: 10px;
    background: red;
    border-radius: 50%;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

/* 🟢 GREEN FLASH */
.green-flash {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #00ff88;
    color: #000;
    padding: 12px 25px;
    border-radius: 12px;
    font-weight: bold;
    box-shadow: 0 0 20px #00ff88;
    animation: fadeOut 2s forwards;
    z-index: 9999;
}

@keyframes fadeOut {
    0% { opacity: 1; transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) scale(0.9); }
}

/* الفرق */
.match {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin-top: 20px;
}

.team img {
    width: 60px;
    height: 40px;
    border-radius: 5px;
}

.status {
    margin-top: 15px;
    color: #ffd166;
}
</style>
</head>

<body>

<div class="header">
⚽ Craftivo TV
<div class="sub">تغطية كأس العالم 2026 ❤️</div>
</div>

<div class="nav-bar">
    <button class="nav-btn" onclick="openPage('live')">مباشر</button>
    <button class="nav-btn" onclick="openPage('archive')">السابقة</button>
    <button class="nav-btn" onclick="openPage('upcoming')">القادمة</button>
</div>

<!-- LIVE -->
<div id="live" class="page-content active">
    <div class="card">

        <div id="liveStatus" class="live-indicator">
            <div class="dot"></div> LIVE
        </div>

        <div id="matchBox">
            جاري التحديث...
        </div>

    </div>
</div>

<!-- ARCHIVE -->
<div id="archive" class="page-content">
    <div class="card">المباريات السابقة</div>
</div>

<!-- UPCOMING -->
<div id="upcoming" class="page-content">
    <div class="card">المباريات القادمة</div>
</div>

<script>

function openPage(pageName) {

    document.querySelectorAll('.page-content')
        .forEach(p => p.classList.remove('active'));

    document.getElementById(pageName).classList.add('active');

    // 🟢 عند دخول LIVE يظهر وميض أخضر
    if (pageName === 'live') {
        showGreenFlash("تم الدخول إلى البث المباشر");
    }
}

/* 🟢 GREEN FLASH FUNCTION */
function showGreenFlash(message) {
    const flash = document.createElement("div");
    flash.className = "green-flash";
    flash.innerText = message;

    document.body.appendChild(flash);

    setTimeout(() => {
        flash.remove();
    }, 2000);
}

/* API LIVE MATCH */
async function loadLiveMatch() {
    const box = document.getElementById("matchBox");

    try {
        // ضع API الحقيقي هنا
        const response = await fetch("https://api.example.com/live-match");
        const data = await response.json();

        if (!data || !data.isLive) {
            box.innerHTML = "⚠️ لا توجد مباراة مباشرة حالياً";
            return;
        }

        box.innerHTML = `
            <div class="match">

                <div>
                    <img src="${data.teamA.flag}">
                    <div>${data.teamA.name}</div>
                </div>

                <div style="font-size:28px;font-weight:bold;">
                    ${data.scoreA} - ${data.scoreB}
                </div>

                <div>
                    <img src="${data.teamB.flag}">
                    <div>${data.teamB.name}</div>
                </div>

            </div>

            <div class="status">🟡 المباراة مباشرة</div>
        `;

    } catch (e) {
        box.innerHTML = "⚠️ خطأ في تحميل البيانات";
    }
}

loadLiveMatch();
setInterval(loadLiveMatch, 15000);

</script>

</body>
</html>
