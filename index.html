<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Craftivo | تغطية كأس العالم 2026</title>
<style>
  body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #070b16; color: #fff; padding: 20px; }
  
  .header-container { text-align: center; margin-top: 30px; margin-bottom: 40px; }
  
  /* هنا تعديل اللون الذهبي والخط */
  .title { 
    font-size: 55px; font-weight: 900; 
    color: #ffd700; /* لون ذهبي */
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    margin: 0;
  }
  
  .subtitle { font-size: 24px; color: #00ff88; margin-top: 10px; }
  
  .nav-bar { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; }
  .nav-btn { 
    padding: 15px 30px; font-size: 18px; font-weight: 700; border-radius: 50px; 
    cursor: pointer; background: #1a2238; border: 1px solid #2d3e66; color: #fff; 
    transition: 0.3s; display: flex; align-items: center; gap: 8px;
  }
  .nav-btn:hover { background: #2d3e66; border-color: #00ff88; }
  
  .live-dot { 
    width: 10px; height: 10px; background: #ff3333; border-radius: 50%; 
    box-shadow: 0 0 8px #ff3333; animation: blink 1.5s infinite; 
  }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  
  .page { display: none; }
  .page.active { display: block; }
  
  .match { 
    background: linear-gradient(145deg, #111827, #070b16); 
    padding: 20px; margin: 15px auto; border-radius: 25px; 
    display: flex; justify-content: space-between; align-items: center; 
    max-width: 600px; border: 1px solid #1f2a44; font-size: 20px;
  }
  
  .footer { text-align: center; margin-top: 50px; font-size: 18px; opacity: 0.6; }
</style>
</head>
<body>

<div class="header-container">
  <div class="title">🪶 Craftivo ⚽</div>
  <div class="subtitle">تغطية كأس العالم 2026</div>
</div>

<div class="nav-bar">
  <button class="nav-btn" onclick="openPage('live')"><span class="live-dot"></span> مباشر</button>
  <button class="nav-btn" onclick="openPage('archive')">📺 السابقة</button>
  <button class="nav-btn" onclick="openPage('upcoming')">⏳ القادمة</button>
</div>

<div id="live" class="page active"><div id="live-matches" style="text-align:center;">جاري التحميل...</div></div>
<div id="archive" class="page"><div id="archive-matches" style="text-align:center;">جاري التحميل...</div></div>
<div id="upcoming" class="page"><div id="upcoming-matches" style="text-align:center;">جاري التحميل...</div></div>

<div class="footer">LMS 🤍</div>

<script>
function openPage(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

const KEY = "7963d39579msh5453e0591f414a3p1d5c2ajsn5501d6706e57"; 

async function loadMatches(endpoint, boxId) {
  const box = document.getElementById(boxId);
  try {
    const res = await fetch(`https://v3.football.api-sports.io/${endpoint}`, {
      headers: {"x-apisports-key": KEY}
    });
    const data = await res.json();
    if(!data.response || data.response.length === 0) { box.innerHTML = "<p>لا توجد مباريات حالياً.</p>"; return; }
    
    box.innerHTML = data.response.map(m => `
      <div class="match">
        <span>${m.teams.home.name}</span>
        <b style="color:#00ff88;">${m.goals.home ?? '0'} - ${m.goals.away ?? '0'}</b>
        <span>${m.teams.away.name}</span>
      </div>
    `).join('');
  } catch(e) { box.innerHTML = "حدث خطأ في الاتصال."; }
}

loadMatches("fixtures?live=all", "live-matches");
loadMatches("fixtures?league=1&season=2026&status=FT", "archive-matches");
loadMatches("fixtures?league=1&season=2026&status=NS", "upcoming-matches");
</script>
</body>
</html>
